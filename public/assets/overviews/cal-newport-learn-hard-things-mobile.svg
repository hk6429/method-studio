<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="cal-newport-learn-hard-things-title cal-newport-learn-hard-things-desc"><title id="cal-newport-learn-hard-things-title">學會難的東西：一階一階往上爬</title><desc id="cal-newport-learn-hard-things-desc">換模型 → 選難事 → 畫樓梯 → 刻意練習 → 挪時間 → 排行事曆；站上一階，再畫下一階。</desc>
