<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ai-adoption-vs-effectiveness-title ai-adoption-vs-effectiveness-desc"><title id="ai-adoption-vs-effectiveness-title">分清 adoption 與 effectiveness</title><desc id="ai-adoption-vs-effectiveness-desc">定目標 → 三群清單 → 盤三職能 → 拆驗收 → 排產能 → 分開量；全員會用不等於績效有感。</desc>
<defs><marker id="ai-adoption-vs-effectiveness-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">AI 導入 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">全員會用，不等於績效有感</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="360" height="190" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="22">01</text>
<text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">定目標</text>
<text x="56" y="292" fill="#d4e2d4" font-size="24">adoption 或 effectiveness</text>
<path d="M398 255H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-adoption-vs-effectiveness-arrow)"/>
<rect x="420" y="160" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="195" fill="#586b60" font-size="22">02</text>
<text x="440" y="245" fill="#193732" font-size="36" font-weight="650">三群清單</text>
<text x="440" y="292" fill="#586b60" font-size="24">學會用、驗、選</text>
<path d="M782 255H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-adoption-vs-effectiveness-arrow)"/>
<rect x="804" y="160" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="195" fill="#586b60" font-size="22">03</text>
<text x="824" y="245" fill="#193732" font-size="36" font-weight="650">盤三職能</text>
<text x="824" y="292" fill="#586b60" font-size="24">場景、開發、AI PM</text>
<rect x="36" y="386" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="421" fill="#586b60" font-size="22">04</text>
<text x="56" y="471" fill="#193732" font-size="36" font-weight="650">拆驗收</text>
<text x="56" y="518" fill="#586b60" font-size="24">門檻與人工檢查</text>
<path d="M398 481H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-adoption-vs-effectiveness-arrow)"/>
<rect x="420" y="386" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="421" fill="#586b60" font-size="22">05</text>
<text x="440" y="471" fill="#193732" font-size="36" font-weight="650">排產能</text>
<text x="440" y="518" fill="#586b60" font-size="24">省下的時間去哪</text>
<path d="M782 481H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-adoption-vs-effectiveness-arrow)"/>
<rect x="804" y="386" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="421" fill="#586b60" font-size="22">06</text>
<text x="824" y="471" fill="#193732" font-size="36" font-weight="650">分開量</text>
<text x="824" y="518" fill="#586b60" font-size="24">兩條線各有指標</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">adoption 看會不會用，effectiveness 看流程與財務績效有沒有變好</text>
</svg>
