<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="claude-usage-five-tricks-title claude-usage-five-tricks-desc"><title id="claude-usage-five-tricks-title">Claude 用量五招</title><desc id="claude-usage-five-tricks-desc">換題開新對話 → 相關問題一次問完 → 選對模型與強度 → 關掉用不到的工具 → 快取與交接摘要；目標是讓 Claude 少重讀。</desc>
