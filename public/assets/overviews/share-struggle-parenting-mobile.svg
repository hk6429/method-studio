<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">大人先說自己的挫折</title><desc id="desc">挑挫折 → 講出口 → 分工 → 安全漸進 → AI 排練；知識交給 AI，陪伴留給人。</desc>
<defs><marker id="share-struggle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">親師關鍵字 EP.113 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先說自己的挫折</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 244V258" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<rect x="28" y="146" width="424" height="98" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="178" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="212" fill="#fffef9" font-size="30" font-weight="650">挑挫折</text>
<text x="48" y="236" fill="#d4e2d4" font-size="19">選一件已走出來的事</text>
<path d="M240 358V372" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<rect x="28" y="260" width="424" height="98" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="292" fill="#586b60" font-size="21">02</text>
<text x="48" y="326" fill="#193732" font-size="30" font-weight="650">講出口</text>
<text x="48" y="350" fill="#586b60" font-size="19">卡住、方法、回頭看</text>
<path d="M240 472V486" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<rect x="28" y="374" width="424" height="98" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="406" fill="#586b60" font-size="21">03</text>
<text x="48" y="440" fill="#193732" font-size="30" font-weight="650">分工</text>
<text x="48" y="464" fill="#586b60" font-size="19">知識給 AI，陪伴留給人</text>
<path d="M240 586V600" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<rect x="28" y="488" width="424" height="98" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="520" fill="#586b60" font-size="21">04</text>
<text x="48" y="554" fill="#193732" font-size="30" font-weight="650">安全漸進</text>
<text x="48" y="578" fill="#586b60" font-size="19">放鬆接觸，獎勵不懲罰</text>
<rect x="28" y="602" width="424" height="98" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="634" fill="#586b60" font-size="21">05</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">AI 排練</text>
<text x="48" y="692" fill="#586b60" font-size="19">失敗清掉重來，大人在場</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">AI 排練為來賓設想，成效未驗證</text>
</svg>
