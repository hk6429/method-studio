<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">孩子問 AI 的五步引導</title><desc id="desc">示範追問 → 一起求證 → 先不禁止 → 先問我加個資線 → 變成自己的。</desc>
<defs><marker id="kids-asking-ai-curiosity-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">親子用 AI · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">先別禁，守住好奇心</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="150" width="232" height="126" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="180.6" fill="#d4e2d4" font-size="21.08">01</text>
<text x="56" y="214.6" fill="#fffef9" font-size="26" font-weight="650">示範追問</text>
<text x="56" y="238.6" fill="#d4e2d4" font-size="16">大人先說「我不懂」</text>
<rect x="286" y="150" width="232" height="126" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="306" y="180.6" fill="#586b60" font-size="21.08">02</text>
<text x="306" y="214.6" fill="#193732" font-size="26" font-weight="650">一起求證</text>
<text x="306" y="238.6" fill="#586b60" font-size="16">AI 的話不一定是真的</text>
<rect x="536" y="150" width="232" height="126" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="556" y="180.6" fill="#586b60" font-size="21.08">03</text>
<text x="556" y="214.6" fill="#193732" font-size="26" font-weight="650">先不禁止</text>
<text x="556" y="238.6" fill="#586b60" font-size="16">肯定觀察，再追問</text>
<path d="M268 208H284" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<path d="M518 208H534" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<rect x="36" y="300" width="232" height="126" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="330.6" fill="#586b60" font-size="21.08">04</text>
<text x="56" y="364.6" fill="#193732" font-size="24" font-weight="650">先問我＋個資線</text>
<text x="56" y="388.6" fill="#586b60" font-size="16">補背景，不輸入個資</text>
<rect x="286" y="300" width="232" height="126" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="306" y="330.6" fill="#586b60" font-size="21.08">05</text>
<text x="306" y="364.6" fill="#193732" font-size="24" font-weight="650">變成自己的</text>
<text x="306" y="388.6" fill="#586b60" font-size="16">來回討論，自己說出來</text>
<path d="M268 358H284" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<text x="536" y="350" fill="#586b60" font-size="19">圖解為編輯整理，</text><text x="536" y="378" fill="#586b60" font-size="19">並非成效證明</text>
<text x="36" y="455" fill="#586b60" font-size="23">先肯定觀察，再追問、求證</text>
</svg>
