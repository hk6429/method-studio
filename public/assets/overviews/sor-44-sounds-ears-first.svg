<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="sor-44-sounds-ears-first-title sor-44-sounds-ears-first-desc"><title id="sor-44-sounds-ears-first-title">44 音盤點法：耳朵先於眼睛</title><desc id="sor-44-sounds-ears-first-desc">第 0 天自測 → 單音盤點 → 合音拆音 → 掀開拼寫與複測；沒進步回到單音盤點。</desc>
<defs><marker id="sor-44-sounds-ears-first-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">SoR 44 音盤點法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先聽見差別，再對嘴，最後綁文字</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sor-44-sounds-ears-first-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sor-44-sounds-ears-first-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sor-44-sounds-ears-first-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01 · 第 0 天</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">自測起跑線</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">十組最小音對，只聽不看，選 A／B</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02 · 第 1–2 天</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">盤點單音</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">錯最多的 8–12 音：多人聽、跟念、錄音比</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03 · 第 3–4 天</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">合音拆音</text>
<text x="56" y="510" fill="#586b60" font-size="27">CVC 當積木，替換首尾音</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04 · 第 5–7 天</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">掀字、複測</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">聽對才看拼寫；同組十對換聲音再測</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">複測沒進步 → 回到單音盤點，檢查是否偷看拼寫、材料太難</text>
</svg>
