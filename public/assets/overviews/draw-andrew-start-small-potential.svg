<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="draw-andrew-start-small-potential-title draw-andrew-start-small-potential-desc"><title id="draw-andrew-start-small-potential-title">把自己拆成幾個角色，一天只做一件事</title><desc id="draw-andrew-start-small-potential-desc">認出擋路句 → 切出新身分 → 拆成角色 → 一天一角色 → 先查再做 → 雜務交出去；遇到第一次就先查，被打斷就把雜務挪到固定時段。</desc>
<defs><marker id="draw-andrew-start-small-potential-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">身分拆解 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">想做的很多，就先決定今天是誰</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M398 240H430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-start-small-potential-arrow)"/>
<path d="M770 240H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-start-small-potential-arrow)"/>
<path d="M983 320V340H217V360" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-start-small-potential-arrow)"/>
<path d="M398 440H430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-start-small-potential-arrow)"/>
<path d="M770 440H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-start-small-potential-arrow)"/>
<rect x="36" y="160" width="362" height="160" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="243" fill="#fffef9" font-size="36" font-weight="650">認出擋路句</text>
<text x="56" y="288" fill="#d4e2d4" font-size="25">寫下讓你關機的那句話</text>
<rect x="438" y="160" width="332" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="195" fill="#586b60" font-size="23">02</text>
<text x="458" y="243" fill="#193732" font-size="36" font-weight="650">切出新身分</text>
<text x="458" y="288" fill="#586b60" font-size="25">白天是誰，晚上是誰</text>
<rect x="810" y="160" width="354" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="830" y="195" fill="#586b60" font-size="23">03</text>
<text x="830" y="243" fill="#193732" font-size="36" font-weight="650">拆成角色</text>
<text x="830" y="288" fill="#586b60" font-size="25">三到四個，各一行職責</text>
<rect x="36" y="360" width="362" height="160" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="56" y="395" fill="#586b60" font-size="23">04</text>
<text x="56" y="443" fill="#193732" font-size="36" font-weight="650">一天一角色</text>
<text x="56" y="488" fill="#586b60" font-size="25">只接一個任務</text>
<rect x="438" y="360" width="332" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="395" fill="#586b60" font-size="23">05</text>
<text x="458" y="443" fill="#193732" font-size="36" font-weight="650">先查再做</text>
<text x="458" y="488" fill="#586b60" font-size="25">三個問題，三份說明</text>
<rect x="810" y="360" width="354" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="830" y="395" fill="#586b60" font-size="23">06</text>
<text x="830" y="443" fill="#193732" font-size="36" font-weight="650">雜務交出去</text>
<text x="830" y="488" fill="#586b60" font-size="25">固定時段或範本</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">影片稱：週一企劃、週二拍攝、週三四剪輯、週五行銷，每天只被交付一個任務</text>
</svg>
