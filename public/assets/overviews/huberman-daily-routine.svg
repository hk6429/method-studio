<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="huberman-daily-routine-title huberman-daily-routine-desc"><title id="huberman-daily-routine-title">把一天排成節律的六個固定動作</title><desc id="huberman-daily-routine-desc">喝水見光 → 早上動身體 → 手機離房專注 → 餐後走路 → 壓力時生理嘆息 → 夜裡調暗燈，再回到隔天醒來。</desc>
<defs><marker id="huberman-daily-routine-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">HUBERMAN · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">從醒來到入睡，排成一條節律</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M388 248H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huberman-daily-routine-arrow)"/>
<path d="M776 248H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huberman-daily-routine-arrow)"/>
<path d="M388 466H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huberman-daily-routine-arrow)"/>
<path d="M776 466H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huberman-daily-routine-arrow)"/>
<path d="M988 336V356H212V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huberman-daily-routine-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">喝水見光</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">醒後一小時內</text>
<rect x="424" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="36" font-weight="650">早上動身體</text>
<text x="444" y="292" fill="#586b60" font-size="25">前三到四小時</text>
<rect x="812" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="36" font-weight="650">手機離房</text>
<text x="832" y="292" fill="#586b60" font-size="25">90–120 分鐘學習</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="36" font-weight="650">餐後走路</text>
<text x="56" y="510" fill="#586b60" font-size="25">5–10 分鐘</text>
<rect x="424" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#586b60" font-size="23">05</text>
<text x="444" y="463" fill="#193732" font-size="36" font-weight="650">生理嘆息</text>
<text x="444" y="510" fill="#586b60" font-size="25">壓力升高時</text>
<rect x="812" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="413" fill="#586b60" font-size="23">06</text>
<text x="832" y="463" fill="#193732" font-size="36" font-weight="650">暗夜睡眠</text>
<text x="832" y="510" fill="#586b60" font-size="25">調暗燈、全暗</text>
<text x="36" y="591" fill="#586b60" font-size="23">最後一步睡好，就是隔天第一步的起點</text>
<text x="36" y="625" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；健康數字皆為影片稱</text>
</svg>
