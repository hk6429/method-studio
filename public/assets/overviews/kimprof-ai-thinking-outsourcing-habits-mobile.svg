<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="kimprof-ai-thinking-outsourcing-habits-m-title kimprof-ai-thinking-outsourcing-habits-m-desc"><title id="kimprof-ai-thinking-outsourcing-habits-m-title">不把思考外包給 AI 的三個習慣</title><desc id="kimprof-ai-thinking-outsourcing-habits-m-desc">聊滿五回合、自己讀完檢驗、丟出怪想法，最後由自己決定。</desc>
<defs><marker id="kimprof-ai-thinking-outsourcing-habits-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">AI 習慣 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">不把思考外包給 AI</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">聊滿五回合</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">追問、拓寬、質疑邏輯</text>
<path d="M240 273V290" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kimprof-ai-thinking-outsourcing-habits-m-arrow)"/>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">自己讀完檢驗</text>
<text x="48" y="402" fill="#586b60" font-size="20">圈出不對勁與跳躍</text>
<path d="M240 419V436" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kimprof-ai-thinking-outsourcing-habits-m-arrow)"/>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">丟出怪想法</text>
<text x="48" y="548" fill="#586b60" font-size="20">沒有根據的直覺也說</text>
<path d="M240 565V582" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kimprof-ai-thinking-outsourcing-habits-m-arrow)"/>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">自己決定</text>
<text x="48" y="694" fill="#586b60" font-size="20">採用、修改或放棄</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">發現疑點時，回到對話再追問</text>
</svg>
