<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="sanshiba-token-picturebook-lesson-title sanshiba-token-picturebook-lesson-desc"><title id="sanshiba-token-picturebook-lesson-title">用專案資料夾做出繪本備課包</title><desc id="sanshiba-token-picturebook-lesson-desc">開專案資料夾 → 先大綱再補檔 → 定繪本風格 → 子代理平行畫 → 寫交接記錄。</desc>
<defs><marker id="sanshiba-token-picturebook-lesson-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">AI 代理人備課 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">一週課，做成全版繪本投影片</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="348" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="193" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="241" fill="#fffef9" font-size="36" font-weight="650">開專案資料夾</text>
<text x="56" y="279" fill="#d4e2d4" font-size="22">自建資料夾、權限代我核准</text>
<rect x="426" y="160" width="348" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="446" y="193" fill="#586b60" font-size="23">02</text>
<text x="446" y="241" fill="#193732" font-size="36" font-weight="650">先大綱再補檔</text>
<text x="446" y="279" fill="#586b60" font-size="22">教案、學習單、情境卡</text>
<rect x="816" y="160" width="348" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="836" y="193" fill="#586b60" font-size="23">03</text>
<text x="836" y="241" fill="#193732" font-size="36" font-weight="650">定繪本風格</text>
<text x="836" y="279" fill="#586b60" font-size="22">全版繪本、點名生圖</text>
<rect x="36" y="378" width="348" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="411" fill="#586b60" font-size="23">04</text>
<text x="56" y="459" fill="#193732" font-size="36" font-weight="650">子代理平行畫</text>
<text x="56" y="497" fill="#586b60" font-size="22">三組各四頁再統整</text>
<rect x="426" y="378" width="348" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="446" y="411" fill="#586b60" font-size="23">05</text>
<text x="446" y="459" fill="#193732" font-size="36" font-weight="650">寫交接記錄</text>
<text x="446" y="497" fill="#586b60" font-size="22">新對話讀它接續</text>
<path d="M384 248H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sanshiba-token-picturebook-lesson-arrow)"/>
<path d="M774 248H812" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sanshiba-token-picturebook-lesson-arrow)"/>
<path d="M990 336V356H210V374" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sanshiba-token-picturebook-lesson-arrow)"/>
<path d="M384 466H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#sanshiba-token-picturebook-lesson-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">風格不一致時，回到「定繪本風格」重畫樣張</text>
</svg>