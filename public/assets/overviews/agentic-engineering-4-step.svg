<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="agentic-engineering-4-step-title agentic-engineering-4-step-desc"><title id="agentic-engineering-4-step-title">四步驟 AI 工程流程</title><desc id="agentic-engineering-4-step-desc">隔離 → 建構 → 證明 → 上線；審查未過關時回到建構，帶著意見再修。</desc>
<defs><marker id="agentic-engineering-4-step-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Behind the Craft · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">讓 AI 寫程式，不再產出爛成品</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentic-engineering-4-step-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentic-engineering-4-step-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentic-engineering-4-step-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">隔離</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">每個任務獨立分支</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">建構</text>
<text x="656" y="292" fill="#586b60" font-size="27">結構清楚、指定技能</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">證明</text>
<text x="56" y="510" fill="#586b60" font-size="27">修改前後都有證據</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">上線</text>
<text x="656" y="510" fill="#586b60" font-size="27">審查迴圈到 5/5</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">審查未過關：帶著意見回到建構，再證明一次</text>
</svg>
