<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="huberman-daily-routine-title huberman-daily-routine-desc"><title id="huberman-daily-routine-title">把一天排成節律</title><desc id="huberman-daily-routine-desc">喝水見光 → 早上動身體 → 手機離房專注 → 餐後走路 → 壓力時生理嘆息 → 夜裡調暗燈，再回到隔天醒來。</desc>
<defs><marker id="huberman-daily-routine-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="32" y="48" fill="#586b60" font-size="20">HUBERMAN · 編輯整理</text>
<text x="32" y="102" fill="#193732" font-size="40" font-weight="650">把一天排成節律</text>
<path d="M32 124H768" stroke="#bdcbbb"/>
<rect x="32" y="148" width="232" height="120" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="178" fill="#d4e2d4" font-size="17">01</text>
<text x="48" y="216" fill="#fffef9" font-size="28" font-weight="650">喝水見光</text>
<text x="48" y="248" fill="#d4e2d4" font-size="19">醒後一小時內</text>
<rect x="280" y="148" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="296" y="178" fill="#586b60" font-size="17">02</text>
<text x="296" y="216" fill="#193732" font-size="28" font-weight="650">早上動身體</text>
<text x="296" y="248" fill="#586b60" font-size="19">前三到四小時</text>
<rect x="528" y="148" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="544" y="178" fill="#586b60" font-size="17">03</text>
<text x="544" y="216" fill="#193732" font-size="28" font-weight="650">手機離房</text>
<text x="544" y="248" fill="#586b60" font-size="19">90–120 分鐘學習</text>
<rect x="32" y="288" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="318" fill="#586b60" font-size="17">04</text>
<text x="48" y="356" fill="#193732" font-size="28" font-weight="650">餐後走路</text>
<text x="48" y="388" fill="#586b60" font-size="19">5–10 分鐘</text>
<rect x="280" y="288" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="296" y="318" fill="#586b60" font-size="17">05</text>
<text x="296" y="356" fill="#193732" font-size="28" font-weight="650">生理嘆息</text>
<text x="296" y="388" fill="#586b60" font-size="19">壓力升高時</text>
<rect x="528" y="288" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="544" y="318" fill="#586b60" font-size="17">06</text>
<text x="544" y="356" fill="#193732" font-size="28" font-weight="650">暗夜睡眠</text>
<text x="544" y="388" fill="#586b60" font-size="19">調暗燈、全暗</text>
<text x="32" y="450" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
