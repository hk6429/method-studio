<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="anti-aging-heavy-training-title anti-aging-heavy-training-desc"><title id="anti-aging-heavy-training-title">抗老化的重量訓練</title><desc id="anti-aging-heavy-training-desc">定目標 → 遊刃有餘 → 頻率與恢復 → 進退階 → 比昨天；圖解為編輯整理。</desc>
<defs><marker id="anti-aging-heavy-training-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">EP.663 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">慢慢練，把力量練成長期存款</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M388 248H442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<path d="M794 248H848" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<path d="M1024 336V357H212V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<path d="M388 466H442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">定目標</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">力量與健康，不追痠痛</text>
<rect x="442" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="462" y="195" fill="#586b60" font-size="23">02</text>
<text x="462" y="245" fill="#193732" font-size="36" font-weight="650">遊刃有餘</text>
<text x="462" y="292" fill="#586b60" font-size="25">三組五下，留餘力</text>
<rect x="848" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="868" y="195" fill="#586b60" font-size="23">03</text>
<text x="868" y="245" fill="#193732" font-size="36" font-weight="650">頻率與恢復</text>
<text x="868" y="292" fill="#586b60" font-size="25">每週 1–3 次、睡飽</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="36" font-weight="650">進退階</text>
<text x="56" y="510" fill="#586b60" font-size="25">好就加一點，差就退</text>
<rect x="442" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="462" y="413" fill="#586b60" font-size="23">05</text>
<text x="462" y="463" fill="#193732" font-size="36" font-weight="650">比昨天</text>
<text x="462" y="510" fill="#586b60" font-size="25">記錄，慢慢累積</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明或醫療建議</text>
<text x="36" y="625" fill="#586b60" font-size="23">有疾病或疼痛，請先問醫師與合格教練</text>
</svg>
