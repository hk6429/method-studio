<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="brain-fourth-pass-rule-m-title brain-fourth-pass-rule-m-desc"><title id="brain-fourth-pass-rule-m-title">從第 4 遍開始的單字方法</title><desc id="brain-fourth-pass-rule-m-desc">十秒認字 → 音節重音 → 高頻回想 → 真實再遇見；前三遍是認得，第四遍才用得出。</desc>
<defs><marker id="brain-fourth-pass-rule-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">四遍學習法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">真正的學習，從第 4 遍開始</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-fourth-pass-rule-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-fourth-pass-rule-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-fourth-pass-rule-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01 · 第 1 遍</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">十秒認字</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">看整體、跟著念、一個意思</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02 · 第 2 遍</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">音節與重音</text>
<text x="48" y="402" fill="#586b60" font-size="20">念對發音、拆音節、標重音</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03 · 第 3 遍</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">高頻回想</text>
<text x="48" y="548" fill="#586b60" font-size="20">遮意思回想、分段、做記號</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04 · 第 4 遍</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">真實再遇見</text>
<text x="48" y="694" fill="#586b60" font-size="20">影片、文章裡認出，抄原句</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">增加遇見次數，而不是延長盯著的時間</text>
</svg>
