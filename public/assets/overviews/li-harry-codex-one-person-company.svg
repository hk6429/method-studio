<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">CODEX 長課 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">重複的事，一步步交給 AI</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="340" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
