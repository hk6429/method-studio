<text x="56" y="257" fill="#193732" font-size="36" font-weight="650">手動做一次</text>
<text x="56" y="301" fill="#586b60" font-size="26">真實材料＋合格成品</text>
<rect x="430" y="160" width="340" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="450" y="194" fill="#586b60" font-size="22">02</text>
<text x="450" y="257" fill="#193732" font-size="36" font-weight="650">挑母模板</text>
<text x="450" y="301" fill="#586b60" font-size="26">多做幾版，寫規則</text>
<rect x="824" y="160" width="340" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="844" y="194" fill="#586b60" font-size="22">03</text>
<text x="844" y="257" fill="#193732" font-size="36" font-weight="650">封裝 Skill</text>
<text x="844" y="301" fill="#586b60" font-size="26">新材料測試</text>
