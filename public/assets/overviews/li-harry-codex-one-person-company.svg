<text x="56" y="412" fill="#586b60" font-size="22">04</text>
<text x="56" y="475" fill="#193732" font-size="36" font-weight="650">排程上雲</text>
<text x="56" y="519" fill="#586b60" font-size="26">金鑰放 .env</text>
<rect x="430" y="378" width="340" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="450" y="412" fill="#d4e2d4" font-size="22">05</text>
<text x="450" y="475" fill="#fffef9" font-size="36" font-weight="650">人工稽核</text>
<text x="450" y="519" fill="#d4e2d4" font-size="26">草稿到此為止</text>
<rect x="824" y="378" width="340" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="844" y="412" fill="#586b60" font-size="22">06</text>
<text x="844" y="475" fill="#193732" font-size="36" font-weight="650">預先維運</text>
<text x="844" y="519" fill="#586b60" font-size="26">回滾、通知、修錯</text>
