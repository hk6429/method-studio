<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">先想、再互動的課堂方法</title><desc id="desc">定目標 → 先想再說 → 看證據 → 換境再驗；回應不足時調整支持，再給獨立作答機會。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">INTERACT · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先想，再互動</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">定目標</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">能力、問題與判準</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">先想再說</text>
<text x="48" y="402" fill="#586b60" font-size="20">先自答，再交換理由</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">看證據</text>
<text x="48" y="548" fill="#586b60" font-size="20">回應不足，調整支持</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">換境再驗</text>
<text x="48" y="694" fill="#586b60" font-size="20">新情境與次課調整</text>
<text x="28" y="775" fill="#586b60" font-size="19">回應不足時給支持，再給獨立作答機會</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
