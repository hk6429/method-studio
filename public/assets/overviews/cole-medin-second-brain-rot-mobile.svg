<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">第二大腦防腐爛 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">狀態就覆寫，事件才追加</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
