<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="claude-code-18-tips-ep431-t claude-code-18-tips-ep431-d"><title id="claude-code-18-tips-ep431-t">Claude Code 上手路線</title><desc id="claude-code-18-tips-ep431-d">懂專案 → 給它看 → 自我驗收 → 交出去；先讓它能自己檢查，再把重複的事交出去。</desc>
<defs><marker id="claude-code-18-tips-ep431-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">AI 懶人報 EP431 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">讓它自己驗收</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-code-18-tips-ep431-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-code-18-tips-ep431-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-code-18-tips-ep431-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">懂專案</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">瘦身 CLAUDE.md、plan mode</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">給它看</text>
<text x="48" y="402" fill="#586b60" font-size="20">檔案、截圖、先訪談寫規格</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">自我驗收</text>
<text x="48" y="548" fill="#586b60" font-size="20">條件加證據，做完就 /clear</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">交出去</text>
<text x="48" y="694" fill="#586b60" font-size="20">skill、hook、subagent</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">糾正兩次還錯就 /clear 重開</text>
</svg>
