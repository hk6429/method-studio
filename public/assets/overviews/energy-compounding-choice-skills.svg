<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="energy-compounding-choice-skills-title energy-compounding-choice-skills-desc"><title id="energy-compounding-choice-skills-title">高壓下不硬撐的能量盤點</title><desc id="energy-compounding-choice-skills-desc">認出內耗 → 分影響圈 → 白紙寫需求 → 應該換我可以 → 排進行事曆；情緒卡住時先聽懂再轉念。</desc>
<defs><marker id="energy-compounding-choice-skills-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="48" y="64" fill="#586b60" font-size="28">能量複利 · 編輯整理</text>
<text x="48" y="120" fill="#193732" font-size="44" font-weight="650">把「應該」換成「我可以」</text>
<path d="M48 148H1152" stroke="#bdcbbb"/>
<rect x="48" y="180" width="340" height="150" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="72" y="220" fill="#586b60" font-size="24">01</text>
<text x="72" y="268" fill="#193732" font-size="36" font-weight="650">認出內耗</text>
<text x="72" y="304" fill="#586b60" font-size="22">哪一刻覺得跑不夠快</text>
<path d="M392 255H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="428" y="180" width="340" height="150" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="452" y="220" fill="#586b60" font-size="24">02</text>
<text x="452" y="268" fill="#193732" font-size="36" font-weight="650">分影響圈</text>
<text x="452" y="304" fill="#586b60" font-size="22">管得到與管不到</text>
<path d="M772 255H804" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="808" y="180" width="340" height="150" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="220" fill="#586b60" font-size="24">03</text>
<text x="832" y="268" fill="#193732" font-size="36" font-weight="650">白紙寫需求</text>
<text x="832" y="304" fill="#586b60" font-size="22">不舒服背後缺什麼</text>
<path d="M978 334V360H218V386" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="48" y="390" width="340" height="150" rx="8" fill="#193732" stroke="#bdcbbb"/>
<text x="72" y="430" fill="#d4e2d4" font-size="24">04</text>
<text x="72" y="478" fill="#fffef9" font-size="36" font-weight="650">應該換我可以</text>
<text x="72" y="514" fill="#d4e2d4" font-size="22">找到自己能做的事</text>
<path d="M392 465H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="428" y="390" width="340" height="150" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="452" y="430" fill="#586b60" font-size="24">05</text>
<text x="452" y="478" fill="#193732" font-size="36" font-weight="650">排進行事曆</text>
<text x="452" y="514" fill="#586b60" font-size="22">重要不緊急先留位</text>
<path d="M772 465H804" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="808" y="390" width="340" height="150" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="430" fill="#586b60" font-size="24">06</text>
<text x="832" y="478" fill="#193732" font-size="36" font-weight="650">先聽懂情緒</text>
<text x="832" y="514" fill="#586b60" font-size="22">再決定要不要轉念</text>
<text x="48" y="600" fill="#586b60" font-size="24">情緒卡住時，先承認與命名，再談轉念</text>
<text x="48" y="632" fill="#586b60" font-size="20">圖解為編輯整理，並非成效證明</text>
</svg>
