<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">AI 博主起步 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">六步做出第一支影片</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 234V251" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xinyuan-ai-blogger-starting-method-arrow)"/>
