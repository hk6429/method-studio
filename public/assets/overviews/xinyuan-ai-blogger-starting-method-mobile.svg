<path d="M240 549V566" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xinyuan-ai-blogger-starting-method-arrow)"/>
<path d="M240 654V671" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xinyuan-ai-blogger-starting-method-arrow)"/>
<rect x="28" y="150" width="424" height="84" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="184" fill="#d4e2d4" font-size="21">01</text>
<text x="100" y="186" fill="#fffef9" font-size="28" font-weight="650">定位</text>
<text x="48" y="216" fill="#d4e2d4" font-size="20">淺顯易懂的工具分享</text>
<rect x="28" y="255" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="289" fill="#586b60" font-size="21">02</text>
<text x="100" y="291" fill="#193732" font-size="28" font-weight="650">找工具</text>
<text x="48" y="321" fill="#586b60" font-size="20">每日更新、挑免費</text>
<rect x="28" y="360" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="394" fill="#586b60" font-size="21">03</text>
<text x="100" y="396" fill="#193732" font-size="28" font-weight="650">錄螢幕</text>
<text x="48" y="426" fill="#586b60" font-size="20">普通筆電就夠</text>
<rect x="28" y="465" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="499" fill="#586b60" font-size="21">04</text>
<text x="100" y="501" fill="#193732" font-size="28" font-weight="650">剪輯</text>
<text x="48" y="531" fill="#586b60" font-size="20">一個穩定的工具</text>
<rect x="28" y="570" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="604" fill="#586b60" font-size="21">05</text>
<text x="100" y="606" fill="#193732" font-size="28" font-weight="650">AI 包裝</text>
<text x="48" y="636" fill="#586b60" font-size="20">標題、說明、封面</text>
<rect x="28" y="675" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="709" fill="#586b60" font-size="21">06</text>
<text x="100" y="711" fill="#193732" font-size="28" font-weight="650">回頭看</text>
<text x="48" y="741" fill="#586b60" font-size="20">依播放量找方向</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
