<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="tiago-forte-beat-ai-slop-m-title tiago-forte-beat-ai-slop-m-desc"><title id="tiago-forte-beat-ai-slop-m-title">在 AI 時代保持原創的六步</title><desc id="tiago-forte-beat-ai-slop-m-desc">往上游站 → 追細節 → 有料的亂 → 先問結果 → 三種智慧 → 換清單；新清單再往源頭走。</desc>
<defs><marker id="tiago-forte-beat-ai-slop-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">TIAGO FORTE · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">別被 AI 平均掉</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 234V246" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-m-arrow)"/>
<path d="M240 332V344" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-m-arrow)"/>
<path d="M240 430V442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-m-arrow)"/>
<path d="M240 528V540" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-m-arrow)"/>
<path d="M240 626V638" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-m-arrow)"/>
<rect x="28" y="148" width="424" height="86" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="176" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="204" fill="#fffef9" font-size="26" font-weight="650">往上游站</text>
<text x="200" y="204" fill="#d4e2d4" font-size="18">下游交給 AI，人去源頭</text>
<rect x="28" y="246" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="274" fill="#586b60" font-size="18">02</text>
<text x="48" y="302" fill="#193732" font-size="26" font-weight="650">追細節</text>
<text x="200" y="302" fill="#586b60" font-size="18">現場捕捉，保留原文</text>
<rect x="28" y="344" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="372" fill="#586b60" font-size="18">03</text>
<text x="48" y="400" fill="#193732" font-size="26" font-weight="650">有料的亂</text>
<text x="200" y="400" fill="#586b60" font-size="18">少整理，需要時交 AI</text>
<rect x="28" y="442" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="470" fill="#586b60" font-size="18">04</text>
<text x="48" y="498" fill="#193732" font-size="26" font-weight="650">先問結果</text>
<text x="200" y="498" fill="#586b60" font-size="18">誠實回答，目標縮小</text>
<rect x="28" y="540" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="568" fill="#586b60" font-size="18">05</text>
<text x="48" y="596" fill="#193732" font-size="26" font-weight="650">三種智慧</text>
<text x="200" y="596" fill="#586b60" font-size="18">人生、缺漏、慢火</text>
<rect x="28" y="638" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="666" fill="#586b60" font-size="18">06</text>
<text x="48" y="694" fill="#193732" font-size="26" font-weight="650">換清單</text>
<text x="200" y="694" fill="#586b60" font-size="18">停止欄＋改成欄</text>
<text x="28" y="752" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="780" fill="#586b60" font-size="18">換完清單，再回到上游找素材</text>
</svg>
