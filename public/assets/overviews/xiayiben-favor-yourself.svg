<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">偏心自己</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">不傷人的前提下，我需要什麼</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">情緒日記</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">事件＋感覺，自由書寫五分鐘</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">一週統計</text>
<text x="56" y="510" fill="#586b60" font-size="27">畫正字，找出觸發事件</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">隔天說明</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">不是因為你，是我遇到別的事</text>
<text x="36" y="625" fill="#586b60" font-size="23">低潮時翻「一萬次相簿」，用小小的試試看累積成功畫面</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
