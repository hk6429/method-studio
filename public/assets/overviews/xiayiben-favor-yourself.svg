<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="xiayiben-favor-yourself-title xiayiben-favor-yourself-desc"><title id="xiayiben-favor-yourself-title">偏心自己的情緒資料庫</title><desc id="xiayiben-favor-yourself-desc">偏心自己 → 情緒日記 → 一週統計 → 隔天說明；低潮時翻一萬次相簿，用小嘗試累積成功畫面。</desc>
