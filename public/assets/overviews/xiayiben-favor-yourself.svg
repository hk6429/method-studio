<text x="36" y="48" fill="#586b60" font-size="26">下一本讀什麼 EP.632 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先照顧好自己，再好好跟家人說話</text>
