<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="aging-parents-post-adolescent-title aging-parents-post-adolescent-desc"><title id="aging-parents-post-adolescent-title">「老少女」攻略：把長輩當後青春期</title><desc id="aging-parents-post-adolescent-desc">換框架 → 預告陪跑 → 說出擔心 → 看見努力 → 課題分離 → 給小工具；對方又防衛時，回到說出擔心。</desc>
<defs><marker id="aging-parents-post-adolescent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">後青春期溝通 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先降低防衛，再看見卡點</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="78" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="170" fill="#d4e2d4" font-size="19">01</text>
<text x="48" y="196" fill="#fffef9" font-size="27" font-weight="650">換框架</text>
<text x="48" y="216" fill="#d4e2d4" font-size="19">長輩像後青春期</text>
<path d="M240 224V236" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<rect x="28" y="238" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="262" fill="#586b60" font-size="19">02</text>
<text x="48" y="288" fill="#193732" font-size="27" font-weight="650">預告陪跑</text>
<text x="48" y="308" fill="#586b60" font-size="19">先踩點、先預告</text>
<path d="M240 316V328" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<rect x="28" y="330" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="354" fill="#586b60" font-size="19">03</text>
<text x="48" y="380" fill="#193732" font-size="27" font-weight="650">說出擔心</text>
<text x="48" y="400" fill="#586b60" font-size="19">不求回應不講理</text>
<path d="M240 408V420" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<rect x="28" y="422" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="446" fill="#586b60" font-size="19">04</text>
<text x="48" y="472" fill="#193732" font-size="27" font-weight="650">看見努力</text>
<text x="48" y="492" fill="#586b60" font-size="19">再問卡在哪裡</text>
<path d="M240 500V512" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<rect x="28" y="514" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="538" fill="#586b60" font-size="19">05</text>
<text x="48" y="564" fill="#193732" font-size="27" font-weight="650">課題分離</text>
<text x="48" y="584" fill="#586b60" font-size="19">放下「應該」</text>
<path d="M240 592V604" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<rect x="28" y="606" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="630" fill="#586b60" font-size="19">06</text>
<text x="48" y="656" fill="#193732" font-size="27" font-weight="650">給小工具</text>
<text x="48" y="676" fill="#586b60" font-size="19">進度表、架構圖</text>
<text x="28" y="745" fill="#586b60" font-size="18">對方又防衛 → 回到「說出擔心」</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
