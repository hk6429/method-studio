<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="kim-professor-bad-habits-title kim-professor-bad-habits-desc"><title id="kim-professor-bad-habits-title">從記錄到產出的方法</title><desc id="kim-professor-bad-habits-desc">翻舊記錄 → 畫設計圖 → 多種出口 → 每週回看；平常只記不分類，精華再記回去。</desc>
<defs><marker id="kim-professor-bad-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">記錄學者訪談 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">記錄是等著被編輯的材料</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">翻舊記錄</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">寫之前先抽條目，不只抄範本</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">畫設計圖</text>
<text x="48" y="402" fill="#586b60" font-size="20">3×3×3，用筆記填滿再寫</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">多種出口</text>
<text x="48" y="548" fill="#586b60" font-size="20">同一內容變腳本、短文、章節</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">每週回看</text>
<text x="48" y="694" fill="#586b60" font-size="20">一小時讀完，精華再記一次</text>
<text x="28" y="775" fill="#586b60" font-size="19">平常只記不分類；字句自己改，內容請 AI 評分</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
