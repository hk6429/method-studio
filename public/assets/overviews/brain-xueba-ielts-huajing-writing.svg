<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="brain-xueba-ielts-huajing-writing-title brain-xueba-ielts-huajing-writing-desc"><title id="brain-xueba-ielts-huajing-writing-title">別翻字，翻畫面的英文寫作方法</title><desc id="brain-xueba-ielts-huajing-writing-desc">概念骨架 → 英文編碼（高階語塊或簡單句型）→ 英文段落 → 對照自評；還像翻譯就回到骨架重拆。</desc>
<defs><marker id="brain-xueba-ielts-huajing-writing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">化境寫作法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">別翻字，翻畫面：英文作文去塑膠味</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01 當口述者</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">概念骨架</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">只寫短詞與立場，不寫句子</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02 當林紓</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">英文重新編碼</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">高階語塊，或簡單句型</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03 求化境</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">英文段落邏輯</text>
<text x="56" y="510" fill="#586b60" font-size="27">首句亮結論，連接詞推進</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04 編輯延伸</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">對照自評</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">新舊並排，存進語塊卡</text>
<text x="36" y="625" fill="#586b60" font-size="23">還看得出中文順序，就回到骨架重拆</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
