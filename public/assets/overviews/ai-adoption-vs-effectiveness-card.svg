<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="ai-adoption-vs-effectiveness-c-title ai-adoption-vs-effectiveness-c-desc"><title id="ai-adoption-vs-effectiveness-c-title">分清 adoption 與 effectiveness</title><desc id="ai-adoption-vs-effectiveness-c-desc">定目標 → 三群清單 → 盤三職能 → 拆驗收 → 排產能 → 分開量；全員會用不等於績效有感。</desc>
<defs><marker id="ai-adoption-vs-effectiveness-c-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="28" y="40" fill="#586b60" font-size="18">AI 導入 · 編輯整理</text>
<text x="28" y="84" fill="#193732" font-size="32" font-weight="650">全員會用，不等於績效有感</text>
<path d="M28 102H772" stroke="#bdcbbb"/>
<rect x="28" y="124" width="234" height="132" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="44" y="154" fill="#d4e2d4" font-size="16">01</text>
<text x="44" y="200" fill="#fffef9" font-size="30" font-weight="650">定目標</text>
<text x="44" y="232" fill="#d4e2d4" font-size="17">adoption 或 effectiveness</text>
<rect x="278" y="124" width="234" height="132" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="294" y="154" fill="#586b60" font-size="16">02</text>
<text x="294" y="200" fill="#193732" font-size="30" font-weight="650">三群清單</text>
<text x="294" y="232" fill="#586b60" font-size="17">學會用、驗、選</text>
<rect x="528" y="124" width="234" height="132" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="544" y="154" fill="#586b60" font-size="16">03</text>
<text x="544" y="200" fill="#193732" font-size="30" font-weight="650">盤三職能</text>
<text x="544" y="232" fill="#586b60" font-size="17">場景、開發、AI PM</text>
<rect x="28" y="274" width="234" height="132" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="304" fill="#586b60" font-size="16">04</text>
<text x="44" y="350" fill="#193732" font-size="30" font-weight="650">拆驗收</text>
<text x="44" y="382" fill="#586b60" font-size="17">門檻與人工檢查</text>
<rect x="278" y="274" width="234" height="132" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="294" y="304" fill="#586b60" font-size="16">05</text>
<text x="294" y="350" fill="#193732" font-size="30" font-weight="650">排產能</text>
<text x="294" y="382" fill="#586b60" font-size="17">省下的時間去哪</text>
<rect x="528" y="274" width="234" height="132" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="544" y="304" fill="#586b60" font-size="16">06</text>
<text x="544" y="350" fill="#193732" font-size="30" font-weight="650">分開量</text>
<text x="544" y="382" fill="#586b60" font-size="17">兩條線各有指標</text>
<text x="28" y="440" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
