<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="kim-professor-bad-habits-title kim-professor-bad-habits-desc"><title id="kim-professor-bad-habits-title">從記錄到產出的方法</title><desc id="kim-professor-bad-habits-desc">翻舊記錄 → 畫設計圖 → 多種出口 → 每週回看；平常只記不分類，精華再記回去。</desc>
<defs><marker id="kim-professor-bad-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">記錄學者訪談 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">記錄不是收藏，是等著被編輯成產出</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-bad-habits-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">翻舊記錄</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">寫之前先抽條目，不只抄範本</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">畫設計圖</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">3×3×3，用筆記填滿再寫</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">多種出口</text>
<text x="56" y="510" fill="#586b60" font-size="27">同一內容變腳本、短文、章節</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">每週回看</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">一小時讀完，精華再記一次</text>
<text x="36" y="625" fill="#586b60" font-size="23">平常只記不分類；字句自己改，易懂與有用請 AI 評分</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
