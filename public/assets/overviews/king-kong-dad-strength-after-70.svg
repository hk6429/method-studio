<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="king-kong-dad-strength-after-70-title king-kong-dad-strength-after-70-desc"><title id="king-kong-dad-strength-after-70-title">70 歲後也能練的肌力方法</title><desc id="king-kong-dad-strength-after-70-desc">拆迷思 → 自我檢查 → 下肢 → 核心 → 握力 → 每週三次。</desc>
<defs><marker id="king-kong-dad-strength-after-70-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">金剛老爹專訪 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">從客廳開始，補回肌力</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="360" height="190" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="196" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="258" fill="#fffef9" font-size="38" font-weight="650">拆迷思</text>
<text x="56" y="308" fill="#d4e2d4" font-size="25">走路不等於肌力</text>
<path d="M398 255H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="420" y="160" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="196" fill="#586b60" font-size="23">02</text>
<text x="440" y="258" fill="#193732" font-size="38" font-weight="650">自我檢查</text>
<text x="440" y="308" fill="#586b60" font-size="25">找出最弱一區</text>
<path d="M782 255H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="804" y="160" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="196" fill="#586b60" font-size="23">03</text>
<text x="824" y="258" fill="#193732" font-size="38" font-weight="650">下肢</text>
<text x="824" y="308" fill="#586b60" font-size="25">抬腿・坐站・靜蹲</text>
<rect x="36" y="374" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="410" fill="#586b60" font-size="23">04</text>
<text x="56" y="472" fill="#193732" font-size="38" font-weight="650">核心</text>
<text x="56" y="522" fill="#586b60" font-size="25">棒式計時</text>
<path d="M398 469H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="420" y="374" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="410" fill="#586b60" font-size="23">05</text>
<text x="440" y="472" fill="#193732" font-size="38" font-weight="650">握力</text>
<text x="440" y="522" fill="#586b60" font-size="25">吊・提・擰・橡皮筋</text>
<path d="M782 469H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="804" y="374" width="360" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="410" fill="#586b60" font-size="23">06</text>
<text x="824" y="472" fill="#193732" font-size="38" font-weight="650">一週三次</text>
<text x="824" y="522" fill="#586b60" font-size="25">10–12 次 × 3 組</text>
<path d="M1164 255" stroke="none"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；有疼痛請先問醫師</text>
<text x="36" y="625" fill="#586b60" font-size="23">每週回頭重測，再調整下一週的重點</text>
</svg>
