<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">孩子問 AI 的五步引導</title><desc id="desc">示範追問 → 一起求證 → 先不禁止 → 先問我加個資線 → 變成自己的。</desc>
<defs><marker id="kids-asking-ai-curiosity-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">親子用 AI · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先別禁，守住孩子的好奇心</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M392 255H414" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<path d="M766 255H788" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<rect x="36" y="160" width="352" height="190" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="194.2" fill="#d4e2d4" font-size="23.56">01</text>
<text x="56" y="232.2" fill="#fffef9" font-size="34" font-weight="650">示範追問</text>
<text x="56" y="265.2" fill="#d4e2d4" font-size="22">大人先說「我不懂」</text>
<rect x="412" y="160" width="352" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="432" y="194.2" fill="#586b60" font-size="23.56">02</text>
<text x="432" y="232.2" fill="#193732" font-size="34" font-weight="650">一起求證</text>
<text x="432" y="265.2" fill="#586b60" font-size="22">AI 的話不一定是真的</text>
<rect x="788" y="160" width="352" height="190" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="808" y="194.2" fill="#586b60" font-size="23.56">03</text>
<text x="808" y="232.2" fill="#193732" font-size="34" font-weight="650">先不禁止</text>
<text x="808" y="265.2" fill="#586b60" font-size="22">肯定觀察，再追問</text>
<path d="M964 350V372H212V392" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<rect x="36" y="400" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="434.2" fill="#586b60" font-size="23.56">04</text>
<text x="56" y="472.2" fill="#193732" font-size="32" font-weight="650">先問我＋個資線</text>
<text x="56" y="505.2" fill="#586b60" font-size="22">補背景，不輸入個資</text>
<rect x="412" y="400" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="432" y="434.2" fill="#586b60" font-size="23.56">05</text>
<text x="432" y="472.2" fill="#193732" font-size="32" font-weight="650">變成自己的</text>
<text x="432" y="505.2" fill="#586b60" font-size="22">來回討論，自己說出來</text>
<path d="M388 480H410" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kids-asking-ai-curiosity-arrow)"/>
<text x="800" y="450" fill="#586b60" font-size="23">圖解為編輯整理，</text><text x="800" y="484" fill="#586b60" font-size="23">並非成效證明</text>
</svg>
