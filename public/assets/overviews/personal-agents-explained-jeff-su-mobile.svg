<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="personal-agents-explained-jeff-su-title personal-agents-explained-jeff-su-desc"><title id="personal-agents-explained-jeff-su-title">讓 AI 記得你的 DIY 代理</title><desc id="personal-agents-explained-jeff-su-desc">判斷層級 → 建資料夾 → 寫規則與記憶兩個檔 → 一句話交辦並更新記憶 → 串接外部服務與選路線。</desc>
