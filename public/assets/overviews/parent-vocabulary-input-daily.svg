<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="parent-vocabulary-input-daily-title parent-vocabulary-input-daily-desc"><title id="parent-vocabulary-input-daily-title">每天用對話餵詞彙量的做法</title><desc id="parent-vocabulary-input-daily-desc">選一個活動 → 一加一 → 換精確詞 → 一來一往 → 當評論者 → 難詞配畫面；孩子沒回應就繼續評論，不追問。</desc>
<defs><marker id="parent-vocabulary-input-daily-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">親子對話 · Podcast 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">不花錢的詞彙課：一個名詞多加一個詞</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M371 248H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-vocabulary-input-daily-arrow)"/>
<path d="M771 248H824" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-vocabulary-input-daily-arrow)"/>
<path d="M1000 341V354H200V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-vocabulary-input-daily-arrow)"/>
<path d="M371 466H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-vocabulary-input-daily-arrow)"/>
<path d="M771 466H824" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-vocabulary-input-daily-arrow)"/>
<rect x="36" y="160" width="328" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">選一個活動</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">吃飯、洗澡或睡前擇一</text>
<rect x="436" y="160" width="328" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="195" fill="#586b60" font-size="23">02</text>
<text x="456" y="245" fill="#193732" font-size="38" font-weight="650">一加一</text>
<text x="456" y="292" fill="#586b60" font-size="25">水壺 → 灰色的水壺</text>
<rect x="836" y="160" width="328" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="856" y="195" fill="#586b60" font-size="23">03</text>
<text x="856" y="245" fill="#193732" font-size="38" font-weight="650">換精確詞</text>
<text x="856" y="292" fill="#586b60" font-size="25">放那裡 → 放到桌子上面</text>
<rect x="36" y="378" width="328" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">一來一往</text>
<text x="56" y="510" fill="#586b60" font-size="25">選擇題、照樣造句</text>
<rect x="436" y="378" width="328" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="413" fill="#586b60" font-size="23">05</text>
<text x="456" y="463" fill="#193732" font-size="38" font-weight="650">當評論者</text>
<text x="456" y="510" fill="#586b60" font-size="25">看圖就說，不求回報</text>
<rect x="836" y="378" width="328" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="856" y="413" fill="#586b60" font-size="23">06</text>
<text x="856" y="463" fill="#193732" font-size="38" font-weight="650">難詞配畫面</text>
<text x="856" y="510" fill="#586b60" font-size="25">照片、實景或 AI 圖</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，數字與研究為節目口述，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">孩子沒回應 → 繼續評論不追問；60 分變 65 分就好</text>
</svg>
