<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="async-collaboration-meetings-title async-collaboration-meetings-desc"><title id="async-collaboration-meetings-title">會前立好問題與答案，會議才短</title><desc id="async-collaboration-meetings-desc">立關鍵問題 → 備答案 → 定一小時 → 換位推演 → 簡報預問 → 以終為始。</desc>
<defs><marker id="async-collaboration-meetings-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">異步協作 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">把會議的功夫，搬到會議之前</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">立關鍵問題</text>
<text x="56" y="292" fill="#d4e2d4" font-size="26">2～3 個問句</text>
<rect x="424" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="38" font-weight="650">備答案</text>
<text x="444" y="292" fill="#586b60" font-size="26">每題 1～2 個</text>
<rect x="812" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="38" font-weight="650">定一小時</text>
<text x="832" y="292" fill="#586b60" font-size="26">帶答案來交換</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">換位推演</text>
<text x="56" y="510" fill="#586b60" font-size="26">預想對方反應</text>
<rect x="424" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#586b60" font-size="23">05</text>
<text x="444" y="463" fill="#193732" font-size="38" font-weight="650">簡報預問</text>
<text x="444" y="510" fill="#586b60" font-size="26">逐頁問會被問什麼</text>
<rect x="812" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="413" fill="#586b60" font-size="23">06</text>
<text x="832" y="463" fill="#193732" font-size="38" font-weight="650">以終為始</text>
<text x="832" y="510" fill="#586b60" font-size="26">先想通過後影響</text>
<path d="M388 248H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<path d="M776 248H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<path d="M988 336V357H224V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<path d="M388 466H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<path d="M776 466H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">有答案，就和多數沒準備的人不一樣</text>
</svg>
