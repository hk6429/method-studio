<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="catch-yourself-before-burnout-title catch-yourself-before-burnout-desc"><title id="catch-yourself-before-burnout-title">三層心理防火牆</title><desc id="catch-yourself-before-burnout-desc">外層停幾秒做心理交換；中層別人的情緒退回、自己的情緒先容納；內層價值澄清；睡前三題檢查。</desc>
<defs><marker id="catch-yourself-before-burnout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">心理防火牆 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先接住自己</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="185" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="227" fill="#fffef9" font-size="30" font-weight="650">外層</text>
<text x="48" y="265" fill="#d4e2d4" font-size="20">停幾秒、心理交換、婉拒</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="331" fill="#586b60" font-size="21">02</text>
<text x="48" y="373" fill="#193732" font-size="30" font-weight="650">中層</text>
<text x="48" y="411" fill="#586b60" font-size="20">別人情緒退回，自己先容納</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="477" fill="#586b60" font-size="21">03</text>
<text x="48" y="519" fill="#193732" font-size="30" font-weight="650">內層</text>
<text x="48" y="557" fill="#586b60" font-size="20">價值澄清，不靠掌聲</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="623" fill="#586b60" font-size="21">04</text>
<text x="48" y="665" fill="#193732" font-size="30" font-weight="650">睡前三愛</text>
<text x="48" y="703" fill="#586b60" font-size="20">三題檢查，只觀察</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">每週回頭看哪一層最常失守</text>
</svg>
