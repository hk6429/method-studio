<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" role="img" aria-labelledby="vocab-duel-recall-repair-title vocab-duel-recall-repair-desc"><title id="vocab-duel-recall-repair-title">從每日十題，走到再次想起</title><desc id="vocab-duel-recall-repair-desc">定量起步 → 主動作答 → 錯字攻克 → 到期再練；答錯回查，答對也保留後續複習。</desc>
<defs><marker id="vocab-duel-recall-repair-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="568" fill="#f0f2e9"/>
<text x="36" y="64" fill="#586b60" font-size="22" font-weight="500">字鬥英雄 · 單字練習路線</text>
<text x="36" y="133" fill="#193732" font-size="43" font-weight="650">從每日十題，走到再次想起</text>
<text x="36" y="181" fill="#586b60" font-size="25" font-weight="500">先答再核對，錯字親手拼；答對之後，仍要回訪。</text>
<path d="M295 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-arrow)"/>
<path d="M587 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-arrow)"/>
<path d="M879 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-arrow)"/>
<path d="M1038 400V438Q1038 454 1022 454H762Q746 454 746 438V406" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-arrow)"/>
<rect x="36" y="230" width="252" height="170" rx="5" fill="#193732" stroke="#bdcbbb"/><text x="58" y="264" fill="#d4e2d4" font-size="20" font-weight="500">01</text><text x="58" y="315" fill="#fffef9" font-size="32" font-weight="650">定量起步</text><text x="58" y="355" fill="#d4e2d4" font-size="23" font-weight="500">舊字弱字新字</text>
<rect x="328" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="350" y="264" fill="#586b60" font-size="20" font-weight="500">02</text><text x="350" y="315" fill="#193732" font-size="32" font-weight="650">主動作答</text><text x="350" y="355" fill="#586b60" font-size="23" font-weight="500">先想再看回饋</text>
<rect x="620" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="642" y="264" fill="#586b60" font-size="20" font-weight="500">03</text><text x="642" y="315" fill="#193732" font-size="32" font-weight="650">錯字攻克</text><text x="642" y="355" fill="#586b60" font-size="23" font-weight="500">找錯因再拼字</text>
<rect x="912" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="934" y="264" fill="#586b60" font-size="20" font-weight="500">04</text><text x="934" y="315" fill="#193732" font-size="32" font-weight="650">到期再練</text><text x="934" y="355" fill="#586b60" font-size="23" font-weight="500">隔一段再作答</text>
<text x="785" y="443" fill="#586b60" font-size="23" font-weight="500">忘記再回攻克</text>
<path d="M36 489H1164" stroke="#bdcbbb"/>
<text x="36" y="533" fill="#193732" font-size="25" font-weight="500">完成任務、當日攻克與長期記住，是三件不同的事。</text>
</svg>