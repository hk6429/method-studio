<text x="36" y="64" fill="#586b60" font-size="22" font-weight="500">高雄研習 · 教學工作流程</text>
<text x="36" y="133" fill="#193732" font-size="43" font-weight="650">從一份素材，走到差異化教學</text>
<text x="36" y="181" fill="#586b60" font-size="25" font-weight="500">同一個學習目標，提供不同支持；先試做，再依證據調整。</text>
