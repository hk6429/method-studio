<rect x="36" y="230" width="252" height="170" rx="5" fill="#193732" stroke="#bdcbbb"/><text x="58" y="264" fill="#d4e2d4" font-size="20" font-weight="500">01</text><text x="58" y="315" fill="#fffef9" font-size="32" font-weight="650">共同目標</text><text x="58" y="355" fill="#d4e2d4" font-size="23" font-weight="500">先看學習困難</text>
<rect x="328" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="350" y="264" fill="#586b60" font-size="20" font-weight="500">02</text><text x="350" y="315" fill="#193732" font-size="32" font-weight="650">素材聚焦</text><text x="350" y="355" fill="#586b60" font-size="23" font-weight="500">審大綱與風格</text>
<rect x="620" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="642" y="264" fill="#586b60" font-size="20" font-weight="500">03</text><text x="642" y="315" fill="#193732" font-size="32" font-weight="650">分層支持</text><text x="642" y="355" fill="#586b60" font-size="23" font-weight="500">提示逐步提供</text>
<rect x="912" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="934" y="264" fill="#586b60" font-size="20" font-weight="500">04</text><text x="934" y="315" fill="#193732" font-size="32" font-weight="650">試教回饋</text><text x="934" y="355" fill="#586b60" font-size="23" font-weight="500">留下作答證據</text>
