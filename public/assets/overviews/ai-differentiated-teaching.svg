<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" role="img" aria-labelledby="ai-differentiated-teaching-title ai-differentiated-teaching-desc"><title id="ai-differentiated-teaching-title">從一份素材，走到差異化教學</title><desc id="ai-differentiated-teaching-desc">共同目標 → 素材聚焦 → 分層支持 → 試教回饋；依作答觀察回到任務調整。</desc>
