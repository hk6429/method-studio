<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="energy-compounding-choice-skills-title energy-compounding-choice-skills-desc"><title id="energy-compounding-choice-skills-title">高壓下不硬撐的能量盤點</title><desc id="energy-compounding-choice-skills-desc">認出內耗 → 分影響圈 → 白紙寫需求 → 應該換我可以 → 排進行事曆；情緒卡住時先聽懂再轉念。</desc>
<defs><marker id="energy-compounding-choice-skills-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">能量複利 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">不硬撐，改成「我可以」</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="160" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#586b60" font-size="23">01 · 覺察</text>
<text x="56" y="245" fill="#193732" font-size="36" font-weight="650">認出內耗</text>
<path d="M368 216H432" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="436" y="160" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="195" fill="#586b60" font-size="23">02 · 盤點</text>
<text x="456" y="245" fill="#193732" font-size="36" font-weight="650">白紙寫需求</text>
<rect x="36" y="310" width="328" height="112" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="345" fill="#d4e2d4" font-size="23">03 · 選擇</text>
<text x="56" y="395" fill="#fffef9" font-size="36" font-weight="650">應該換我可以</text>
<path d="M368 366H432" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<rect x="436" y="310" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="345" fill="#586b60" font-size="23">04 · 固定</text>
<text x="456" y="395" fill="#193732" font-size="36" font-weight="650">排進行事曆</text>
<path d="M600 277V290H200V300" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#energy-compounding-choice-skills-arrow)"/>
<text x="36" y="455" fill="#586b60" font-size="23">情緒卡住 → 先聽懂 → 再轉念</text>
</svg>
