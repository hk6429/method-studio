<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="brain-xueba-ielts-huajing-writing-title brain-xueba-ielts-huajing-writing-desc"><title id="brain-xueba-ielts-huajing-writing-title">別翻字，翻畫面的英文寫作方法</title><desc id="brain-xueba-ielts-huajing-writing-desc">概念骨架 → 英文編碼（高階語塊或簡單句型）→ 英文段落 → 對照自評；還像翻譯就回到骨架重拆。</desc>
<defs><marker id="brain-xueba-ielts-huajing-writing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">化境寫作法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">別翻字，翻畫面</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-xueba-ielts-huajing-writing-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01 當口述者</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">概念骨架</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">只寫短詞與立場，不寫句子</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02 當林紓</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">英文重新編碼</text>
<text x="48" y="402" fill="#586b60" font-size="20">高階語塊，或簡單句型</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03 求化境</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">英文段落邏輯</text>
<text x="48" y="548" fill="#586b60" font-size="20">首句亮結論，連接詞推進</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04 編輯延伸</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">對照自評</text>
<text x="48" y="694" fill="#586b60" font-size="20">新舊並排，存進語塊卡</text>
<text x="28" y="775" fill="#586b60" font-size="19">還像翻譯，就回到骨架重拆</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
