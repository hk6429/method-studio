<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="brain-pause-map-listening-title brain-pause-map-listening-desc"><title id="brain-pause-map-listening-title">別只聽單字，聽停頓：30 秒三遍停頓地圖</title><desc id="brain-pause-map-listening-desc">換聽的對象 → 第一遍畫停頓地圖 → 第二遍核對意思邊界 → 第三遍連停頓一起跟讀 → 口說切塊 → 單字三問。</desc>
<defs><marker id="brain-pause-map-listening-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">停頓地圖 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">別只聽單字，聽停頓</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="84" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="178" fill="#d4e2d4" font-size="19">01</text>
<text x="48" y="220" fill="#fffef9" font-size="26" font-weight="650">換聽的對象</text>
<text x="48" y="206" fill="#d4e2d4" font-size="18">單字→語塊→停頓</text>
<path d="M240 231V241" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-pause-map-listening-arrow)"/>
<rect x="28" y="244" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="276" fill="#586b60" font-size="19">02</text>
<text x="48" y="318" fill="#193732" font-size="26" font-weight="650">第一遍畫地圖</text>
<text x="48" y="304" fill="#586b60" font-size="18">關字幕，停頓畫斜槓</text>
<path d="M240 329V339" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-pause-map-listening-arrow)"/>
<rect x="28" y="342" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="374" fill="#586b60" font-size="19">03</text>
<text x="48" y="416" fill="#193732" font-size="26" font-weight="650">第二遍核對</text>
<text x="48" y="402" fill="#586b60" font-size="18">開字幕，對意思邊界</text>
<path d="M240 427V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-pause-map-listening-arrow)"/>
<rect x="28" y="440" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="472" fill="#586b60" font-size="19">04</text>
<text x="48" y="514" fill="#193732" font-size="26" font-weight="650">第三遍跟讀</text>
<text x="48" y="500" fill="#586b60" font-size="18">關字幕，連停頓一起模仿</text>
<path d="M240 525V535" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-pause-map-listening-arrow)"/>
<rect x="28" y="538" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="570" fill="#586b60" font-size="19">05</text>
<text x="48" y="612" fill="#193732" font-size="26" font-weight="650">口說切塊</text>
<text x="48" y="598" fill="#586b60" font-size="18">短塊、停、再接</text>
<path d="M240 623V633" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-pause-map-listening-arrow)"/>
<rect x="28" y="636" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="668" fill="#586b60" font-size="19">06</text>
<text x="48" y="710" fill="#193732" font-size="26" font-weight="650">單字三問</text>
<text x="48" y="696" fill="#586b60" font-size="18">描述什麼／對應／多一層</text>
<text x="28" y="765" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="789" fill="#586b60" font-size="18">第一遍只畫斜槓不查字</text>
</svg>