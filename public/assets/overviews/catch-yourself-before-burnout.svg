<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="catch-yourself-before-burnout-title catch-yourself-before-burnout-desc"><title id="catch-yourself-before-burnout-title">三層心理防火牆</title><desc id="catch-yourself-before-burnout-desc">外層停幾秒做心理交換；中層別人的情緒退回、自己的情緒先容納；內層價值澄清；睡前三題檢查。</desc>
<defs><marker id="catch-yourself-before-burnout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">心理防火牆 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先接住自己，不再當隱形清潔工</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#catch-yourself-before-burnout-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="193" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="243" fill="#fffef9" font-size="38" font-weight="650">外層</text>
<text x="56" y="288" fill="#d4e2d4" font-size="27">停幾秒、心理交換、婉拒</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="193" fill="#586b60" font-size="23">02</text>
<text x="656" y="243" fill="#193732" font-size="38" font-weight="650">中層</text>
<text x="656" y="288" fill="#586b60" font-size="27">別人情緒退回，自己先容納</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="411" fill="#586b60" font-size="23">03</text>
<text x="56" y="461" fill="#193732" font-size="38" font-weight="650">內層</text>
<text x="56" y="506" fill="#586b60" font-size="27">價值澄清，不靠掌聲</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="411" fill="#586b60" font-size="23">04</text>
<text x="656" y="461" fill="#193732" font-size="38" font-weight="650">睡前三愛</text>
<text x="656" y="506" fill="#586b60" font-size="27">三題檢查，只觀察</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">每週回頭看哪一層最常失守</text>
</svg>
