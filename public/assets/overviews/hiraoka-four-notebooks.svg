<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="hiraoka-four-notebooks-title hiraoka-four-notebooks-desc"><title id="hiraoka-four-notebooks-title">手寫筆記四招</title><desc id="hiraoka-four-notebooks-desc">選方向 → 左右切 → 留餘白 → 標層級；先寫再整理，排版放在回看時。</desc>
<defs><marker id="hiraoka-four-notebooks-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">手寫筆記四招 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">直式理順序，橫式放想法</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#hiraoka-four-notebooks-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#hiraoka-four-notebooks-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#hiraoka-four-notebooks-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">選方向</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">有順序用直式，發散用橫式</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">左右切</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">橫式中線，左事實右想法</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">留餘白</text>
<text x="56" y="510" fill="#586b60" font-size="27">空位是下次想法的位置</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">標層級</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">直式縮排，橫式底線</text>
<text x="36" y="625" fill="#586b60" font-size="23">先寫再整理：寫的時候不管排版，回看時再套四招</text>
<text x="36" y="591" fill="#586b60" font-size="23">依日語影片翻譯改述，圖解為編輯整理，並非成效證明</text>
</svg>
