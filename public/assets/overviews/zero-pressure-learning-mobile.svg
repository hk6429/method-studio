<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="zpl-m-title zpl-m-desc"><title id="zpl-m-title">零壓力學習法的四個動作</title><desc id="zpl-m-desc">拆壓力 → 排時段 → 做輸出 → 週檢核；卡住時跳過、靜置或問人，身心照顧排進計畫。</desc>
<defs><marker id="zpl-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">零壓力學習法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先拆壓力，再排讀書</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">拆壓力</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">急性或慢性，目標寫成 SMART</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">排時段</text>
<text x="48" y="402" fill="#586b60" font-size="20">間隔複習，30 分鐘換一科</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">做輸出</text>
<text x="48" y="548" fill="#586b60" font-size="20">自問、教人、出題</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">週檢核</text>
<text x="48" y="694" fill="#586b60" font-size="20">四問檢查讀法，重排下週</text>
<text x="28" y="741" fill="#586b60" font-size="18">卡住：跳過、靜置或問人；睡眠運動排進計畫</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
