<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="sanshiba-spark-gas-workflow-title sanshiba-spark-gas-workflow-desc"><title id="sanshiba-spark-gas-workflow-title">Spark＋GAS 教師自動化六步</title><desc id="sanshiba-spark-gas-workflow-desc">帳號與隱私 → 專用資料夾 → 讀檔試手感 → 多步任務 → 代理寫 GAS → 排程輪詢；本機代理寫程式，Spark 在雲端固定時間讀表、回覆、通知。</desc>
