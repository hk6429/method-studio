<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">帳號與隱私</text>
<text x="56" y="292" fill="#d4e2d4" font-size="24">Pro 帳號、連結服務前先想清楚</text>
