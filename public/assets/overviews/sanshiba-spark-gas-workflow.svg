<text x="445" y="195" fill="#586b60" font-size="23">02</text>
<text x="445" y="245" fill="#193732" font-size="36" font-weight="650">專用資料夾</text>
<text x="445" y="292" fill="#586b60" font-size="24">雲端硬碟電腦版＋明確名稱</text>
<rect x="814" y="160" width="349" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="834" y="195" fill="#586b60" font-size="23">03</text>
<text x="834" y="245" fill="#193732" font-size="36" font-weight="650">讀檔試手感</text>
<text x="834" y="292" fill="#586b60" font-size="24">先列計畫、你選了才做</text>
<rect x="36" y="380" width="349" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="415" fill="#586b60" font-size="23">04</text>
<text x="56" y="465" fill="#193732" font-size="36" font-weight="650">多步任務</text>
<text x="56" y="512" fill="#586b60" font-size="24">搜尋 → 文件、簡報、試算表</text>
