<rect x="814" y="380" width="349" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="834" y="415" fill="#d4e2d4" font-size="23">06</text>
<text x="834" y="465" fill="#fffef9" font-size="36" font-weight="650">排程輪詢</text>
<text x="834" y="512" fill="#d4e2d4" font-size="24">每日整理、每小時讀表回覆</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；介面名稱為講者當日說法</text>
<text x="36" y="625" fill="#586b60" font-size="23">本機代理寫程式，Spark 在雲端固定時間讀表、回覆、通知；老師負責抽查</text>
