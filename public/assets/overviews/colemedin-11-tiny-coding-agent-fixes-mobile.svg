<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="colemedin-11-tiny-coding-agent-fixes-title colemedin-11-tiny-coding-agent-fixes-desc"><title id="colemedin-11-tiny-coding-agent-fixes-title">不改工作流也能更穩的六個動作</title><desc id="colemedin-11-tiny-coding-agent-fixes-desc">規則寫給 agent → 查規則漂移 → 必做改 hook → 保住脈絡額度 → 卡住就交接 → 新對話審查。</desc>
<defs><marker id="colemedin-11-tiny-coding-agent-fixes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">CLAUDE CODE · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="25" font-weight="650">不改工作流也能更穩的六個動作</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 214V227" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#colemedin-11-tiny-coding-agent-fixes-arrow)"/>
<path d="M240 299V312" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#colemedin-11-tiny-coding-agent-fixes-arrow)"/>
<path d="M240 384V397" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#colemedin-11-tiny-coding-agent-fixes-arrow)"/>
<path d="M240 469V482" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#colemedin-11-tiny-coding-agent-fixes-arrow)"/>
<path d="M240 554V567" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#colemedin-11-tiny-coding-agent-fixes-arrow)"/>
<rect x="28" y="144" width="424" height="70" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="46" y="174" fill="#d4e2d4" font-size="20">01</text>
<text x="86" y="174" fill="#fffef9" font-size="26" font-weight="650">規則寫給 agent</text>
<text x="86" y="200" fill="#d4e2d4" font-size="18">具體、精簡</text>
<rect x="28" y="229" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="259" fill="#586b60" font-size="20">02</text>
<text x="86" y="259" fill="#193732" font-size="26" font-weight="650">查規則漂移</text>
<text x="86" y="285" fill="#586b60" font-size="18">規則對得上程式</text>
<rect x="28" y="314" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="344" fill="#586b60" font-size="20">03</text>
<text x="86" y="344" fill="#193732" font-size="26" font-weight="650">必做改 hook</text>
<text x="86" y="370" fill="#586b60" font-size="18">完成時自動測試</text>
<rect x="28" y="399" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="429" fill="#586b60" font-size="20">04</text>
<text x="86" y="429" fill="#193732" font-size="26" font-weight="650">保住脈絡額度</text>
<text x="86" y="455" fill="#586b60" font-size="18">不 compact、少子代理</text>
<rect x="28" y="484" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="514" fill="#586b60" font-size="20">05</text>
<text x="86" y="514" fill="#193732" font-size="26" font-weight="650">卡住就交接</text>
<text x="86" y="540" fill="#586b60" font-size="18">寫文件、開新對話</text>
<rect x="28" y="569" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="599" fill="#586b60" font-size="20">06</text>
<text x="86" y="599" fill="#193732" font-size="26" font-weight="650">新對話審查</text>
<text x="86" y="625" fill="#586b60" font-size="18">先規劃驗證</text>
<text x="28" y="715" fill="#586b60" font-size="19">卡住時回到交接文件</text>
<text x="28" y="745" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
