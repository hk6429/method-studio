<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="bianshui-evidence-revision-mobile-title bianshui-evidence-revision-mobile-desc"><title id="bianshui-evidence-revision-mobile-title">從一段原文，走到有據說理</title><desc id="bianshui-evidence-revision-mobile-desc">情境提問 → 原文取證 → 操作說理 → 改稿遷移；新線索或理由不足時，回到原文重新判斷。</desc>
