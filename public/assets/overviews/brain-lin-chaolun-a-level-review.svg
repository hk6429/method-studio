<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="brain-lin-chaolun-a-level-review-title brain-lin-chaolun-a-level-review-desc"><title id="brain-lin-chaolun-a-level-review-title">說完英語一定要檢討：縫隙日記＋14 天一句型</title><desc id="brain-lin-chaolun-a-level-review-desc">說完就檢討 → 抓住糾正 → 縫隙日記 → 14 天一句型 → 主動卡殼 → 結案換題；結案後回到日記挑下一個。</desc>
<defs><marker id="brain-lin-chaolun-a-level-review-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">林超倫檢討法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">說完英語，一定要檢討</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="352" height="150" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="192" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="234" fill="#fffef9" font-size="36" font-weight="650">說完就檢討</text>
<text x="56" y="272" fill="#d4e2d4" font-size="24">重播一次，找錯位</text>
<rect x="424" y="160" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="192" fill="#586b60" font-size="23">02</text>
<text x="444" y="234" fill="#193732" font-size="36" font-weight="650">抓住糾正</text>
<text x="444" y="272" fill="#586b60" font-size="24">對方那一句，立刻複述</text>
<rect x="812" y="160" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="192" fill="#586b60" font-size="23">03</text>
<text x="832" y="234" fill="#193732" font-size="36" font-weight="650">縫隙日記</text>
<text x="832" y="272" fill="#586b60" font-size="24">左我的說法，右地道說法</text>
<rect x="36" y="350" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="382" fill="#586b60" font-size="23">04</text>
<text x="56" y="424" fill="#193732" font-size="36" font-weight="650">14 天一句型</text>
<text x="56" y="462" fill="#586b60" font-size="24">每天 3–5 個情境替換</text>
<rect x="424" y="350" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="382" fill="#586b60" font-size="23">05</text>
<text x="444" y="424" fill="#193732" font-size="36" font-weight="650">主動卡殼</text>
<text x="444" y="462" fill="#586b60" font-size="24">難題硬講，換一句總結</text>
<rect x="812" y="350" width="352" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="382" fill="#586b60" font-size="23">06</text>
<text x="832" y="424" fill="#193732" font-size="36" font-weight="650">結案換題</text>
<text x="832" y="462" fill="#586b60" font-size="24">打勾，挑下一個</text>
<path d="M394 235H416" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-lin-chaolun-a-level-review-arrow)"/>
