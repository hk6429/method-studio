<path d="M394 425H416" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-lin-chaolun-a-level-review-arrow)"/>
<path d="M782 425H804" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-lin-chaolun-a-level-review-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">結案後回到縫隙日記，挑下一個最痛的錯誤，再開 14 天</text>
