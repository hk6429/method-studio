<text x="46" y="436" fill="#193732" font-size="26" font-weight="650">深度查詞</text>
<text x="46" y="458" fill="#586b60" font-size="18">英英定義與詞根</text>
<path d="M240 468V492" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<rect x="28" y="494" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="524" fill="#586b60" font-size="18">04</text>
<text x="46" y="556" fill="#193732" font-size="26" font-weight="650">雙向回譯</text>
<text x="46" y="578" fill="#586b60" font-size="18">中譯再回譯對照</text>
<path d="M240 588V612" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<rect x="28" y="614" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="644" fill="#586b60" font-size="18">05</text>
