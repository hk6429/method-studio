<rect x="28" y="254" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="284" fill="#586b60" font-size="18">02</text>
<text x="46" y="316" fill="#193732" font-size="26" font-weight="650">結構掃描</text>
<text x="46" y="338" fill="#586b60" font-size="18">主語、動詞、受詞</text>
<path d="M240 348V372" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<rect x="28" y="374" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
