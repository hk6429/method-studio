<text x="304" y="195" fill="#586b60" font-size="22">02</text>
<text x="304" y="245" fill="#193732" font-size="36" font-weight="650">定產出</text>
<rect x="536" y="160" width="228" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="554" y="195" fill="#586b60" font-size="22">03</text>
<text x="554" y="245" fill="#193732" font-size="36" font-weight="650">移開雜訊</text>
<rect x="161" y="300" width="228" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="179" y="335" fill="#586b60" font-size="22">04</text>
<text x="179" y="385" fill="#193732" font-size="36" font-weight="650">倒數單工</text>
