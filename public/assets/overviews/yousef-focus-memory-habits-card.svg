<path d="M514 216H534" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<path d="M650 272V286H275V298" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<path d="M389 356H409" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<text x="36" y="455" fill="#586b60" font-size="23">沒完成 → 重新拆步驟</text>
