<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="digital-footprint-privacy-class-title digital-footprint-privacy-class-desc">
<title id="digital-footprint-privacy-class-title">數位足跡不裸奔：六步</title>
<desc id="digital-footprint-privacy-class-desc">防護罩 → 用詞警覺 → 三個比較問題 → 陪長輩查證 → 三來源比對 → 讀前中後。編輯整理，非成效證明。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="32" y="48" font-size="22" fill="#586b60">方法練習室 · 編輯整理</text>
<text x="32" y="105" font-size="34" font-weight="650" fill="#193732">數位足跡不裸奔：六步</text>
<path d="M32 132H1168" stroke="#bdcbbb"/>
<rect x="32" y="170" width="372" height="180" rx="8" fill="#193732" stroke="#bdcbbb"/>
<text x="52" y="204" font-size="22" fill="#d4e2d4">01</text>
<text x="52" y="250" font-size="32" font-weight="650" fill="#fffef9">防護罩</text>
<text x="52" y="290" font-size="20" fill="#d4e2d4">密碼、肖像、校徽不外洩</text>
<path d="M408 260h6" stroke="#586b60" stroke-width="2"/>
<rect x="414" y="170" width="372" height="180" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="434" y="204" font-size="22" fill="#586b60">02</text>
<text x="434" y="250" font-size="32" font-weight="650" fill="#193732">用詞警覺</text>
<text x="434" y="290" font-size="20" fill="#586b60">我從哪裡學到這個說法</text>
<path d="M790 260h6" stroke="#586b60" stroke-width="2"/>
<rect x="796" y="170" width="372" height="180" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="816" y="204" font-size="22" fill="#586b60">03</text>
<text x="816" y="250" font-size="32" font-weight="650" fill="#193732">三個比較</text>
<text x="816" y="290" font-size="20" fill="#586b60">為何生氣、哪裡不同</text>
<rect x="32" y="370" width="372" height="180" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="52" y="404" font-size="22" fill="#586b60">04</text>
<text x="52" y="450" font-size="32" font-weight="650" fill="#193732">陪長輩查證</text>
<text x="52" y="490" font-size="20" fill="#586b60">先肯定，再一起查</text>
<path d="M408 460h6" stroke="#586b60" stroke-width="2"/>
<rect x="414" y="370" width="372" height="180" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="434" y="404" font-size="22" fill="#586b60">05</text>
<text x="434" y="450" font-size="32" font-weight="650" fill="#193732">三來源比對</text>
<text x="434" y="490" font-size="20" fill="#586b60">三個 AI 加原始資料</text>
<path d="M790 460h6" stroke="#586b60" stroke-width="2"/>
<rect x="796" y="370" width="372" height="180" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="816" y="404" font-size="22" fill="#586b60">06</text>
<text x="816" y="450" font-size="32" font-weight="650" fill="#193732">讀前中後</text>
<text x="816" y="490" font-size="20" fill="#586b60">自問、比對、做做看</text>
<text x="32" y="610" font-size="22" fill="#586b60">不禁止上網，培養警覺；依文章步驟試做，留下可回看的成果</text>
</svg>
