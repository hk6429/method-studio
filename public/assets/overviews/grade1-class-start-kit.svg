<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="grade1-class-start-kit-title grade1-class-start-kit-desc"><title id="grade1-class-start-kit-title">小一新生帶班包三步驟</title><desc id="grade1-class-start-kit-desc">給家長的信、給新生的信、基本資料調查表，三份文件在開學前鋪好親師生信任。</desc>
<defs><marker id="grade1-class-start-kit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">小一帶班 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">三份文件，開學前先鋪好信任</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">看清焦慮</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">孩子怕什麼、家長擔心什麼</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">給家長的信</text>
<text x="656" y="292" fill="#586b60" font-size="27">理念、流程、聯絡方式</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">給新生的信</text>
<text x="56" y="510" fill="#586b60" font-size="27">童趣口吻，拉近距離</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">基本資料調查</text>
<text x="656" y="510" fill="#586b60" font-size="27">注音、數數、家事、悄悄話</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">改成自己的語氣，再排定寄出與回收日</text>
</svg>
