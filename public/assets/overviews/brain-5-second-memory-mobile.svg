<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="brain-5-second-memory-m-title brain-5-second-memory-m-desc"><title id="brain-5-second-memory-m-title">5 秒記憶法：先答再看，用遞增間隔練到說出口</title><desc id="brain-5-second-memory-m-desc">挑十句 → 先答再看 → 遞增間隔 → 換場景改卡；間隔為 5 秒、25 秒、2 分、10 分。</desc>
<defs><marker id="brain-5-second-memory-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">5 秒記憶法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先答再看，練到說出口</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">挑十句</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">48 小時內真的會用到的話</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">先答再看</text>
<text x="48" y="402" fill="#586b60" font-size="20">看情境開口，卡住才掀答案</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">遞增間隔</text>
<text x="48" y="548" fill="#586b60" font-size="20">5 秒→25 秒→2 分→10 分再答</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">換場景改卡</text>
<text x="48" y="694" fill="#586b60" font-size="20">AI 出情境、同句搬三處、正面寫情境</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">認得、想得出、即時說出，跟讀只到第一層</text>
</svg>
