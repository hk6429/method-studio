<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="cole-medin-second-brain-rot-title cole-medin-second-brain-rot-desc"><title id="cole-medin-second-brain-rot-title">AI 第二大腦防腐爛：狀態／事件分流</title><desc id="cole-medin-second-brain-rot-desc">認清三層 → 事實題體檢 → 分狀態或事件 → 人在迴圈審計 → 拆狀態區與事件日誌 → 寫進入庫流程；之後定期重跑體檢。</desc>
<defs><marker id="cole-medin-second-brain-rot-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
