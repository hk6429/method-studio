<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="xiayiben-most-ambitious-day-title xiayiben-most-ambitious-day-desc"><title id="xiayiben-most-ambitious-day-title">別被合理的事塞滿一整天</title><desc id="xiayiben-most-ambitious-day-desc">挑三件事 → 接上價值觀 → 合理先過濾 → 卡住換一件 → 刻意留白 → 硬撐先判斷；隔天重新挑三件。</desc>
<defs><marker id="xiayiben-most-ambitious-day-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">下一本讀什麼 EP.660 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">別被合理的事塞滿一整天</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M392 245H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-most-ambitious-day-arrow)"/>
<path d="M780 245H806" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-most-ambitious-day-arrow)"/>
<path d="M392 463H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-most-ambitious-day-arrow)"/>
<path d="M780 463H806" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-most-ambitious-day-arrow)"/>
<path d="M988 336V354H212V372" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-most-ambitious-day-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="250" fill="#fffef9" font-size="36" font-weight="650">挑三件事</text>
<text x="56" y="298" fill="#d4e2d4" font-size="24">接到這個月的目標</text>
<rect x="424" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="250" fill="#193732" font-size="36" font-weight="650">接上價值觀</text>
<text x="444" y="298" fill="#586b60" font-size="24">自主、享樂、成就</text>
<rect x="812" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="250" fill="#193732" font-size="36" font-weight="650">合理先過濾</text>
<text x="832" y="298" fill="#586b60" font-size="24">問：它通往哪裡？</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="468" fill="#193732" font-size="36" font-weight="650">卡住換一件</text>
<text x="56" y="516" fill="#586b60" font-size="24">A 不想做就做 B</text>
<rect x="424" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#586b60" font-size="23">05</text>
<text x="444" y="468" fill="#193732" font-size="36" font-weight="650">刻意留白</text>
<text x="444" y="516" fill="#586b60" font-size="24">不帶手機去散步</text>
<rect x="812" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="413" fill="#586b60" font-size="23">06</text>
<text x="832" y="468" fill="#193732" font-size="36" font-weight="650">硬撐先判斷</text>
<text x="832" y="516" fill="#586b60" font-size="24">我還在學習嗎？</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">搶走時間的常不是懶惰，而是「合理」；隔天重新挑三件</text>
</svg>
