<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="one-stop-lesson-prep-dingpu-t one-stop-lesson-prep-dingpu-d"><title id="one-stop-lesson-prep-dingpu-t">一站式備課：把重複的事做成提示詞產生器</title><desc id="one-stop-lesson-prep-dingpu-d">定任務 → 勾選產生 → 貼課文生成 → 先教再練；AI 內容需查核。</desc><defs><marker id="one-stop-lesson-prep-dingpu-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style><rect width="1200" height="650" fill="#f0f2e9"/><text x="36" y="48" fill="#586b60" font-size="26">頂埔國小備課分享 · 編輯整理</text><text x="36" y="100" fill="#193732" font-size="42" font-weight="650">把重複備課，做成一站式產生器</text><path d="M36 126H1164" stroke="#bdcbbb"/><path d="M564 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#one-stop-lesson-prep-dingpu-arrow)"/><path d="M564 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#one-stop-lesson-prep-dingpu-arrow)"/><path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#one-stop-lesson-prep-dingpu-arrow)"/><rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/><text x="56" y="195" fill="#d4e2d4" font-size="23">01</text><text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">定任務</text><text x="56" y="292" fill="#d4e2d4" font-size="27">找出重複在做的事</text><rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="656" y="195" fill="#586b60" font-size="23">02</text><text x="656" y="245" fill="#193732" font-size="38" font-weight="650">勾選產生</text><text x="656" y="292" fill="#586b60" font-size="27">常用任務一鍵成提示詞</text><rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="56" y="413" fill="#586b60" font-size="23">03</text><text x="56" y="463" fill="#193732" font-size="38" font-weight="650">貼課文生成</text><text x="56" y="510" fill="#586b60" font-size="27">交給 Gemini 做互動教材</text><rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="656" y="413" fill="#586b60" font-size="23">04</text><text x="656" y="463" fill="#193732" font-size="38" font-weight="650">先教再練</text><text x="656" y="510" fill="#586b60" font-size="27">查核後，才開放互動</text><text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text><text x="36" y="625" fill="#586b60" font-size="23">AI 產出一律先查核，再給學生用</text></svg>