<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="smalltalk-ep715-ai-process-bottleneck-title smalltalk-ep715-ai-process-bottleneck-desc"><title id="smalltalk-ep715-ai-process-bottleneck-title">AI 導入的流程方法</title><desc id="smalltalk-ep715-ai-process-bottleneck-desc">分清效率 → 走流程找堵點 → 重問問題 → 寫出標準 → 綁進流程 → 放對位置並回頭量成果。</desc>
<defs><marker id="smalltalk-ep715-ai-process-bottleneck-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">EP715 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">個人變快，不等於流程變順</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M564 215H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smalltalk-ep715-ai-process-bottleneck-arrow)"/>
<path d="M900 280V288H300V296" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smalltalk-ep715-ai-process-bottleneck-arrow)"/>
<path d="M564 361H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smalltalk-ep715-ai-process-bottleneck-arrow)"/>
<path d="M900 426V434H300V442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smalltalk-ep715-ai-process-bottleneck-arrow)"/>
<path d="M564 507H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smalltalk-ep715-ai-process-bottleneck-arrow)"/>
<rect x="36" y="150" width="528" height="130" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="182" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="228" fill="#fffef9" font-size="34" font-weight="650">分清效率</text>
<text x="56" y="264" fill="#d4e2d4" font-size="25">個人 vs 組織</text>
<rect x="636" y="150" width="528" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="182" fill="#586b60" font-size="23">02</text>
<text x="656" y="228" fill="#193732" font-size="34" font-weight="650">走流程找堵點</text>
<text x="656" y="264" fill="#586b60" font-size="25">下游多了多少</text>
<rect x="36" y="296" width="528" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="328" fill="#586b60" font-size="23">03</text>
<text x="56" y="374" fill="#193732" font-size="34" font-weight="650">重問問題</text>
<text x="56" y="410" fill="#586b60" font-size="25">哪些舊流程沒意義</text>
<rect x="636" y="296" width="528" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="328" fill="#586b60" font-size="23">04</text>
<text x="656" y="374" fill="#193732" font-size="34" font-weight="650">寫出標準</text>
<text x="656" y="410" fill="#586b60" font-size="25">7 到 8 條可打勾</text>
<rect x="36" y="442" width="528" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="474" fill="#586b60" font-size="23">05</text>
<text x="56" y="520" fill="#193732" font-size="34" font-weight="650">綁進流程</text>
<text x="56" y="556" fill="#586b60" font-size="25">檢查表＋虛擬主管</text>
<rect x="636" y="442" width="528" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="474" fill="#586b60" font-size="23">06</text>
<text x="656" y="520" fill="#193732" font-size="34" font-weight="650">放對位置</text>
<text x="656" y="556" fill="#586b60" font-size="25">回頭量下游成果</text>
<text x="36" y="610" fill="#586b60" font-size="22">堵點仍在，就回到第 2 步再走一遍流程</text>
<text x="36" y="636" fill="#586b60" font-size="20">圖解為編輯整理，並非成效證明</text>
