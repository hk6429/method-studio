<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="lovely-money-auto-rolling-in-t lovely-money-auto-rolling-in-d"><title id="lovely-money-auto-rolling-in-t">黃金數字加四個桶子</title><desc id="lovely-money-auto-rolling-in-d">算黃金數字、設半年目標、分四個桶子、長期投資、算退休差距，最後把錢當燃料。</desc>
<defs><marker id="lovely-money-auto-rolling-in-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/><text x="48" y="64" fill="#586b60" font-size="26">《讓可愛的錢自動滾進來》· 編輯整理</text><text x="48" y="118" fill="#193732" font-size="44" font-weight="650">黃金數字加四個桶子：投資小白的理財第一週</text><path d="M48 146H1152" stroke="#bdcbbb"/><rect x="48" y="190" width="320" height="150" rx="7" fill="#193732" stroke="#bdcbbb"/><text x="64" y="218" fill="#d4e2d4" font-size="18">01</text><text x="64" y="254" fill="#fffef9" font-size="28" font-weight="650">算黃金數字</text><text x="64" y="326" fill="#d4e2d4" font-size="17">月收入減全部支出</text><rect x="440" y="190" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="456" y="218" fill="#586b60" font-size="18">02</text><text x="456" y="254" fill="#193732" font-size="28" font-weight="650">設半年目標</text><text x="456" y="326" fill="#586b60" font-size="17">先為正，再翻倍</text><rect x="832" y="190" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="848" y="218" fill="#586b60" font-size="18">03</text><text x="848" y="254" fill="#193732" font-size="28" font-weight="650">分四個桶子</text><text x="848" y="326" fill="#586b60" font-size="17">先填滿一號急用金</text><rect x="48" y="410" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="64" y="438" fill="#586b60" font-size="18">04</text><text x="64" y="474" fill="#193732" font-size="28" font-weight="650">長期投資</text><text x="64" y="546" fill="#586b60" font-size="17">四守則，定期檢視</text><rect x="440" y="410" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="456" y="438" fill="#586b60" font-size="18">05</text><text x="456" y="474" fill="#193732" font-size="28" font-weight="650">算退休差距</text><text x="456" y="546" fill="#586b60" font-size="17">被動收入對支出</text><rect x="832" y="410" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="848" y="438" fill="#586b60" font-size="18">06</text><text x="848" y="474" fill="#193732" font-size="28" font-weight="650">當燃料用</text><text x="848" y="546" fill="#586b60" font-size="17">替自己買選擇權</text><path d="M368 265H436" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M760 265H828" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M992 340V375H208V406" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M368 485H436" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M760 485H828" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><text x="48" y="610" fill="#586b60" font-size="22">每半年回頭更新黃金數字；例子為編輯示範，非投資建議</text></svg>