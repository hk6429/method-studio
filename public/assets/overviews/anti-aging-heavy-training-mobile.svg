<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="anti-aging-heavy-training-title anti-aging-heavy-training-desc"><title id="anti-aging-heavy-training-title">抗老化的重量訓練</title><desc id="anti-aging-heavy-training-desc">定目標 → 遊刃有餘 → 頻率與恢復 → 進退階 → 比昨天；圖解為編輯整理。</desc>
<defs><marker id="anti-aging-heavy-training-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">EP.663 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">慢慢練的力量存款</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="150" width="424" height="92" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="178" fill="#d4e2d4" font-size="19">01</text>
<text x="48" y="208" fill="#fffef9" font-size="27" font-weight="650">定目標</text>
<text x="48" y="230" fill="#d4e2d4" font-size="19">力量與健康，不追痠痛</text>
<path d="M240 242V266" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<rect x="28" y="268" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="296" fill="#586b60" font-size="19">02</text>
<text x="48" y="326" fill="#193732" font-size="27" font-weight="650">遊刃有餘</text>
<text x="48" y="348" fill="#586b60" font-size="19">三組五下，留餘力</text>
<path d="M240 360V384" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<rect x="28" y="386" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="414" fill="#586b60" font-size="19">03</text>
<text x="48" y="444" fill="#193732" font-size="27" font-weight="650">頻率與恢復</text>
<text x="48" y="466" fill="#586b60" font-size="19">每週 1–3 次、睡飽</text>
<path d="M240 478V502" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<rect x="28" y="504" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="532" fill="#586b60" font-size="19">04</text>
<text x="48" y="562" fill="#193732" font-size="27" font-weight="650">進退階</text>
<text x="48" y="584" fill="#586b60" font-size="19">好就加一點，差就退</text>
<path d="M240 596V620" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anti-aging-heavy-training-arrow)"/>
<rect x="28" y="622" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="650" fill="#586b60" font-size="19">05</text>
<text x="48" y="680" fill="#193732" font-size="27" font-weight="650">比昨天</text>
<text x="48" y="702" fill="#586b60" font-size="19">記錄，慢慢累積</text>
<text x="28" y="766" fill="#586b60" font-size="18">圖解為編輯整理，非成效證明或醫療建議</text>
</svg>
