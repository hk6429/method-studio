<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="smarter-after-sixty-title smarter-after-sixty-desc"><title id="smarter-after-sixty-title">六十歲後，越活越聰明</title><desc id="smarter-after-sixty-desc">檢查警訊 → 溫柔好奇 → 問樂趣 → 放掉期待；用週清單每週換一件重複的事。</desc>
<defs><marker id="smarter-after-sixty-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">思維與習慣 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">六十歲後，越活越聰明</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">檢查警訊</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">麻煩、不想學、不想動</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">溫柔好奇</text>
<text x="656" y="292" fill="#586b60" font-size="27">每週試一件新東西</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">問樂趣</text>
<text x="56" y="510" fill="#586b60" font-size="27">不問學了有什麼用</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">放掉期待</text>
<text x="656" y="510" fill="#586b60" font-size="27">笑看缺點，認識新同輩</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明或醫療建議</text>
<text x="36" y="625" fill="#586b60" font-size="23">一張週清單，每週換掉一件重複的事</text>
</svg>
