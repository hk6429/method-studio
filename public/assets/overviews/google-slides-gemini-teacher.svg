<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="google-slides-gemini-teacher-title google-slides-gemini-teacher-desc"><title id="google-slides-gemini-teacher-title">Google 簡報加 Gemini 的備課流程</title><desc id="google-slides-gemini-teacher-desc">定範圍 → 確認 Gemini → 做講義 → 帶入討論 → 修圖 → 檢查分享；先自己掌握內容，再讓 AI 協作。</desc>
<defs><marker id="google-slides-gemini-teacher-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">GEMINI IN SLIDES · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先掌握內容，再讓 AI 協作做簡報</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M400 248H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="36" y="160" width="360" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">定範圍</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">受眾、一個重點、頁數</text>
<path d="M802 248H836" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="438" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="195" fill="#586b60" font-size="23">02</text>
<text x="458" y="245" fill="#193732" font-size="38" font-weight="650">確認 Gemini</text>
<text x="458" y="292" fill="#586b60" font-size="27">空白簡報看右上角</text>
<rect x="840" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="860" y="195" fill="#586b60" font-size="23">03</text>
<text x="860" y="245" fill="#193732" font-size="38" font-weight="650">做講義</text>
<text x="860" y="292" fill="#586b60" font-size="27">匯出、清格式、核對</text>
<path d="M400 466H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="36" y="378" width="360" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#d4e2d4" font-size="23">04</text>
<text x="56" y="463" fill="#fffef9" font-size="38" font-weight="650">帶入討論</text>
<text x="56" y="510" fill="#d4e2d4" font-size="27">AI 先問、再生成</text>
<path d="M802 466H836" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="438" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="413" fill="#586b60" font-size="23">05</text>
<text x="458" y="463" fill="#193732" font-size="38" font-weight="650">修圖</text>
<text x="458" y="510" fill="#586b60" font-size="27">重畫、去背、圖層</text>
<rect x="840" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="860" y="413" fill="#586b60" font-size="23">06</text>
<text x="860" y="463" fill="#193732" font-size="38" font-weight="650">檢查分享</text>
<text x="860" y="510" fill="#586b60" font-size="27">逐頁看、驗證權限</text>
<path d="M1020 338V357H216V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，功能依帳號與方案而異，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">內容不對就回到討論，不要只靠 AI 一次到位</text>
</svg>
