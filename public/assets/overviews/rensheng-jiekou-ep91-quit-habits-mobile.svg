<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="rensheng-jiekou-ep91-quit-habits-title rensheng-jiekou-ep91-quit-habits-desc"><title id="rensheng-jiekou-ep91-quit-habits-title">戒掉一個癮的改變法</title><desc id="rensheng-jiekou-ep91-quit-habits-desc">問痛苦 → 陪感覺 → 誠實辨認 → 定身份 → 換環境 → 記體感；觸發又來就回到陪感覺。</desc>
<defs><marker id="rensheng-jiekou-ep91-quit-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="44" fill="#586b60" font-size="20">人生解扣方程式 EP91 · 編輯整理</text>
<text x="28" y="88" fill="#193732" font-size="26" font-weight="650">先問「我在痛苦什麼」</text>
<path d="M28 110H452" stroke="#bdcbbb"/>
<path d="M240 218V232" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M240 318V332" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M240 418V432" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M240 518V532" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M240 618V632" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<rect x="28" y="130" width="424" height="86" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="160" fill="#d4e2d4" font-size="18">01</text>
<text x="100" y="166" fill="#fffef9" font-size="27" font-weight="650">問痛苦</text>
<text x="100" y="200" fill="#d4e2d4" font-size="18">我是因為什麼在痛苦？</text>
<rect x="28" y="230" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="260" fill="#586b60" font-size="18">02</text>
<text x="100" y="266" fill="#193732" font-size="27" font-weight="650">陪感覺</text>
<text x="100" y="300" fill="#586b60" font-size="18">衝動來時先停 3 分鐘</text>
<rect x="28" y="330" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="360" fill="#586b60" font-size="18">03</text>
<text x="100" y="366" fill="#193732" font-size="27" font-weight="650">誠實辨認</text>
<text x="100" y="400" fill="#586b60" font-size="18">不醜化，也不美化</text>
<rect x="28" y="430" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="460" fill="#586b60" font-size="18">04</text>
<text x="100" y="466" fill="#193732" font-size="27" font-weight="650">定身份</text>
<text x="100" y="500" fill="#586b60" font-size="18">我想當什麼樣的人</text>
<rect x="28" y="530" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="560" fill="#586b60" font-size="18">05</text>
<text x="100" y="566" fill="#193732" font-size="27" font-weight="650">換環境</text>
<text x="100" y="600" fill="#586b60" font-size="18">減少觸發，進新圈子</text>
<rect x="28" y="630" width="424" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="660" fill="#586b60" font-size="18">06</text>
<text x="100" y="666" fill="#193732" font-size="27" font-weight="650">記體感</text>
<text x="100" y="700" fill="#586b60" font-size="18">一天多一天的自我效能</text>
<text x="28" y="748" fill="#586b60" font-size="17">圖解為編輯整理，並非成效證明</text>
<text x="28" y="776" fill="#586b60" font-size="17">觸發又來 → 回到陪感覺；體驗變好 → 身份更穩</text>
</svg>
