<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="golf-title golf-desc"><title id="golf-title">決策前的五個停頓</title><desc id="golf-desc">先想到人 → 目標與多種做法 → 別只說做不到 → AI 當幫手 → 自己決定並回顧。</desc>
<defs><marker id="golf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">高效人生商學院 EP.0692 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">決定之前，先停五個拍子</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M388 248H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#golf-arrow)"/>
<path d="M792 248H844" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#golf-arrow)"/>
<path d="M1020 336V350H212V378" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#golf-arrow)"/>
<path d="M388 466H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#golf-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="34" font-weight="650">先想到人</text>
<text x="56" y="292" fill="#d4e2d4" font-size="22">誰受影響、在乎什麼</text>
<rect x="440" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="195" fill="#586b60" font-size="23">02</text>
<text x="460" y="245" fill="#193732" font-size="34" font-weight="650">目標與多種做法</text>
<text x="460" y="292" fill="#586b60" font-size="22">至少兩到三種再選</text>
<rect x="844" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="864" y="195" fill="#586b60" font-size="23">03</text>
<text x="864" y="245" fill="#193732" font-size="34" font-weight="650">別只說做不到</text>
<text x="864" y="292" fill="#586b60" font-size="22">換做法再試、帶方案</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="34" font-weight="650">AI 當幫手</text>
<text x="56" y="510" fill="#586b60" font-size="22">整理資料、不代為決定</text>
<rect x="440" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="413" fill="#586b60" font-size="23">05</text>
<text x="460" y="463" fill="#193732" font-size="34" font-weight="650">自己決定並回顧</text>
<text x="460" y="510" fill="#586b60" font-size="22">留下理由、事後檢視</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">AI 只整理資料，最後的決定與責任留在自己</text>
</svg>
