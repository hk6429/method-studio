<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="lovely-money-auto-rolling-in-t lovely-money-auto-rolling-in-d"><title id="lovely-money-auto-rolling-in-t">黃金數字加四個桶子</title><desc id="lovely-money-auto-rolling-in-d">算黃金數字、設半年目標、分四個桶子、長期投資、算退休差距，最後把錢當燃料。</desc>
<defs><marker id="lovely-money-auto-rolling-in-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/><text x="36" y="48" fill="#586b60" font-size="24">理財入門 · 編輯整理</text><text x="36" y="100" fill="#193732" font-size="38" font-weight="650">黃金數字加四個桶子</text><path d="M36 126H764" stroke="#bdcbbb"/><rect x="36" y="160" width="328" height="112" rx="7" fill="#193732" stroke="#bdcbbb"/><text x="56" y="195" fill="#d4e2d4" font-size="23">01</text><text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">算黃金數字</text><rect x="436" y="160" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="456" y="195" fill="#586b60" font-size="23">02</text><text x="456" y="245" fill="#193732" font-size="36" font-weight="650">分四個桶子</text><rect x="36" y="310" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="56" y="345" fill="#586b60" font-size="23">03</text><text x="56" y="395" fill="#193732" font-size="36" font-weight="650">長期投資</text><rect x="436" y="310" width="328" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="456" y="345" fill="#586b60" font-size="23">04</text><text x="456" y="395" fill="#193732" font-size="36" font-weight="650">當燃料用</text><path d="M371 216H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M600 272V290H200V300" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><path d="M371 366H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><text x="36" y="455" fill="#586b60" font-size="23">先填滿一號桶，再替未來買選擇權</text></svg>