<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" role="img" aria-labelledby="draw-andrew-negative-emotions-m-title draw-andrew-negative-emotions-m-desc"><title id="draw-andrew-negative-emotions-m-title">把負面情緒拆成四格，再決定怎麼回應</title><desc id="draw-andrew-negative-emotions-m-desc">認出整團來 → 拆成四格 → 四格寫日記 → 問自己的缺口 → 反擊換祝願 → 照表決定。</desc>
<defs><marker id="draw-andrew-negative-emotions-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="1000" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">情緒拆解 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">整團壓下來，先拆成四格</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 264V281" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-m-arrow)"/>
<path d="M240 400V417" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-m-arrow)"/>
<path d="M240 536V553" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-m-arrow)"/>
<path d="M240 672V689" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-m-arrow)"/>
<path d="M240 808V825" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-m-arrow)"/>
<rect x="28" y="154" width="424" height="105" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="187" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="222" fill="#fffef9" font-size="30" font-weight="650">認出整團來</text>
<text x="48" y="248" fill="#d4e2d4" font-size="20">一句情境：誰、在哪、發生什麼</text>
<rect x="28" y="290" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="323" fill="#586b60" font-size="21">02</text>
<text x="48" y="358" fill="#193732" font-size="30" font-weight="650">拆成四格</text>
<text x="48" y="384" fill="#586b60" font-size="20">想法／情緒／身體／衝動</text>
<rect x="28" y="426" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="459" fill="#586b60" font-size="21">03</text>
<text x="48" y="494" fill="#193732" font-size="30" font-weight="650">四格寫日記</text>
<text x="48" y="520" fill="#586b60" font-size="20">圈出現在能動的一格</text>
<rect x="28" y="562" width="424" height="105" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="48" y="595" fill="#586b60" font-size="21">04</text>
<text x="48" y="630" fill="#193732" font-size="30" font-weight="650">問自己的缺口</text>
<text x="48" y="656" fill="#586b60" font-size="20">他的錯，還是我的需求？</text>
<rect x="28" y="698" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="731" fill="#586b60" font-size="21">05</text>
<text x="48" y="766" fill="#193732" font-size="30" font-weight="650">反擊換祝願</text>
<text x="48" y="792" fill="#586b60" font-size="20">希望他身邊也有人聽</text>
<rect x="28" y="834" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="867" fill="#586b60" font-size="21">06</text>
<text x="48" y="902" fill="#193732" font-size="30" font-weight="650">照表決定</text>
<text x="48" y="928" fill="#586b60" font-size="20">回不回、何時、幾句</text>
<text x="28" y="975" fill="#586b60" font-size="18">圖解為編輯整理，並非療效證明，不取代專業協助</text>
</svg>
