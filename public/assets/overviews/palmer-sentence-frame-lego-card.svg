<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="palmer-sentence-frame-lego-title palmer-sentence-frame-lego-desc"><title id="palmer-sentence-frame-lego-title">樂高替換法的母框練習</title><desc id="palmer-sentence-frame-lego-desc">懂原理 → 收母框 → 單一替換 → 多變數加壓 → 五框驗收；卡住的框回到快速替換。</desc>
