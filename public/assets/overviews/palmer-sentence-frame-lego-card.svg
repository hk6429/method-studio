<path d="M532 378H528" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#palmer-sentence-frame-lego-arrow)"/>
<rect x="36" y="160" width="232" height="120" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="191" fill="#d4e2d4" font-size="21">01</text>
<text x="56" y="233" fill="#fffef9" font-size="30" font-weight="650">懂原理</text>

<rect x="284" y="160" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="304" y="191" fill="#586b60" font-size="21">02</text>
<text x="304" y="233" fill="#193732" font-size="30" font-weight="650">收母框</text>

<rect x="532" y="160" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="191" fill="#586b60" font-size="21">03</text>
