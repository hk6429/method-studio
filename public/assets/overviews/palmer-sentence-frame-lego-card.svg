<text x="552" y="351" fill="#586b60" font-size="21">04</text>
<text x="552" y="393" fill="#193732" font-size="30" font-weight="650">多變數加壓</text>

<rect x="284" y="320" width="232" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="304" y="351" fill="#586b60" font-size="21">05</text>
<text x="304" y="393" fill="#193732" font-size="30" font-weight="650">五框驗收</text>

<text x="36" y="460" fill="#586b60" font-size="20">卡住的框，回到快速替換再練</text></svg>
