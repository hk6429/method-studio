<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="child-allergy-vs-cold-myths-t child-allergy-vs-cold-myths-d"><title id="child-allergy-vs-cold-myths-t">孩子流鼻水的六步方法（手機版）</title><desc id="child-allergy-vs-cold-myths-d">記三天、顧臥室、調日常、固定就寢、每週運動、仍不穩找醫師</desc>
<defs><marker id="child-allergy-vs-cold-myths-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="18">親子天下Podcast · 編輯整理</text>
<text x="28" y="92" fill="#193732" font-size="30" font-weight="650">孩子老是流鼻水</text>
<text x="28" y="130" fill="#193732" font-size="22">先記錄，再調整生活</text>
<path d="M28 150H452" stroke="#bdcbbb"/>
<rect x="28" y="172" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="202" fill="#586b60" font-size="20">01</text>
<text x="46" y="208" fill="#193732" font-size="26" font-weight="650">記三天</text>
<text x="46" y="230" fill="#586b60" font-size="16">時間・鼻涕・症狀</text>
<path d="M240 244V264" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="28" y="268" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="298" fill="#586b60" font-size="20">02</text>
<text x="46" y="304" fill="#193732" font-size="26" font-weight="650">顧臥室</text>
<text x="46" y="326" fill="#586b60" font-size="16">除濕・清淨機</text>
<path d="M240 340V360" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="28" y="364" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="394" fill="#586b60" font-size="20">03</text>
<text x="46" y="400" fill="#193732" font-size="26" font-weight="650">調日常</text>
<text x="46" y="422" fill="#586b60" font-size="16">洗澡・玩具・泳池</text>
<path d="M240 436V456" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="28" y="460" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="490" fill="#586b60" font-size="20">04</text>
<text x="46" y="496" fill="#193732" font-size="26" font-weight="650">固定就寢</text>
<text x="46" y="518" fill="#586b60" font-size="16">依年齡睡眠時數</text>
<path d="M240 532V552" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="28" y="556" width="424" height="70" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="586" fill="#586b60" font-size="20">05</text>
<text x="46" y="592" fill="#193732" font-size="26" font-weight="650">每週運動</text>
<text x="46" y="614" fill="#586b60" font-size="16">三次・各30分</text>
<path d="M240 628V648" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="28" y="652" width="424" height="70" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="46" y="682" fill="#d4e2d4" font-size="20">06</text>
<text x="46" y="688" fill="#fffef9" font-size="26" font-weight="650">找醫師</text>
<text x="46" y="710" fill="#d4e2d4" font-size="16">仍不穩再談檢測</text>
<text x="28" y="770" fill="#586b60" font-size="15">節目所稱，不是醫療建議；不適請就醫</text>
</svg>
