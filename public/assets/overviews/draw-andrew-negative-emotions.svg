<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="draw-andrew-negative-emotions-title draw-andrew-negative-emotions-desc"><title id="draw-andrew-negative-emotions-title">把負面情緒拆成四格，再決定怎麼回應</title><desc id="draw-andrew-negative-emotions-desc">認出整團來 → 拆成四格 → 四格寫日記 → 問自己的缺口 → 反擊換祝願 → 照表決定；沒有特定的人就直接決定，有人刺到你才走缺口與祝願。</desc>
<defs><marker id="draw-andrew-negative-emotions-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">情緒拆解 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">整團壓下來的時候，先拆成四格</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M398 240H430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-arrow)"/>
<path d="M770 240H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-arrow)"/>
<path d="M983 320V340H217V360" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-arrow)"/>
<path d="M398 440H430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-arrow)"/>
<path d="M770 440H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-negative-emotions-arrow)"/>
<rect x="36" y="160" width="362" height="160" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="243" fill="#fffef9" font-size="36" font-weight="650">認出整團來</text>
<text x="56" y="288" fill="#d4e2d4" font-size="25">一句情境：誰、在哪、發生什麼</text>
<rect x="438" y="160" width="332" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="195" fill="#586b60" font-size="23">02</text>
<text x="458" y="243" fill="#193732" font-size="36" font-weight="650">拆成四格</text>
<text x="458" y="288" fill="#586b60" font-size="25">想法／情緒／身體／衝動</text>
<rect x="810" y="160" width="354" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="830" y="195" fill="#586b60" font-size="23">03</text>
<text x="830" y="243" fill="#193732" font-size="36" font-weight="650">四格寫日記</text>
<text x="830" y="288" fill="#586b60" font-size="25">圈出現在能動的一格</text>
<rect x="36" y="360" width="362" height="160" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="56" y="395" fill="#586b60" font-size="23">04</text>
<text x="56" y="443" fill="#193732" font-size="36" font-weight="650">問自己的缺口</text>
<text x="56" y="488" fill="#586b60" font-size="25">他的錯，還是我的需求？</text>
<rect x="438" y="360" width="332" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="395" fill="#586b60" font-size="23">05</text>
<text x="458" y="443" fill="#193732" font-size="36" font-weight="650">反擊換祝願</text>
<text x="458" y="488" fill="#586b60" font-size="25">希望他身邊也有人聽</text>
<rect x="810" y="360" width="354" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="830" y="395" fill="#586b60" font-size="23">06</text>
<text x="830" y="443" fill="#193732" font-size="36" font-weight="650">照表決定</text>
<text x="830" y="488" fill="#586b60" font-size="25">回不回、何時、幾句</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非療效證明，也不取代專業協助</text>
<text x="36" y="625" fill="#586b60" font-size="23">影片原例：想法「案子是我搞砸的」／情緒「罪惡感、不安」／身體「胸悶、頭痛」／衝動「想逃」</text>
</svg>
