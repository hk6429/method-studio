<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="rensheng-jiekou-ep85-waki-m-title rensheng-jiekou-ep85-waki-m-desc"><title id="rensheng-jiekou-ep85-waki-m-title">把 AI 當思考陪練的六步</title><desc id="rensheng-jiekou-ep85-waki-m-desc">個人化提問 → 拉離討好結尾 → 建專案包 → 對話陪練／情緒覺察／智囊團 → 自己過濾決定。</desc>
<defs><marker id="rensheng-jiekou-ep85-waki-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="20">EP85 瓦基 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">別只拿 AI 找答案，讓它陪你想</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 232V248" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep85-waki-m-arrow)"/>
<path d="M240 328V344" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep85-waki-m-arrow)"/>
<path d="M240 424V440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep85-waki-m-arrow)"/>
<path d="M240 520V536" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep85-waki-m-arrow)"/>
<path d="M240 616V632" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep85-waki-m-arrow)"/>
<rect x="28" y="150" width="424" height="80" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="180" fill="#d4e2d4" font-size="19">01</text>
<text x="96" y="186" fill="#fffef9" font-size="27" font-weight="650">個人化提問</text>
<text x="48" y="217" fill="#d4e2d4" font-size="18">我是誰、為什麼、要解決什麼</text>
<rect x="28" y="246" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="276" fill="#586b60" font-size="19">02</text>
<text x="96" y="282" fill="#193732" font-size="27" font-weight="650">拉離討好結尾</text>
<text x="48" y="313" fill="#586b60" font-size="18">有沒有我還沒想到的？</text>
<rect x="28" y="342" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="372" fill="#586b60" font-size="19">03</text>
<text x="96" y="378" fill="#193732" font-size="27" font-weight="650">建專案包</text>
<text x="48" y="409" fill="#586b60" font-size="18">埋框架，先給選項再開放</text>
<rect x="28" y="438" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="468" fill="#586b60" font-size="19">04</text>
<text x="96" y="474" fill="#193732" font-size="27" font-weight="650">對話陪練</text>
<text x="48" y="505" fill="#586b60" font-size="18">困難對話開會前先預演</text>
<rect x="28" y="534" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="564" fill="#586b60" font-size="19">05</text>
<text x="96" y="570" fill="#193732" font-size="27" font-weight="650">情緒覺察</text>
<text x="48" y="601" fill="#586b60" font-size="18">卡住時先倒五分鐘再拆</text>
<rect x="28" y="630" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="660" fill="#586b60" font-size="19">06</text>
<text x="96" y="666" fill="#193732" font-size="27" font-weight="650">智囊團</text>
<text x="48" y="697" fill="#586b60" font-size="18">十個人設，再自己過濾</text>
<text x="28" y="745" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="18">AI 給角度，最後的決定由自己寫下</text>
</svg>
