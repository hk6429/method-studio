<path d="M265 366H281" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-hard-feedback-4-steps-arrow)"/>
<path d="M518 366H534" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-hard-feedback-4-steps-arrow)"/>
<rect x="36" y="160" width="222" height="112" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="32" font-weight="650">認出那件事</text>
<rect x="289" y="160" width="222" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="309" y="195" fill="#586b60" font-size="23">02</text>
<text x="309" y="245" fill="#193732" font-size="32" font-weight="650">找提醒者</text>
<rect x="542" y="160" width="222" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="562" y="195" fill="#586b60" font-size="23">03</text>
<text x="562" y="245" fill="#193732" font-size="32" font-weight="650">縮小再問</text>
<rect x="36" y="310" width="222" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="345" fill="#586b60" font-size="23">04</text>
<text x="56" y="395" fill="#193732" font-size="32" font-weight="650">T 感謝</text>
<rect x="289" y="310" width="222" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="309" y="345" fill="#586b60" font-size="23">05</text>
<text x="309" y="395" fill="#193732" font-size="32" font-weight="650">A 承認・C 承諾</text>
<rect x="542" y="310" width="222" height="112" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="562" y="345" fill="#d4e2d4" font-size="23">06</text>
<text x="562" y="395" fill="#fffef9" font-size="32" font-weight="650">T 再感謝</text>
<text x="36" y="455" fill="#586b60" font-size="23">再感謝 → 下次更容易開口 → 回到縮小再問</text>
</svg>
