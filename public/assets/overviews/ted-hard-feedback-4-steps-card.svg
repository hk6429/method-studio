<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">TED · TACT · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">先問對問題，再用 TACT 接住</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<path d="M265 216H281" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-hard-feedback-4-steps-arrow)"/>
