<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="ted-hard-feedback-4-steps-title ted-hard-feedback-4-steps-desc"><title id="ted-hard-feedback-4-steps-title">聽得進去的回饋：TACT 四步</title><desc id="ted-hard-feedback-4-steps-desc">認出那件事 → 找提醒者 → 縮小再問 → T 感謝 → A 承認、C 承諾 → T 再感謝。</desc>
