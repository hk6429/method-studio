<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" role="img" aria-labelledby="daily-english-listen-recall-title daily-english-listen-recall-desc"><title id="daily-english-listen-recall-title">從聽懂五句，走到自己開口</title><desc id="daily-english-listen-recall-desc">盲聽核對 → 跟讀接話 → 撤除提示 → 測驗回訪；依卡點回到所需的提示重新練習。</desc>
<defs><marker id="daily-english-listen-recall-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="568" fill="#f0f2e9"/>
<text x="36" y="64" fill="#586b60" font-size="22" font-weight="500">英語日日聽 · 聽說練習路線</text>
<text x="36" y="133" fill="#193732" font-size="43" font-weight="650">從聽懂五句，走到自己開口</text>
<text x="36" y="181" fill="#586b60" font-size="25" font-weight="500">先聽再看，先說再核對；每一輪，少依賴一點提示。</text>
<path d="M295 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#daily-english-listen-recall-arrow)"/>
<path d="M587 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#daily-english-listen-recall-arrow)"/>
<path d="M879 310h24" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#daily-english-listen-recall-arrow)"/>
<path d="M1038 400V438Q1038 454 1022 454H762Q746 454 746 438V406" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#daily-english-listen-recall-arrow)"/>
<rect x="36" y="230" width="252" height="170" rx="5" fill="#193732" stroke="#bdcbbb"/><text x="58" y="264" fill="#d4e2d4" font-size="20" font-weight="500">01</text><text x="58" y="315" fill="#fffef9" font-size="32" font-weight="650">盲聽核對</text><text x="58" y="355" fill="#d4e2d4" font-size="23" font-weight="500">卡住才揭開字</text>
<rect x="328" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="350" y="264" fill="#586b60" font-size="20" font-weight="500">02</text><text x="350" y="315" fill="#193732" font-size="32" font-weight="650">跟讀接話</text><text x="350" y="355" fill="#586b60" font-size="23" font-weight="500">留白時實際說</text>
<rect x="620" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="642" y="264" fill="#586b60" font-size="20" font-weight="500">03</text><text x="642" y="315" fill="#193732" font-size="32" font-weight="650">撤除提示</text><text x="642" y="355" fill="#586b60" font-size="23" font-weight="500">由看字到回想</text>
<rect x="912" y="230" width="252" height="170" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="934" y="264" fill="#586b60" font-size="20" font-weight="500">04</text><text x="934" y="315" fill="#193732" font-size="32" font-weight="650">測驗回訪</text><text x="934" y="355" fill="#586b60" font-size="23" font-weight="500">找到卡點重練</text>
<text x="785" y="443" fill="#586b60" font-size="23" font-weight="500">按需退回提示</text>
<path d="M36 489H1164" stroke="#bdcbbb"/>
<text x="36" y="533" fill="#193732" font-size="25" font-weight="500">計次不是評分；記下還需要什麼提示，比只追次數更有用。</text>
</svg>