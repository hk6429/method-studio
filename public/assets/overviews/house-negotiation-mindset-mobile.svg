<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="house-negotiation-mindset-title house-negotiation-mindset-desc"><title id="house-negotiation-mindset-title">買房談判的心態與節奏</title><desc id="house-negotiation-mindset-desc">定底線、多間比較、第二份出價、冷靜撤回、讓對方說價、慢拒絕；超出區間就放手。</desc>
<defs><marker id="house-negotiation-mindset-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">EP2541 · 編輯整理</text>
<text x="28" y="98" fill="#193732" font-size="32" font-weight="650">不急著買，才有談判桌</text>
<path d="M28 120H452" stroke="#bdcbbb"/>
<rect x="28" y="140" width="424" height="76" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="174" fill="#d4e2d4" font-size="20">01</text>
<text x="48" y="202" fill="#fffef9" font-size="28" font-weight="650">定底線</text>
<text x="452" y="202" text-anchor="end" fill="#d4e2d4" font-size="18" dx="-16">上限價＋放手條件</text>
<path d="M240 218V238" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#house-negotiation-mindset-arrow)"/>
<rect x="28" y="240" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="274" fill="#586b60" font-size="20">02</text>
<text x="48" y="302" fill="#193732" font-size="28" font-weight="650">多間比較</text>
<text x="452" y="302" text-anchor="end" fill="#586b60" font-size="18" dx="-16">找最急的屋主</text>
<path d="M240 318V338" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#house-negotiation-mindset-arrow)"/>
<rect x="28" y="340" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="374" fill="#586b60" font-size="20">03</text>
<text x="48" y="402" fill="#193732" font-size="28" font-weight="650">第二份出價</text>
<text x="452" y="402" text-anchor="end" fill="#586b60" font-size="18" dx="-16">打破高錨點</text>
<path d="M240 418V438" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#house-negotiation-mindset-arrow)"/>
<rect x="28" y="440" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="474" fill="#586b60" font-size="20">04</text>
<text x="48" y="502" fill="#193732" font-size="28" font-weight="650">冷靜撤回</text>
<text x="452" y="502" text-anchor="end" fill="#586b60" font-size="18" dx="-16">平靜、不威脅</text>
<path d="M240 518V538" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#house-negotiation-mindset-arrow)"/>
<rect x="28" y="540" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="574" fill="#586b60" font-size="20">05</text>
<text x="48" y="602" fill="#193732" font-size="28" font-weight="650">讓對方說價</text>
<text x="452" y="602" text-anchor="end" fill="#586b60" font-size="18" dx="-16">不先吐最高價</text>
<path d="M240 618V638" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#house-negotiation-mindset-arrow)"/>
<rect x="28" y="640" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="674" fill="#586b60" font-size="20">06</text>
<text x="48" y="702" fill="#193732" font-size="28" font-weight="650">慢拒絕</text>
<text x="452" y="702" text-anchor="end" fill="#586b60" font-size="18" dx="-16">不立刻點頭</text>
<text x="28" y="772" fill="#586b60" font-size="20">超出區間就放手，找下一間</text>
</svg>
