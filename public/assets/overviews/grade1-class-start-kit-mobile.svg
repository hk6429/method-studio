<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="grade1-class-start-kit-title grade1-class-start-kit-desc"><title id="grade1-class-start-kit-title">小一新生帶班包三步驟</title><desc id="grade1-class-start-kit-desc">給家長的信、給新生的信、基本資料調查表，三份文件在開學前鋪好親師生信任。</desc>
<defs><marker id="grade1-class-start-kit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">小一帶班 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">開學前先鋪好信任</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#grade1-class-start-kit-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">看清焦慮</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">孩子怕什麼、家長擔心什麼</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">給家長的信</text>
<text x="48" y="402" fill="#586b60" font-size="20">理念、流程、聯絡方式</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">給新生的信</text>
<text x="48" y="548" fill="#586b60" font-size="20">童趣口吻，拉近距離</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">基本資料調查</text>
<text x="48" y="694" fill="#586b60" font-size="20">注音、數數、家事、悄悄話</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">改成自己的語氣，再排定寄出與回收日</text>
</svg>
