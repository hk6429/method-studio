<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="kazu-short-sentence-spiral-title kazu-short-sentence-spiral-desc"><title id="kazu-short-sentence-spiral-title">只練 30 句就開口：短句優先螺旋</title><desc id="kazu-short-sentence-spiral-desc">選一個場景 → 寫自己的 30 句 → 每天五句跟讀錄音 → 實戰與驗收；卡住的題目帶進下一圈。</desc>
<defs><marker id="kazu-short-sentence-spiral-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Kazu 短句優先螺旋 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">只練 30 句，七天把寒暄說順</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kazu-short-sentence-spiral-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kazu-short-sentence-spiral-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kazu-short-sentence-spiral-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">選一個場景</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">列 8 到 10 個一定會被問的題</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">寫自己的 30 句</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">每題 A／B 兩版，有地點與原因</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">每天五句</text>
<text x="56" y="510" fill="#586b60" font-size="27">聽、跟讀、錄音、改一處、再錄</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">實戰與驗收</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">第四天起回看文法，第七天比停頓</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">卡住的題目帶進下一圈，每圈只多一點點</text>
</svg>
