<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="vocab-duel-recall-repair-mobile-title vocab-duel-recall-repair-mobile-desc"><title id="vocab-duel-recall-repair-mobile-title">從每日十題，走到再次想起</title><desc id="vocab-duel-recall-repair-mobile-desc">定量起步 → 主動作答 → 錯字攻克 → 到期再練；答錯回查，答對也保留後續複習。</desc>
<defs><marker id="vocab-duel-recall-repair-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="640" height="1000" fill="#f0f2e9"/>
<text x="40" y="64" fill="#586b60" font-size="25" font-weight="500">字鬥英雄 · 單字練習路線</text>
<text x="40" y="127" fill="#193732" font-size="40" font-weight="650">從每日十題，</text>
<text x="40" y="183" fill="#193732" font-size="40" font-weight="650">走到再次想起</text>
<rect x="40" y="220" width="530" height="150" rx="5" fill="#193732" stroke="#bdcbbb"/><text x="62" y="254" fill="#d4e2d4" font-size="20" font-weight="500">01</text><text x="62" y="305" fill="#fffef9" font-size="32" font-weight="650">定量起步</text><text x="62" y="345" fill="#d4e2d4" font-size="23" font-weight="500">舊字弱字新字</text>
<path d="M304 373v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-mobile-arrow)"/>
<rect x="40" y="394" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="428" fill="#586b60" font-size="20" font-weight="500">02</text><text x="62" y="479" fill="#193732" font-size="32" font-weight="650">主動作答</text><text x="62" y="519" fill="#586b60" font-size="23" font-weight="500">先想再看回饋</text>
<path d="M304 547v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-mobile-arrow)"/>
<rect x="40" y="568" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="602" fill="#586b60" font-size="20" font-weight="500">03</text><text x="62" y="653" fill="#193732" font-size="32" font-weight="650">錯字攻克</text><text x="62" y="693" fill="#586b60" font-size="23" font-weight="500">找錯因再拼字</text>
<path d="M304 721v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-mobile-arrow)"/>
<rect x="40" y="742" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="776" fill="#586b60" font-size="20" font-weight="500">04</text><text x="62" y="827" fill="#193732" font-size="32" font-weight="650">到期再練</text><text x="62" y="867" fill="#586b60" font-size="23" font-weight="500">隔一段再作答</text>
<path d="M574 812H594Q608 812 608 798V650Q608 636 594 636H577" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#vocab-duel-recall-repair-mobile-arrow)"/>
<text x="40" y="941" fill="#193732" font-size="29" font-weight="600">回看錯字 → 再次嘗試拼字</text>
<text x="40" y="978" fill="#586b60" font-size="25" font-weight="500">答對，也要安排下一次複習。</text>
</svg>