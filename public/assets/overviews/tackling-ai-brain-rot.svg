<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="tackling-ai-brain-rot-title tackling-ai-brain-rot-desc"><title id="tackling-ai-brain-rot-title">認知健身五個動作</title><desc id="tackling-ai-brain-rot-desc">盤點用途、畫保留清單、代寫標示、讀人寫的原文，最後每週回顧，五個動作維持認知健身。</desc>
