<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="yousef-focus-memory-habits-title yousef-focus-memory-habits-desc"><title id="yousef-focus-memory-habits-title">專注衝刺五步</title><desc id="yousef-focus-memory-habits-desc">預約時段 → 定產出 → 移開雜訊 → 倒數單工 → 真休息；沒完成就重新拆步驟。</desc>
<defs><marker id="yousef-focus-memory-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">Sahar Yousef · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">專注衝刺五步</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="92" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="46" y="176" fill="#d4e2d4" font-size="16">01</text>
<text x="46" y="206" fill="#fffef9" font-size="30" font-weight="650">預約時段</text>
<text x="46" y="230" fill="#d4e2d4" font-size="20">寫進行事曆並告知</text>
<path d="M240 238V260" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="28" y="260" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="290" fill="#586b60" font-size="16">02</text>
<text x="46" y="320" fill="#193732" font-size="30" font-weight="650">定產出</text>
<text x="46" y="344" fill="#586b60" font-size="20">1–3 件，拆小步驟</text>
<path d="M240 352V374" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="28" y="374" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="404" fill="#586b60" font-size="16">03</text>
<text x="46" y="434" fill="#193732" font-size="30" font-weight="650">移開雜訊</text>
<text x="46" y="458" fill="#586b60" font-size="20">手機翻面，只留 VIP</text>
<path d="M240 466V488" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="28" y="488" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="518" fill="#586b60" font-size="16">04</text>
<text x="46" y="548" fill="#193732" font-size="30" font-weight="650">倒數單工</text>
<text x="46" y="572" fill="#586b60" font-size="20">一次一件，先收尾</text>
<path d="M240 580V602" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="28" y="602" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="46" y="632" fill="#586b60" font-size="16">05</text>
<text x="46" y="662" fill="#193732" font-size="30" font-weight="650">真休息</text>
<text x="46" y="686" fill="#586b60" font-size="20">看自然，不吸收資訊</text>
<text x="28" y="745" fill="#586b60" font-size="19">沒完成就重新拆步驟</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
