<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="tiago-forte-beat-ai-slop-title tiago-forte-beat-ai-slop-desc"><title id="tiago-forte-beat-ai-slop-title">在 AI 時代保持原創的六步</title><desc id="tiago-forte-beat-ai-slop-desc">往上游站 → 追細節 → 有料的亂 → 先問結果 → 三種智慧 → 換清單；新清單再往源頭走。</desc>
<defs><marker id="tiago-forte-beat-ai-slop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">TIAGO FORTE · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">別被 AI 平均掉：站回資訊源頭</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 210H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-arrow)"/>
<path d="M900 270V280H300V290" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-arrow)"/>
<path d="M571 350H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-arrow)"/>
<path d="M900 410V420H300V430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-arrow)"/>
<path d="M571 490H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#tiago-forte-beat-ai-slop-arrow)"/>
<rect x="36" y="150" width="528" height="120" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="182" fill="#d4e2d4" font-size="22">01</text>
<text x="56" y="222" fill="#fffef9" font-size="34" font-weight="650">往上游站</text>
<text x="56" y="255" fill="#d4e2d4" font-size="24">下游交給 AI，人去源頭</text>
<rect x="636" y="150" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="182" fill="#586b60" font-size="22">02</text>
<text x="656" y="222" fill="#193732" font-size="34" font-weight="650">追細節</text>
<text x="656" y="255" fill="#586b60" font-size="24">現場捕捉，保留原文</text>
<rect x="36" y="290" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="322" fill="#586b60" font-size="22">03</text>
<text x="56" y="362" fill="#193732" font-size="34" font-weight="650">有料的亂</text>
<text x="56" y="395" fill="#586b60" font-size="24">少整理，需要時交 AI</text>
<rect x="636" y="290" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="322" fill="#586b60" font-size="22">04</text>
<text x="656" y="362" fill="#193732" font-size="34" font-weight="650">先問結果</text>
<text x="656" y="395" fill="#586b60" font-size="24">誠實回答，目標縮小</text>
<rect x="36" y="430" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="462" fill="#586b60" font-size="22">05</text>
<text x="56" y="502" fill="#193732" font-size="34" font-weight="650">三種智慧</text>
<text x="56" y="535" fill="#586b60" font-size="24">人生、缺漏、慢火</text>
<rect x="636" y="430" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="462" fill="#586b60" font-size="22">06</text>
<text x="656" y="502" fill="#193732" font-size="34" font-weight="650">換清單</text>
<text x="656" y="535" fill="#586b60" font-size="24">停止欄＋改成欄</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">換完清單，再回到上游找素材；第一人稱經驗是終極新鮮資訊</text>
</svg>
