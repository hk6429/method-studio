<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="huberman-gina-poe-sleep-learning-m-title huberman-gina-poe-sleep-learning-m-desc"><title id="huberman-gina-poe-sleep-learning-m-title">學完好好睡：五個睡眠習慣</title><desc id="huberman-gina-poe-sleep-learning-m-desc">學完保住前段睡眠、固定就寢起床、睡前降溫、讓週期跑完再起床、晚睡時守住前三分之一夜，最後用一週試行表調整。</desc><defs><marker id="huberman-gina-poe-sleep-learning-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style><rect width="480" height="800" fill="#f0f2e9"/><text x="24" y="44" fill="#586b60" font-size="18">編輯整理 · 睡眠與學習</text><text x="24" y="88" fill="#193732" font-size="30" font-weight="650">學完好好睡</text><path d="M24 108H456" stroke="#bdcbbb"/><rect x="24" y="126" width="432" height="84" rx="8" fill="#193732" stroke="#bdcbbb"/><text x="42" y="160" fill="#d4e2d4" font-size="18">01</text><text x="84" y="162" fill="#fffef9" font-size="26" font-weight="650">學完留前段睡</text><text x="84" y="192" fill="#d4e2d4" font-size="18">睡前回看，準時上床</text><path d="M240 210V234" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-m-arrow)"/><rect x="24" y="234" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="42" y="268" fill="#586b60" font-size="18">02</text><text x="84" y="270" fill="#193732" font-size="26" font-weight="650">固定就寢起床</text><text x="84" y="300" fill="#586b60" font-size="18">別讓首段深睡落空</text><path d="M240 318V342" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-m-arrow)"/><rect x="24" y="342" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="42" y="376" fill="#586b60" font-size="18">03</text><text x="84" y="378" fill="#193732" font-size="26" font-weight="650">睡前降溫</text><text x="84" y="408" fill="#586b60" font-size="18">避開酒精與刺激</text><path d="M240 426V450" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-m-arrow)"/><rect x="24" y="450" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="42" y="484" fill="#586b60" font-size="18">04</text><text x="84" y="486" fill="#193732" font-size="26" font-weight="650">讓週期跑完</text><text x="84" y="516" fill="#586b60" font-size="18">約 90 分鐘一輪</text><path d="M240 534V558" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-m-arrow)"/><rect x="24" y="558" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="42" y="592" fill="#586b60" font-size="18">05</text><text x="84" y="594" fill="#193732" font-size="26" font-weight="650">晚睡守前三分之一</text><text x="84" y="624" fill="#586b60" font-size="18">隔晚回到原作息</text><path d="M240 642V666" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-m-arrow)"/><rect x="24" y="666" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="42" y="700" fill="#586b60" font-size="18">06</text><text x="84" y="702" fill="#193732" font-size="26" font-weight="650">一週試行表</text><text x="84" y="732" fill="#586b60" font-size="18">留下自己的版本</text><text x="24" y="782" fill="#586b60" font-size="16">科普說法，非醫療建議</text></svg>