<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="justin-sung-learn-faster-title justin-sung-learn-faster-desc"><title id="justin-sung-learn-faster-title">先猜再讀、分輪讀的學習方法</title><desc id="justin-sung-learn-faster-desc">換尺 → 先猜 → 對答案 → 分輪讀；回到開頭再走一輪，帶著新知識再猜。</desc>
<defs><marker id="justin-sung-learn-faster-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">LEARN FASTER · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先猜再讀、分輪讀，省下重讀時間</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-learn-faster-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-learn-faster-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-learn-faster-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">換尺</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">只比「到會為止」的總時間</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">先猜</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">掃標題關鍵詞，寫下猜測</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">對答案</text>
<text x="56" y="510" fill="#586b60" font-size="27">標對錯，寫修正與錯因</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">分輪讀</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">第一輪只讀懂得的，回頭再補</text>
<text x="36" y="625" fill="#586b60" font-size="23">讀完一輪回到開頭，帶著新知識再猜一次</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
