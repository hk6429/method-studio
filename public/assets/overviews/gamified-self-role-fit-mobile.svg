<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="gamified-self-role-fit-title gamified-self-role-fit-desc"><title id="gamified-self-role-fit-title">先選角色，再接任務</title><desc id="gamified-self-role-fit-desc">定方向 → 找線索 → 選角色 → 試任務</desc>
<defs><marker id="gamified-self-role-fit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">方法練習 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先選角色，再接任務</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#gamified-self-role-fit-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#gamified-self-role-fit-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#gamified-self-role-fit-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">定方向</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">想做什麼與原因</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">找線索</text>
<text x="48" y="402" fill="#586b60" font-size="20">過往主動投入的事</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">選角色</text>
<text x="48" y="548" fill="#586b60" font-size="20">技能與可求助的人</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">試任務</text>
<text x="48" y="694" fill="#586b60" font-size="20">交付物、期限與回饋</text>
<text x="28" y="775" fill="#586b60" font-size="19">先留下一次紀錄，再決定下次怎麼調整</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
