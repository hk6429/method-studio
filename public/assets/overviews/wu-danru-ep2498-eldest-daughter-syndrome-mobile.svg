<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="wu-danru-ep2498-eldest-daughter-syndrome-title wu-danru-ep2498-eldest-daughter-syndrome-desc"><title id="wu-danru-ep2498-eldest-daughter-syndrome-title">甩脫長女病：為索求設界線</title><desc id="wu-danru-ep2498-eldest-daughter-syndrome-desc">盤點付出 → 禮物或供養 → 放下拯救者 → 資產分開並守界；讓步只換來更多索求時，可拉開距離。</desc>
<defs><marker id="wu-danru-ep2498-eldest-daughter-syndrome-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">吳淡如 EP2498 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">甩脫長女病：為索求設界線</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#wu-danru-ep2498-eldest-daughter-syndrome-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#wu-danru-ep2498-eldest-daughter-syndrome-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#wu-danru-ep2498-eldest-daughter-syndrome-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">盤點付出</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">看清是否理所當然</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">禮物或供養</text>
<text x="48" y="402" fill="#586b60" font-size="20">訂上限與期限</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">放下拯救者</text>
<text x="48" y="548" fill="#586b60" font-size="20">不再討好，也不自責</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">資產分開</text>
<text x="48" y="694" fill="#586b60" font-size="20">守界，必要時拉開距離</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">讓步只換來更多索求時，可拉開距離</text>
</svg>
