<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="speak-louder-oral-practice-title speak-louder-oral-practice-desc"><title id="speak-louder-oral-practice-title">大音量加原聲的口說練習</title><desc id="speak-louder-oral-practice-desc">備場地 → 選材料 → 盲聽標記 → 胸腔音量 → 三加一；複述卡住就回頭補。</desc>
<defs><marker id="speak-louder-oral-practice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">口說練習 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">大聲，加上原聲，才練得開口</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">備場地</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">一人、封閉、放開音量</text>
<rect x="424" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="38" font-weight="650">選材料</text>
<text x="444" y="292" fill="#586b60" font-size="25">1-2 分鐘、有原聲</text>
<rect x="812" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="38" font-weight="650">盲聽標記</text>
<text x="832" y="292" fill="#586b60" font-size="25">三遍盲聽、標重音</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">胸腔音量</text>
<text x="56" y="510" fill="#586b60" font-size="25">手貼胸口有震動</text>
<rect x="424" y="378" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#d4e2d4" font-size="23">05</text>
<text x="444" y="463" fill="#fffef9" font-size="38" font-weight="650">三加一</text>
<text x="444" y="510" fill="#d4e2d4" font-size="25">三遍跟讀＋關書複述</text>
<path d="M388 248H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speak-louder-oral-practice-arrow)"/>
<path d="M776 248H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speak-louder-oral-practice-arrow)"/>
<path d="M988 336V357H212V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speak-louder-oral-practice-arrow)"/>
<path d="M388 466H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speak-louder-oral-practice-arrow)"/>
<text x="812" y="440" fill="#586b60" font-size="25">複述卡住，回到盲聽標記補</text>
<text x="812" y="480" fill="#586b60" font-size="25">每天約 30 分鐘（影片稱）</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">喉嚨痛是發聲位置錯的警訊，先停下來</text>
</svg>
