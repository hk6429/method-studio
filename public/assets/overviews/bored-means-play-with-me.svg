<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="bored-means-play-with-me-title bored-means-play-with-me-desc"><title id="bored-means-play-with-me-title">先陪一段，再留白</title><desc id="bored-means-play-with-me-desc">看狀態 → 陪開頭 → 一起演 → 留空間</desc>
<defs><marker id="bored-means-play-with-me-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">方法練習 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先陪一段，再留白</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#bored-means-play-with-me-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#bored-means-play-with-me-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#bored-means-play-with-me-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">看狀態</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">放鬆後再開話題</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">陪開頭</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">跟著眼前的興趣</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">一起演</text>
<text x="56" y="510" fill="#586b60" font-size="27">角色提問與回應</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">留空間</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">投入後減少干擾</text>
<text x="36" y="625" fill="#586b60" font-size="23">先留下一次紀錄，再決定下次怎麼調整</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
