<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ted-escape-productivity-obsession-title ted-escape-productivity-obsession-desc"><title id="ted-escape-productivity-obsession-title">逃離生產力焦慮：把玩排回生活</title><desc id="ted-escape-productivity-obsession-desc">重新定義 → 找磁鐵 → 調摩擦 → 留野性；儀式做不起來時回到磁鐵重找。</desc>
<defs><marker id="ted-escape-productivity-obsession-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">TED Intersections · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">逃離生產力焦慮，把「玩」排回生活</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-escape-productivity-obsession-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-escape-productivity-obsession-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-escape-productivity-obsession-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">重新定義</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">沒產出，不等於浪費時間</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">找磁鐵、訂儀式</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">玩心 × 連結 × 心流，固定時段</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">調摩擦</text>
<text x="56" y="510" fill="#586b60" font-size="27">想做的變近，想少做的變遠</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">留野性、種植物</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">每天一件小叛逆，練習不控制</text>
<text x="36" y="625" fill="#586b60" font-size="23">儀式連續兩週沒做到，回到磁鐵重找</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
