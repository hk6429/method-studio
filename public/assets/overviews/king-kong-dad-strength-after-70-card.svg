<rect x="280" y="206" width="224" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="300" y="268" fill="#193732" font-size="38" font-weight="650">核心</text>
<text x="300" y="316" fill="#586b60" font-size="22">棒式計時</text>
<rect x="528" y="206" width="224" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
