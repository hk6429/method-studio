<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="king-kong-dad-strength-after-70-title king-kong-dad-strength-after-70-desc"><title id="king-kong-dad-strength-after-70-title">70 歲後也能練的肌力方法</title><desc id="king-kong-dad-strength-after-70-desc">拆迷思 → 自我檢查 → 下肢 → 核心 → 握力 → 每週三次。</desc>
