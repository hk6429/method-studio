<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="darenxue-ep700-title darenxue-ep700-desc"><title id="darenxue-ep700-title">先定義問題，再指揮 AI</title><desc id="darenxue-ep700-desc">寫規格書 → 餵脈絡 → 問該怎麼想 → 多輪再檢驗；動手前先問有人做過嗎。</desc>
<defs><marker id="darenxue-ep700-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">大人學 EP700 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先定義問題，再指揮 AI</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#darenxue-ep700-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#darenxue-ep700-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#darenxue-ep700-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">寫問題規格書</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">目標・痛點・限制・障礙・成功標準</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">先餵脈絡</text>
<text x="48" y="402" fill="#586b60" font-size="20">流程、真實紀錄、規則</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">問該怎麼想</text>
<text x="48" y="548" fill="#586b60" font-size="20">請 AI 推薦方法，再指定</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">多輪再檢驗</text>
<text x="48" y="694" fill="#586b60" font-size="20">卡住反轉；沒把握交人</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">動手前先問「有人做過嗎」，只補差距</text>
</svg>
