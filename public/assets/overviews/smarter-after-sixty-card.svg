<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="smarter-after-sixty-title smarter-after-sixty-desc"><title id="smarter-after-sixty-title">六十歲後，越活越聰明</title><desc id="smarter-after-sixty-desc">檢查警訊 → 溫柔好奇 → 問樂趣 → 放掉期待；用週清單每週換一件重複的事。</desc>
