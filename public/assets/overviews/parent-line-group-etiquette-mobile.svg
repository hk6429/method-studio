<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="parent-line-group-etiquette-title parent-line-group-etiquette-desc"><title id="parent-line-group-etiquette-title">家長 LINE 群組不焦慮</title><desc id="parent-line-group-etiquette-desc">分級群組 → 靜音與定時看 → 記事本與大群退場 → 群規與公開透明。</desc>
<defs><marker id="parent-line-group-etiquette-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">EP.214 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">家長群組，分級後不焦慮</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">分級群組</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">每個群組有用途</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">靜音＋定時</text>
<text x="48" y="402" fill="#586b60" font-size="20">早晚各看一次</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">記事本＋退場</text>
<text x="48" y="548" fill="#586b60" font-size="20">日期寫下，大群有期限</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">群規＋透明</text>
<text x="48" y="694" fill="#586b60" font-size="20">刪文不踢人，資料完整</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">節目數字為來賓口述（影片稱）</text>
</svg>
