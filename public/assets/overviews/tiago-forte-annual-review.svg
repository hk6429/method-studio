<text x="448" y="195" fill="#586b60" font-size="23">02</text>
<text x="448" y="245" fill="#193732" font-size="38" font-weight="650">攤素材</text>
<text x="448" y="292" fill="#586b60" font-size="25">照片、紀錄、數字</text>
<rect x="820" y="160" width="344" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="840" y="195" fill="#586b60" font-size="23">03</text>
<text x="840" y="245" fill="#193732" font-size="38" font-weight="650">先感謝</text>
<text x="840" y="292" fill="#586b60" font-size="25">做得好的先寫滿一頁</text>
