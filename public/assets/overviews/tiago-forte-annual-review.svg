<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">問清單</text>
<text x="56" y="510" fill="#586b60" font-size="25">同一套問題掃各面向</text>
