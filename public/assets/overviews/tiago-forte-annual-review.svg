<rect x="36" y="160" width="344" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">排時間</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">行事曆上的一場會</text>
