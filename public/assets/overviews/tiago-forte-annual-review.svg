<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="tiago-forte-annual-review-title tiago-forte-annual-review-desc"><title id="tiago-forte-annual-review-title">年度回顧六步：先看清楚，再定方向</title><desc id="tiago-forte-annual-review-desc">排時間 → 攤素材 → 先感謝 → 問清單 → 找人聊 → 定方向；前五步看清楚，最後一步才寫目標。</desc>
