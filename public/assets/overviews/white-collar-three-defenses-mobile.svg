<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="white-collar-three-defenses-title white-collar-three-defenses-desc"><title id="white-collar-three-defenses-title">白領工作的六個準備動作</title><desc id="white-collar-three-defenses-desc">斷線底線 → 看清位置 → 自建評測 → 所有權與渠道 → 重定義身分 → 經營關係；每季回頭更新。</desc>
<defs><marker id="white-collar-three-defenses-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">生存指南 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="26" font-weight="650">白領工作的六個準備動作</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="148" width="424" height="78" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="183" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="188" fill="#fffef9" font-size="28" font-weight="650">斷線底線</text>
<text x="48" y="214" fill="#d4e2d4" font-size="19">食物水、現金、驗證</text>
<path d="M240 228V246" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="28" y="248" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="283" fill="#586b60" font-size="18">02</text>
<text x="48" y="288" fill="#193732" font-size="28" font-weight="650">看清位置</text>
<text x="48" y="314" fill="#586b60" font-size="19">標出入門型工作</text>
<path d="M240 328V346" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="28" y="348" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="383" fill="#586b60" font-size="18">03</text>
<text x="48" y="388" fill="#193732" font-size="28" font-weight="650">自建評測</text>
<text x="48" y="414" fill="#586b60" font-size="19">10 至 15 個任務</text>
<path d="M240 428V446" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="28" y="448" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="483" fill="#586b60" font-size="18">04</text>
<text x="48" y="488" fill="#193732" font-size="28" font-weight="650">所有權與渠道</text>
<text x="48" y="514" fill="#586b60" font-size="19">可帶走的資源</text>
<path d="M240 528V546" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="28" y="548" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="583" fill="#586b60" font-size="18">05</text>
<text x="48" y="588" fill="#193732" font-size="28" font-weight="650">重定義身分</text>
<text x="48" y="614" fill="#586b60" font-size="19">品格而非職稱</text>
<path d="M240 628V646" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="28" y="648" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="683" fill="#586b60" font-size="18">06</text>
<text x="48" y="688" fill="#193732" font-size="28" font-weight="650">經營關係</text>
<text x="48" y="714" fill="#586b60" font-size="19">人脈與鄰里</text>
<text x="28" y="775" fill="#586b60" font-size="19">每季回頭更新；圖解為編輯整理</text>
</svg>
