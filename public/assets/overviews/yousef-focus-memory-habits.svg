<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="yousef-focus-memory-habits-title yousef-focus-memory-habits-desc"><title id="yousef-focus-memory-habits-title">專注衝刺五步</title><desc id="yousef-focus-memory-habits-desc">預約時段 → 定產出 → 移開雜訊 → 倒數單工 → 真休息；沒完成就重新拆步驟。</desc>
<defs><marker id="yousef-focus-memory-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Sahar Yousef · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">專注衝刺：先清雜訊，再倒數單工</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="200" width="208" height="230" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="54" y="240" fill="#d4e2d4" font-size="20">01</text>
<text x="54" y="300" fill="#fffef9" font-size="34" font-weight="650">預約時段</text>
<text x="54" y="350" fill="#d4e2d4" font-size="19">寫進行事曆並告知</text>
<path d="M244 315H264" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="264" y="200" width="208" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="282" y="240" fill="#586b60" font-size="20">02</text>
<text x="282" y="300" fill="#193732" font-size="34" font-weight="650">定產出</text>
<text x="282" y="350" fill="#586b60" font-size="19">1–3 件，拆小步驟</text>
<path d="M472 315H492" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="492" y="200" width="208" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="510" y="240" fill="#586b60" font-size="20">03</text>
<text x="510" y="300" fill="#193732" font-size="34" font-weight="650">移開雜訊</text>
<text x="510" y="350" fill="#586b60" font-size="19">手機翻面，只留 VIP</text>
<path d="M700 315H720" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="720" y="200" width="208" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="738" y="240" fill="#586b60" font-size="20">04</text>
<text x="738" y="300" fill="#193732" font-size="34" font-weight="650">倒數單工</text>
<text x="738" y="350" fill="#586b60" font-size="19">一次一件，先收尾</text>
<path d="M928 315H948" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<rect x="948" y="200" width="208" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="966" y="240" fill="#586b60" font-size="20">05</text>
<text x="966" y="300" fill="#193732" font-size="34" font-weight="650">真休息</text>
<text x="966" y="350" fill="#586b60" font-size="19">看自然，不吸收資訊</text>
<path d="M1060 440V470H140V440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yousef-focus-memory-habits-arrow)"/>
<text x="36" y="540" fill="#586b60" font-size="23">沒完成就重新拆步驟，再排下一次衝刺</text>
<text x="36" y="590" fill="#586b60" font-size="23">圖解為編輯整理；數字為影片稱，並非成效證明</text>
</svg>
