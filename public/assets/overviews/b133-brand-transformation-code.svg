<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="m-title m-desc"><title id="m-title">營業額沒掉不代表安全的健檢方法</title><desc id="m-desc">分辨轉型 → 盯領先警訊 → 每月警報測試 → 顧客痛點檢查 → 三個視角與 DAS 滾動修正。</desc>
<defs><marker id="m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="48" y="60" fill="#586b60" font-size="26">B133 · 編輯整理</text>
<text x="48" y="112" fill="#193732" font-size="38" font-weight="650">營業額沒掉，不代表安全</text>
<path d="M48 138H1152" stroke="#bdcbbb"/>
<rect x="48" y="230" width="196" height="200" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="64" y="258" fill="#d4e2d4" font-size="18">01</text>
<text x="64" y="344" fill="#fffef9" font-size="26" font-weight="650">分辨轉型</text>
<text x="64" y="416" fill="#d4e2d4" font-size="18">工具外觀新品只是升級</text>
<path d="M248 330H268" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#m-arrow)"/>
<rect x="272" y="230" width="196" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="288" y="258" fill="#586b60" font-size="18">02</text>
<text x="288" y="344" fill="#193732" font-size="26" font-weight="650">盯領先警訊</text>
<text x="288" y="416" fill="#586b60" font-size="18">新客、回購、結構、效率</text>
<path d="M472 330H492" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#m-arrow)"/>
<rect x="496" y="230" width="196" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="512" y="258" fill="#586b60" font-size="18">03</text>
<text x="512" y="344" fill="#193732" font-size="26" font-weight="650">每月警報測試</text>
<text x="512" y="416" fill="#586b60" font-size="18">像消防檢查防火災</text>
<path d="M696 330H716" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#m-arrow)"/>
<rect x="720" y="230" width="196" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="736" y="258" fill="#586b60" font-size="18">04</text>
<text x="736" y="344" fill="#193732" font-size="26" font-weight="650">顧客痛點檢查</text>
<text x="736" y="416" fill="#586b60" font-size="18">場景、痛點、回購理由</text>
<path d="M920 330H940" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#m-arrow)"/>
<rect x="944" y="230" width="196" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="960" y="258" fill="#586b60" font-size="18">05</text>
<text x="960" y="344" fill="#193732" font-size="26" font-weight="650">天地自己眾生 + DAS</text>
<text x="960" y="416" fill="#586b60" font-size="18">滾動修正，方向不動</text>
<path d="M1050 436V480H250V436" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#m-arrow)"/>
<text x="48" y="540" fill="#586b60" font-size="23">發現異常 → 追問原因 → 下個月再測　圖解為編輯整理，並非成效證明</text>
</svg>
