<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="paul-lipsky-notebooklm-course-title paul-lipsky-notebooklm-course-desc"><title id="paul-lipsky-notebooklm-course-title">一本筆記本的 NotebookLM 方法</title><desc id="paul-lipsky-notebooklm-course-desc">開一本選來源 → 整理來源 → 限定範圍問 → 依用途產出 → 修訂迭代 → 找出缺口，再回頭補來源。</desc>
