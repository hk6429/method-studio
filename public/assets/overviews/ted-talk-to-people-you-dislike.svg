<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">停好意見</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">不是沒意見，是暫放一旁</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">靠近問故事</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">誰影響你、何時開始、意味什麼</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">十秒問題</text>
<text x="56" y="510" fill="#586b60" font-size="27">刪掉鋪陳與立場說明</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">聽破口</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">語氣一晃，溫和邀請反思</text>
<text x="36" y="625" fill="#586b60" font-size="23">談完取回意見：有沒有移動、學到什麼，各記一句</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
