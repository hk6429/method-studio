<text x="36" y="48" fill="#586b60" font-size="26">TED · Joshua Johnson · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">和討厭的人談話：用顯微鏡，不用望遠鏡</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-talk-to-people-you-dislike-arrow)"/>
