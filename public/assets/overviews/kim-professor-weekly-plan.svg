<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="kim-professor-weekly-plan-title kim-professor-weekly-plan-desc"><title id="kim-professor-weekly-plan-title">週計畫三行字的方法</title><desc id="kim-professor-weekly-plan-desc">照照自己 → 寫方向 → 寫核心行動 → 寫平衡；每天對照，週末回顧後回到反思。</desc>
<defs><marker id="kim-professor-weekly-plan-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">週計畫 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">週計畫不是排行程，是最短的人生策略會議</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-weekly-plan-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-weekly-plan-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-weekly-plan-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">照照自己</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">時間花在哪、拖了什麼、活出自己了嗎</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">寫方向</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">這週最重要的人生方向，只寫一行</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">寫核心行動</text>
<text x="56" y="510" fill="#586b60" font-size="27">星期幾、做什麼、做多久，先決定捨棄</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">寫平衡</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">一週想守住的生活平衡，可打勾</text>
<text x="36" y="625" fill="#586b60" font-size="23">每天一分鐘對照待辦，週末十五分鐘回顧，再回到 01 重新開始</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
