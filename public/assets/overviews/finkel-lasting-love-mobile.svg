<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="finkel-lasting-love-title finkel-lasting-love-desc"><title id="finkel-lasting-love-title">用「找、餵、守」養大你們的暗號</title><desc id="finkel-lasting-love-desc">先做 ditto 測試，再用找、餵、守三個動作養大專屬的私人世界；圖解為編輯整理。</desc>
<defs><marker id="finkel-lasting-love-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">TED · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">契合是一起造出來的</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">ditto 測試</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">寫下只有你們懂的話</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">找</text>
<text x="48" y="402" fill="#586b60" font-size="20">留意「只屬於我們」的瞬間</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">餵</text>
<text x="48" y="548" fill="#586b60" font-size="20">重複、延伸、排成儀式</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">守</text>
<text x="48" y="694" fill="#586b60" font-size="20">護住共同世界，留下象徵物</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">新的暗號出現後，再回到「找」</text>
</svg>
