<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="google-slides-gemini-teacher-title google-slides-gemini-teacher-desc"><title id="google-slides-gemini-teacher-title">Google 簡報加 Gemini 的備課流程</title><desc id="google-slides-gemini-teacher-desc">定範圍 → 確認 Gemini → 做講義 → 帶入討論 → 修圖 → 檢查分享；先自己掌握內容，再讓 AI 協作。</desc>
<defs><marker id="google-slides-gemini-teacher-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="24" y="40" fill="#586b60" font-size="16">GEMINI IN SLIDES · 編輯整理</text>
<text x="24" y="80" fill="#193732" font-size="28" font-weight="650">先掌握內容，AI 再協作</text>
<path d="M24 98H456" stroke="#bdcbbb"/>
<path d="M240 206V220" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="24" y="116" width="432" height="88" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="42" y="150" fill="#d4e2d4" font-size="16">01</text>
<text x="84" y="156" fill="#fffef9" font-size="28" font-weight="650">定範圍</text>
<text x="84" y="188" fill="#d4e2d4" font-size="18">受眾、一個重點、頁數</text>
<path d="M240 310V324" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="24" y="220" width="432" height="88" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="42" y="254" fill="#586b60" font-size="16">02</text>
<text x="84" y="260" fill="#193732" font-size="28" font-weight="650">確認 Gemini</text>
<text x="84" y="292" fill="#586b60" font-size="18">空白簡報看右上角</text>
<path d="M240 414V428" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="24" y="324" width="432" height="88" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="42" y="358" fill="#586b60" font-size="16">03</text>
<text x="84" y="364" fill="#193732" font-size="28" font-weight="650">做講義</text>
<text x="84" y="396" fill="#586b60" font-size="18">匯出、清格式、核對</text>
<path d="M240 518V532" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="24" y="428" width="432" height="88" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="42" y="462" fill="#d4e2d4" font-size="16">04</text>
<text x="84" y="468" fill="#fffef9" font-size="28" font-weight="650">帶入討論</text>
<text x="84" y="500" fill="#d4e2d4" font-size="18">AI 先問、再生成</text>
<path d="M240 622V636" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#google-slides-gemini-teacher-arrow)"/>
<rect x="24" y="532" width="432" height="88" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="42" y="566" fill="#586b60" font-size="16">05</text>
<text x="84" y="572" fill="#193732" font-size="28" font-weight="650">修圖</text>
<text x="84" y="604" fill="#586b60" font-size="18">重畫、去背、圖層</text>
<rect x="24" y="636" width="432" height="88" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="42" y="670" fill="#586b60" font-size="16">06</text>
<text x="84" y="676" fill="#193732" font-size="28" font-weight="650">檢查分享</text>
<text x="84" y="708" fill="#586b60" font-size="18">逐頁看、驗證權限</text>
<text x="24" y="766" fill="#586b60" font-size="15">圖解為編輯整理，並非成效證明</text>
</svg>
