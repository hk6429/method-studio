<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">停好意見</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">不是沒意見，是暫放一旁</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">靠近問故事</text>
<text x="48" y="402" fill="#586b60" font-size="20">誰影響你、何時開始、意味什麼</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">十秒問題</text>
<text x="48" y="548" fill="#586b60" font-size="20">刪掉鋪陳與立場說明</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">聽破口</text>
<text x="48" y="694" fill="#586b60" font-size="20">語氣一晃，溫和邀請反思</text>
<text x="28" y="775" fill="#586b60" font-size="19">談完取回意見，記一句學到什麼</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
