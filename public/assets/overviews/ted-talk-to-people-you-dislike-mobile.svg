<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">TED · Joshua Johnson · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">和討厭的人談話：靠近，不拉遠</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-talk-to-people-you-dislike-m-arrow)"/>
