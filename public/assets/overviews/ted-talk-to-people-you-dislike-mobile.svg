<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="ted-talk-to-people-you-dislike-m-title ted-talk-to-people-you-dislike-m-desc"><title id="ted-talk-to-people-you-dislike-m-title">和討厭的人談話：靠近而不是拉遠</title><desc id="ted-talk-to-people-you-dislike-m-desc">停好意見 → 靠近問故事 → 十秒問題 → 聽破口；談完取回意見，記一句學到什麼。</desc>
