<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="li-harry-claude-plain-language-title li-harry-claude-plain-language-desc"><title id="li-harry-claude-plain-language-title">讓 Claude 說人話的設定方法</title><desc id="li-harry-claude-plain-language-desc">認出症狀 → 備好指令 → 切輸出風格 → 同題重測；只有單次看不懂時改用 skill 局部處理。</desc>
<defs><marker id="li-harry-claude-plain-language-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Claude Code Output Style · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">讓 Claude 說人話，不再堆黑話</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#li-harry-claude-plain-language-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#li-harry-claude-plain-language-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#li-harry-claude-plain-language-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">認出症狀</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">太長、太深、把你當專家</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">備好說人話指令</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">白話、精簡、每條可檢查</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">切 Output Style</text>
<text x="56" y="510" fill="#586b60" font-size="27">/config → 從 default 換成白話版</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">同題重測</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">一字不改再問，前後對照</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">只有單次看不懂 → 改叫 skill 局部白話，不必全局切風格</text>
</svg>
