<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="little-gecko-reading-writing-class-title little-gecko-reading-writing-class-desc"><title id="little-gecko-reading-writing-class-title">小壁虎老師的語詞三招</title><desc id="little-gecko-reading-writing-class-desc">認詞、遊戲造詞、收集好詞、支援語詞、短文造句、替換擴充六個步驟。</desc>
<defs><marker id="little-gecko-reading-writing-class-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
