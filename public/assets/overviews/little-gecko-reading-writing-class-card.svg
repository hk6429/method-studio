<text x="298" y="184" fill="#586b60" font-size="20">02</text>
<text x="298" y="228" fill="#193732" font-size="28" font-weight="650">遊戲造詞</text>
<rect x="520" y="150" width="222" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="540" y="184" fill="#586b60" font-size="20">03</text>
<text x="540" y="228" fill="#193732" font-size="28" font-weight="650">收集好詞</text>
<rect x="36" y="300" width="222" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="334" fill="#586b60" font-size="20">04</text>
<text x="56" y="378" fill="#193732" font-size="28" font-weight="650">支援語詞</text>
<rect x="278" y="300" width="222" height="130" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="298" y="334" fill="#586b60" font-size="20">05</text>
<text x="298" y="378" fill="#193732" font-size="28" font-weight="650">短文造句</text>
