<text x="540" y="334" fill="#586b60" font-size="20">06</text>
<text x="540" y="378" fill="#193732" font-size="28" font-weight="650">替換擴充</text>
<text x="36" y="450" fill="#586b60" font-size="20">圖解為編輯整理，並非成效證明</text>
