<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="serhant-get-to-yes-mt serhant-get-to-yes-md"><title id="serhant-get-to-yes-mt">勾住、幫忙、請求、跟進</title><desc id="serhant-get-to-yes-md">先勾住、再幫忙、信任後請求，之後長期跟進；對方說停就停。</desc>
<defs><marker id="serhant-get-to-yes-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="24" y="48" fill="#586b60" font-size="18">Ryan Serhant · 編輯整理</text>
<text x="24" y="92" fill="#193732" font-size="28" font-weight="650">先勾住，再幫忙，最後才開口</text>
<path d="M24 112H456" stroke="#bdcbbb"/>
<rect x="24" y="140" width="432" height="100" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="44" y="174" fill="#d4e2d4" font-size="20">01</text>
<text x="44" y="202" fill="#fffef9" font-size="30" font-weight="650">勾住</text>
<text x="44" y="224" fill="#d4e2d4" font-size="17">誇一句、找共同點</text>
<path d="M240 240V274" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#serhant-get-to-yes-m-arrow)"/>
<rect x="24" y="280" width="432" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="314" fill="#586b60" font-size="20">02</text>
<text x="44" y="342" fill="#193732" font-size="30" font-weight="650">幫忙</text>
<text x="44" y="364" fill="#586b60" font-size="17">先給一個小忙</text>
<path d="M240 380V414" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#serhant-get-to-yes-m-arrow)"/>
<rect x="24" y="420" width="432" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="454" fill="#586b60" font-size="20">03</text>
<text x="44" y="482" fill="#193732" font-size="30" font-weight="650">請求</text>
<text x="44" y="504" fill="#586b60" font-size="17">具體，說清下一步</text>
<path d="M240 520V554" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#serhant-get-to-yes-m-arrow)"/>
<rect x="24" y="560" width="432" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="594" fill="#586b60" font-size="20">04</text>
<text x="44" y="622" fill="#193732" font-size="30" font-weight="650">跟進</text>
<text x="44" y="644" fill="#586b60" font-size="17">三個 F，不夾帶請求</text>
<text x="24" y="730" fill="#586b60" font-size="17">對方說停就停；有新動態，再回到勾住。</text>
<text x="24" y="765" fill="#586b60" font-size="15">圖解為編輯整理，不是成效證明。</text>
</svg>
