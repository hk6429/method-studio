<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">去除 AI 味 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">用自己的舊文，替 AI 建一份風格指南</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-remove-ai-flavor-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-remove-ai-flavor-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiayiben-remove-ai-flavor-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">蒐集樣本</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">約十篇自己打的字</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">分步萃取</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">AI 給選項，你選與糾正</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">寫成指南</text>
<text x="56" y="510" fill="#586b60" font-size="27">只改語氣、不編故事、不換順序</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">日常呼叫</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">放進所有專案，隨手改寫</text>
<text x="36" y="625" fill="#586b60" font-size="23">每年更新一版；內容空泛時先收斂觀點，再改語氣</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
