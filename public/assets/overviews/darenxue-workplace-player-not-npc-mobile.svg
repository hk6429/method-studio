<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="darenxue-workplace-player-not-npc-m-title darenxue-workplace-player-not-npc-m-desc"><title id="darenxue-workplace-player-not-npc-m-title">當職場的玩家，不當 NPC</title><desc id="darenxue-workplace-player-not-npc-m-desc">盤點角色 → 看懂規則 → 列關鍵字 → 集點卡 → 調頻率 → 累積籌碼；調頻率結果回頭修正關鍵字，卡快蓋滿時決定續卡或下一站。</desc>
