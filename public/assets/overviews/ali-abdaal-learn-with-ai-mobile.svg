<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1090" role="img" aria-labelledby="ali-abdaal-learn-with-ai-m-title ali-abdaal-learn-with-ai-m-desc"><title id="ali-abdaal-learn-with-ai-m-title">把 AI 當家教：專案式邊做邊學</title><desc id="ali-abdaal-learn-with-ai-m-desc">選專案 → 開口問 → 追好奇 → 找爭議 → 先說再測 → 拍照問；覺得夠了就停，寫下下一個專案。</desc>
<defs><marker id="ali-abdaal-learn-with-ai-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="1090" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">AI 家教 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">從一個想做的專案出發</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-learn-with-ai-m-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-learn-with-ai-m-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-learn-with-ai-m-arrow)"/>
<path d="M240 712V729" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-learn-with-ai-m-arrow)"/>
<path d="M240 858V875" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-learn-with-ai-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">選專案</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">想做出什麼、想弄懂什麼</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">開口問</text>
<text x="48" y="402" fill="#586b60" font-size="20">用說的，一次只給一塊</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">追好奇</text>
<text x="48" y="548" fill="#586b60" font-size="20">要圖解、要熟悉世界的比喻</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">找爭議</text>
<text x="48" y="694" fill="#586b60" font-size="20">兩邊最強理由，依風險查證</text>
<rect x="28" y="738" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="773" fill="#586b60" font-size="21">05</text>
<text x="48" y="814" fill="#193732" font-size="30" font-weight="650">先說再測</text>
<text x="48" y="840" fill="#586b60" font-size="20">我先講你糾正，再一題一題考</text>
<rect x="28" y="884" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="919" fill="#586b60" font-size="21">06</text>
<text x="48" y="960" fill="#193732" font-size="30" font-weight="650">拍照問</text>
<text x="48" y="986" fill="#586b60" font-size="20">卡住拍現況，夠了就停</text>
<text x="28" y="1035" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="1066" fill="#586b60" font-size="19">夠了就停，寫下下一個專案，隔日再測</text>
</svg>
