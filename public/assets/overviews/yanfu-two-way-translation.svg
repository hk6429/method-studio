<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="yanfu-two-way-translation-title yanfu-two-way-translation-desc"><title id="yanfu-two-way-translation-title">長難句先抓承重牆：嚴復式四招精讀</title><desc id="yanfu-two-way-translation-desc">綁定任務 → 結構掃描 → 深度查詢 → 雙向回譯 → 一週輪替。</desc>
<defs><marker id="yanfu-two-way-translation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">嚴復式精讀 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">長難句先抓承重牆：四招精讀</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="348" height="160" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="192" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="234" fill="#fffef9" font-size="34" font-weight="650">綁定任務</text>
<text x="56" y="296" fill="#d4e2d4" font-size="24">只讀專業領域材料</text>
<rect x="426" y="160" width="348" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="446" y="192" fill="#586b60" font-size="23">02</text>
<text x="446" y="234" fill="#193732" font-size="34" font-weight="650">結構掃描</text>
<text x="446" y="296" fill="#586b60" font-size="24">主語、動詞、受詞</text>
<rect x="816" y="160" width="348" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="836" y="192" fill="#586b60" font-size="23">03</text>
<text x="836" y="234" fill="#193732" font-size="34" font-weight="650">深度查詞</text>
<text x="836" y="296" fill="#586b60" font-size="24">英英定義與詞根</text>
<rect x="36" y="370" width="348" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="402" fill="#586b60" font-size="23">04</text>
<text x="56" y="444" fill="#193732" font-size="34" font-weight="650">雙向回譯</text>
<text x="56" y="506" fill="#586b60" font-size="24">中譯再回譯對照</text>
<rect x="426" y="370" width="348" height="160" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="446" y="402" fill="#586b60" font-size="23">05</text>
<text x="446" y="444" fill="#193732" font-size="34" font-weight="650">一週輪替</text>
<text x="446" y="506" fill="#586b60" font-size="24">同一段材料用到底</text>
<path d="M390 240H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<path d="M780 240H808" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<path d="M990 324V344H210V364" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<path d="M390 450H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#yanfu-two-way-translation-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">回譯要合上原文憑記憶；換下一段材料就回到第一步</text>
</svg>