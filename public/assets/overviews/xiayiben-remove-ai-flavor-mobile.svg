<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">分步萃取</text>
<text x="48" y="402" fill="#586b60" font-size="20">AI 給選項，你選與糾正</text>
