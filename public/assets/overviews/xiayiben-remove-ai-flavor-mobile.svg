<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">蒐集樣本</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">約十篇自己打的字</text>
