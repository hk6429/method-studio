<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="agentcrew-ai-collaboration-method-title agentcrew-ai-collaboration-method-desc"><title id="agentcrew-ai-collaboration-method-title">AI 協作六步：從除錯工變回指揮官</title><desc id="agentcrew-ai-collaboration-method-desc">講意圖 → 先計劃 → 驗證據 → 管桌面 → 寫 harness → 定邊界；AI 可以做但不能負責，人負責指揮與驗收。</desc>
<defs><marker id="agentcrew-ai-collaboration-method-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">AGENTCREW · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">AI 可以做，但不能負責：指揮與驗收六步</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M398 246H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentcrew-ai-collaboration-method-arrow)"/>
<path d="M776 246H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentcrew-ai-collaboration-method-arrow)"/>
<path d="M398 466H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentcrew-ai-collaboration-method-arrow)"/>
<path d="M776 466H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentcrew-ai-collaboration-method-arrow)"/>
<path d="M983 336V356H217V374" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#agentcrew-ai-collaboration-method-arrow)"/>
<rect x="36" y="160" width="362" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="36" font-weight="650">講意圖</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">痛點＋結果＋驗收標準</text>
<rect x="436" y="160" width="362" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="195" fill="#586b60" font-size="23">02</text>
<text x="456" y="245" fill="#193732" font-size="36" font-weight="650">先計劃</text>
<text x="456" y="292" fill="#586b60" font-size="25">計劃模式，八成同意放行</text>
<rect x="814" y="160" width="350" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="834" y="195" fill="#586b60" font-size="23">03</text>
<text x="834" y="245" fill="#193732" font-size="36" font-weight="650">驗證據</text>
<text x="834" y="292" fill="#586b60" font-size="25">翻工具鏈或獨立子代理</text>
<rect x="36" y="380" width="362" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="415" fill="#586b60" font-size="23">04</text>
<text x="56" y="465" fill="#193732" font-size="36" font-weight="650">管桌面</text>
<text x="56" y="512" fill="#586b60" font-size="25">一對話一任務，文件接力</text>
<rect x="436" y="380" width="362" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="456" y="415" fill="#586b60" font-size="23">05</text>
<text x="456" y="465" fill="#193732" font-size="36" font-weight="650">寫 harness</text>
<text x="456" y="512" fill="#586b60" font-size="25">分層按需載入，越少越好</text>
<rect x="814" y="380" width="350" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="834" y="415" fill="#586b60" font-size="23">06</text>
<text x="834" y="465" fill="#193732" font-size="36" font-weight="650">定邊界</text>
<text x="834" y="512" fill="#586b60" font-size="25">可逆×可驗證，三步糾錯</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">宣稱不等於事實；只有寫進檔案的才算記住</text>
</svg>
