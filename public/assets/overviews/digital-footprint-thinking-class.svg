<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="digital-footprint-thinking-class-title digital-footprint-thinking-class-desc"><title id="digital-footprint-thinking-class-title">隱私被誰看光了：數位足跡思辨方法</title><desc id="digital-footprint-thinking-class-desc">認出流失 → 防護習慣 → 歷史對照 → 交叉查證；仍有疑問時回到再查。</desc>
<defs><marker id="digital-footprint-thinking-class-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">數位足跡 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">隱私被誰看光了？</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/><path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/><path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">認出流失</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">被看與自己露出</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">防護習慣</text>
<text x="656" y="292" fill="#586b60" font-size="27">密碼、遮臉、不亂點</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">歷史對照</text>
<text x="56" y="510" fill="#586b60" font-size="27">保甲連坐與監視</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">交叉查證</text>
<text x="656" y="510" fill="#586b60" font-size="27">三個以上來源</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">仍有疑問時，回到再找一個來源</text>
</svg>
