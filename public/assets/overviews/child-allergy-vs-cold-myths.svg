<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="child-allergy-vs-cold-myths-t child-allergy-vs-cold-myths-d"><title id="child-allergy-vs-cold-myths-t">孩子流鼻水的六步方法</title><desc id="child-allergy-vs-cold-myths-d">記三天、顧臥室、調日常、固定就寢、每週運動、仍不穩找醫師</desc>
<defs><marker id="child-allergy-vs-cold-myths-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="48" y="64" fill="#586b60" font-size="26">親子天下Podcast · 編輯整理</text>
<text x="48" y="116" fill="#193732" font-size="42" font-weight="650">孩子老是流鼻水：先記錄，再調整生活</text>
<path d="M48 142H1152" stroke="#bdcbbb"/>
<rect x="48" y="180" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="66" y="210" fill="#586b60" font-size="20">01</text>
<text x="66" y="273" fill="#193732" font-size="30" font-weight="650">記三天</text>
<text x="66" y="299" fill="#586b60" font-size="18">時間・鼻涕・症狀</text>
<path d="M374 255H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="440" y="180" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="210" fill="#586b60" font-size="20">02</text>
<text x="458" y="273" fill="#193732" font-size="30" font-weight="650">顧臥室</text>
<text x="458" y="299" fill="#586b60" font-size="18">除濕・清淨機</text>
<path d="M766 255H826" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="832" y="180" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="850" y="210" fill="#586b60" font-size="20">03</text>
<text x="850" y="273" fill="#193732" font-size="30" font-weight="650">調日常</text>
<text x="850" y="299" fill="#586b60" font-size="18">洗澡・玩具・泳池</text>
<rect x="48" y="390" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="66" y="420" fill="#586b60" font-size="20">04</text>
<text x="66" y="483" fill="#193732" font-size="30" font-weight="650">固定就寢</text>
<text x="66" y="509" fill="#586b60" font-size="18">依年齡睡眠時數</text>
<path d="M374 465H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="440" y="390" width="320" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="420" fill="#586b60" font-size="20">05</text>
<text x="458" y="483" fill="#193732" font-size="30" font-weight="650">每週運動</text>
<text x="458" y="509" fill="#586b60" font-size="18">三次・各30分</text>
<path d="M766 465H826" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<rect x="832" y="390" width="320" height="150" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="850" y="420" fill="#d4e2d4" font-size="20">06</text>
<text x="850" y="483" fill="#fffef9" font-size="30" font-weight="650">找醫師</text>
<text x="850" y="509" fill="#d4e2d4" font-size="18">仍不穩再談檢測</text>
<path d="M992 334V356H208V384" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#child-allergy-vs-cold-myths-arrow)"/>
<text x="48" y="610" fill="#586b60" font-size="22">節目所稱，不是醫療建議；黃濃鼻涕超過十天、發燒或痰音咳嗽請就醫</text>
</svg>
