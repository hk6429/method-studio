<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="digital-footprint-thinking-class-title digital-footprint-thinking-class-desc"><title id="digital-footprint-thinking-class-title">隱私被誰看光了：數位足跡思辨方法</title><desc id="digital-footprint-thinking-class-desc">認出流失 → 防護習慣 → 歷史對照 → 交叉查證；仍有疑問時回到再查。</desc>
<defs><marker id="digital-footprint-thinking-class-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">數位足跡 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">隱私被誰看光了？</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 269V296" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/><path d="M240 415V442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/><path d="M240 561V588" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#digital-footprint-thinking-class-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">認出流失</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">被看與自己露出</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">防護習慣</text>
<text x="48" y="402" fill="#586b60" font-size="20">密碼、遮臉、不亂點</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">歷史對照</text>
<text x="48" y="548" fill="#586b60" font-size="20">保甲連坐與監視</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">交叉查證</text>
<text x="48" y="694" fill="#586b60" font-size="20">三個以上來源</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">仍有疑問時，回到再找一個來源</text>
</svg>
