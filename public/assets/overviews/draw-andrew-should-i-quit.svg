<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="draw-andrew-should-i-quit-title draw-andrew-should-i-quit-desc"><title id="draw-andrew-should-i-quit-title">該不該辭職的三問清單</title><desc id="draw-andrew-should-i-quit-desc">分清狀態 → 認出週期 → 三問檢查 → 寫下目的地 → 進行中小專案；三問至少一項還在就留下，三項全空才考慮離開。</desc>
<defs><marker id="draw-andrew-should-i-quit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">DRAW ANDREW · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">該不該走？先問三個問題，再決定</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M387 248H421" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-should-i-quit-arrow)"/>
<path d="M779 248H813" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-should-i-quit-arrow)"/>
<path d="M992 341V354H208V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-should-i-quit-arrow)"/>
<path d="M387 466H421" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-should-i-quit-arrow)"/>
<path d="M779 466H813" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#draw-andrew-should-i-quit-arrow)"/>
<rect x="36" y="160" width="344" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">分清狀態</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">想休息，還是想找方向</text>
<rect x="428" y="160" width="344" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="195" fill="#586b60" font-size="23">02</text>
<text x="448" y="245" fill="#193732" font-size="38" font-weight="650">認出週期</text>
<text x="448" y="292" fill="#586b60" font-size="27">上手了、回報沒跟上</text>
<rect x="820" y="160" width="344" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="840" y="195" fill="#586b60" font-size="23">03</text>
<text x="840" y="245" fill="#193732" font-size="38" font-weight="650">三問檢查</text>
<text x="840" y="292" fill="#586b60" font-size="27">享受？擅長？學得到？</text>
<rect x="36" y="378" width="344" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">寫下目的地</text>
<text x="56" y="510" fill="#586b60" font-size="27">補最弱的那一欄</text>
<rect x="428" y="378" width="344" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="413" fill="#586b60" font-size="23">05</text>
<text x="448" y="463" fill="#193732" font-size="38" font-weight="650">進行中小專案</text>
<text x="448" y="510" fill="#586b60" font-size="27">不求完美、不設截止日</text>
<rect x="820" y="378" width="344" height="176" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="840" y="413" fill="#586b60" font-size="23">結論</text>
<text x="840" y="463" fill="#193732" font-size="32" font-weight="650">一項還在：留下</text>
<text x="840" y="510" fill="#193732" font-size="32" font-weight="650">三項全空：才走</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">三問要寫具體證據；三個月後重填一次再比對</text>
</svg>
