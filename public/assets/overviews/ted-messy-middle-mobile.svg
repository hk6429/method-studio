<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="ted-messy-middle-m-title ted-messy-middle-m-desc"><title id="ted-messy-middle-m-title">撐過混亂中段的五個動作</title><desc id="ted-messy-middle-m-desc">認出中段 → 成果微光 → 團隊微光 → 自己微光 → 慶祝小勝；每週回頭再找一輪。</desc>
<defs><marker id="ted-messy-middle-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">TED · 混亂中段 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">山頂看不到時，先找微光</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 252V268" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-messy-middle-m-arrow)"/>
<path d="M240 370V386" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-messy-middle-m-arrow)"/>
<path d="M240 488V504" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-messy-middle-m-arrow)"/>
<path d="M240 606V622" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ted-messy-middle-m-arrow)"/>
<rect x="28" y="150" width="424" height="100" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="182" fill="#d4e2d4" font-size="20">01</text>
<text x="48" y="215" fill="#fffef9" font-size="28" font-weight="650">認出混亂中段</text>
<text x="48" y="240" fill="#d4e2d4" font-size="19">野心夠大的正常現象</text>
<rect x="28" y="268" width="424" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="300" fill="#586b60" font-size="20">02</text>
<text x="48" y="333" fill="#193732" font-size="28" font-weight="650">成果微光</text>
<text x="48" y="358" fill="#586b60" font-size="19">先做最粗糙的測試</text>
<rect x="28" y="386" width="424" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="418" fill="#586b60" font-size="20">03</text>
<text x="48" y="451" fill="#193732" font-size="28" font-weight="650">團隊微光</text>
<text x="48" y="476" fill="#586b60" font-size="19">人人有旗可舉，做事的人報告</text>
<rect x="28" y="504" width="424" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="536" fill="#586b60" font-size="20">04</text>
<text x="48" y="569" fill="#193732" font-size="28" font-weight="650">自己微光</text>
<text x="48" y="594" fill="#586b60" font-size="19">先聽、搭橋、放手</text>
<rect x="28" y="622" width="424" height="100" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="48" y="654" fill="#586b60" font-size="20">05</text>
<text x="48" y="687" fill="#193732" font-size="28" font-weight="650">慶祝小勝</text>
<text x="48" y="712" fill="#193732" font-size="19">微光變能量，每週再找一輪</text>
<text x="28" y="762" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="786" fill="#586b60" font-size="18">案例數字為影片稱</text>
</svg>
