<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="kim-professor-memo-sorting-title kim-professor-memo-sorting-desc"><title id="kim-professor-memo-sorting-title">不分類的筆記法</title><desc id="kim-professor-memo-sorting-desc">寫就寫 → 一條流 → 每週回讀 → 精華重記；日常不分類，整理交給每週固定時段的回讀。</desc>
<defs><marker id="kim-professor-memo-sorting-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">不分類筆記 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先全部寫進同一本，週末再讀出精華</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-memo-sorting-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-memo-sorting-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kim-professor-memo-sorting-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">寫就寫</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">不建分類、不整理</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">一條流</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">不同內容交錯著放</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">每週回讀</text>
<text x="56" y="510" fill="#586b60" font-size="27">固定時段，只讀不改</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">精華重記</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">用自己的話再寫一次</text>
<text x="36" y="625" fill="#586b60" font-size="23">精華放進固定位置，下週先讀再寫（編輯延伸）</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
