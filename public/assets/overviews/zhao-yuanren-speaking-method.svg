<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="zhao-yuanren-speaking-method-title zhao-yuanren-speaking-method-desc"><title id="zhao-yuanren-speaking-method-title">先聽熟、再開口：趙元任式的英語發音練法</title><desc id="zhao-yuanren-speaking-method-desc">盲聽浸泡 → 肌肉校準 → 聽熟再說 → 整句出場；練完一段音檔就換下一段重來。</desc>
<defs><marker id="zhao-yuanren-speaking-method-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">趙元任式練法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先聽熟、再開口：把英文當聲音練</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">盲聽浸泡</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">不看文本，聽輕重與連音</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">肌肉校準</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">對鏡調整口型與舌位</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">聽熟再說</text>
<text x="56" y="510" fill="#586b60" font-size="27">心中重播，連神氣一起模仿</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">整句出場</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">句子加情境，小場景說出來</text>
<text x="36" y="625" fill="#586b60" font-size="23">練完一段音檔，換下一段重來；每天 20 分鐘，兩週前後錄音比較</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，人物事蹟與成效未另行核實，並非成效證明</text>
</svg>
