<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="white-collar-three-defenses-title white-collar-three-defenses-desc"><title id="white-collar-three-defenses-title">白領工作的六個準備動作</title><desc id="white-collar-three-defenses-desc">斷線底線 → 看清位置 → 自建評測 → 所有權與渠道 → 重定義身分 → 經營關係；每季回頭更新。</desc>
<defs><marker id="white-collar-three-defenses-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">生存指南 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">白領工作的六個準備動作</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="360" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="34" font-weight="650">斷線底線</text>
<text x="56" y="292" fill="#d4e2d4" font-size="24">食物水、現金、驗證</text>
<path d="M398 248H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="420" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="195" fill="#586b60" font-size="23">02</text>
<text x="440" y="245" fill="#193732" font-size="34" font-weight="650">看清位置</text>
<text x="440" y="292" fill="#586b60" font-size="24">標出入門型工作</text>
<path d="M782 248H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="804" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="195" fill="#586b60" font-size="23">03</text>
<text x="824" y="245" fill="#193732" font-size="34" font-weight="650">自建評測</text>
<text x="824" y="292" fill="#586b60" font-size="24">10 至 15 個任務</text>
<rect x="36" y="380" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="415" fill="#586b60" font-size="23">04</text>
<text x="56" y="465" fill="#193732" font-size="34" font-weight="650">所有權與渠道</text>
<text x="56" y="512" fill="#586b60" font-size="24">可帶走的資源</text>
<path d="M398 468H418" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="420" y="380" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="415" fill="#586b60" font-size="23">05</text>
<text x="440" y="465" fill="#193732" font-size="34" font-weight="650">重定義身分</text>
<text x="440" y="512" fill="#586b60" font-size="24">品格而非職稱</text>
<path d="M782 468H802" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<rect x="804" y="380" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="415" fill="#586b60" font-size="23">06</text>
<text x="824" y="465" fill="#193732" font-size="34" font-weight="650">經營關係</text>
<text x="824" y="512" fill="#586b60" font-size="24">人脈與鄰里</text>
<path d="M1128 336V353H216V366" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#white-collar-three-defenses-arrow)"/>
<text x="36" y="600" fill="#586b60" font-size="23">每季回頭更新評測與清單；圖解為編輯整理，並非成效證明</text>
</svg>
