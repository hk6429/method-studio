<rect x="532" y="150" width="232" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="185" fill="#586b60" font-size="20">03</text>
<text x="552" y="228" fill="#193732" font-size="28" font-weight="650">自建評測</text>
