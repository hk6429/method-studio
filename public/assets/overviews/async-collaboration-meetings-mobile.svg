<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="async-collaboration-meetings-title async-collaboration-meetings-desc"><title id="async-collaboration-meetings-title">會前立好問題與答案，會議才短</title><desc id="async-collaboration-meetings-desc">立關鍵問題 → 備答案 → 定一小時 → 換位推演 → 簡報預問 → 以終為始。</desc>
<defs><marker id="async-collaboration-meetings-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">異步協作 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">把會議的功夫搬到會前</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="148" width="424" height="78" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="176" fill="#d4e2d4" font-size="19">01</text>
<text x="48" y="200" fill="#fffef9" font-size="26" font-weight="650">立關鍵問題</text>
<text x="48" y="218" fill="#d4e2d4" font-size="18">2～3 個問句</text>
<path d="M240 226V244" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<rect x="28" y="246" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="274" fill="#586b60" font-size="19">02</text>
<text x="48" y="298" fill="#193732" font-size="26" font-weight="650">備答案</text>
<text x="48" y="316" fill="#586b60" font-size="18">每題 1～2 個</text>
<path d="M240 324V342" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<rect x="28" y="344" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="372" fill="#586b60" font-size="19">03</text>
<text x="48" y="396" fill="#193732" font-size="26" font-weight="650">定一小時</text>
<text x="48" y="414" fill="#586b60" font-size="18">帶答案來交換</text>
<path d="M240 422V440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<rect x="28" y="442" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="470" fill="#586b60" font-size="19">04</text>
<text x="48" y="494" fill="#193732" font-size="26" font-weight="650">換位推演</text>
<text x="48" y="512" fill="#586b60" font-size="18">預想對方反應</text>
<path d="M240 520V538" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<rect x="28" y="540" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="568" fill="#586b60" font-size="19">05</text>
<text x="48" y="592" fill="#193732" font-size="26" font-weight="650">簡報預問</text>
<text x="48" y="610" fill="#586b60" font-size="18">逐頁問會被問什麼</text>
<path d="M240 618V636" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#async-collaboration-meetings-arrow)"/>
<rect x="28" y="638" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="666" fill="#586b60" font-size="19">06</text>
<text x="48" y="690" fill="#193732" font-size="26" font-weight="650">以終為始</text>
<text x="48" y="708" fill="#586b60" font-size="18">先想通過後影響</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
