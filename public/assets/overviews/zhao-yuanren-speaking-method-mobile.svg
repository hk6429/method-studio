<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="zhao-yuanren-speaking-method-m-title zhao-yuanren-speaking-method-m-desc"><title id="zhao-yuanren-speaking-method-m-title">先聽熟、再開口：趙元任式的英語發音練法</title><desc id="zhao-yuanren-speaking-method-m-desc">盲聽浸泡 → 肌肉校準 → 聽熟再說 → 整句出場；練完一段音檔就換下一段重來。</desc>
<defs><marker id="zhao-yuanren-speaking-method-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">趙元任式練法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先聽熟，再開口</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zhao-yuanren-speaking-method-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">盲聽浸泡</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">不看文本，聽輕重與連音</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">肌肉校準</text>
<text x="48" y="402" fill="#586b60" font-size="20">對鏡調整口型與舌位</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">聽熟再說</text>
<text x="48" y="548" fill="#586b60" font-size="20">心中重播，連神氣一起模仿</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">整句出場</text>
<text x="48" y="694" fill="#586b60" font-size="20">句子加情境，小場景說出來</text>
<text x="28" y="775" fill="#586b60" font-size="19">練完一段音檔，換下一段重來</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
