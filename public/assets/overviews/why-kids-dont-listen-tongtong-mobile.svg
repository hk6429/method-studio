<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="why-kids-dont-listen-tongtong-title why-kids-dont-listen-tongtong-desc"><title id="why-kids-dont-listen-tongtong-title">孩子講不聽的處理方法</title><desc id="why-kids-dont-listen-tongtong-desc">還原事件 → 先安心 → 給行為價值 → 規則提醒與找解法；情緒仍高時回到先安心。</desc>
<defs><marker id="why-kids-dont-listen-tongtong-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">專訪 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">孩子講不聽，先懂再教</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="229" fill="#fffef9" font-size="32" font-weight="650">還原事件</text>
<text x="48" y="258" fill="#d4e2d4" font-size="20">問清經過、分類情境</text>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="375" fill="#193732" font-size="32" font-weight="650">先安心</text>
<text x="48" y="404" fill="#586b60" font-size="20">補依附燃料、降情緒</text>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="521" fill="#193732" font-size="32" font-weight="650">給行為價值</text>
<text x="48" y="550" fill="#586b60" font-size="20">肯定進步、比對前後</text>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="667" fill="#193732" font-size="32" font-weight="650">規則＋解法</text>
<text x="48" y="696" fill="#586b60" font-size="20">只談行為，陪找辦法</text>
<text x="28" y="760" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="732" fill="#586b60" font-size="18">情緒仍高時，回到「先安心」</text>
</svg>
