<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="cole-medin-evolve-second-brain-m-title cole-medin-evolve-second-brain-m-desc"><title id="cole-medin-evolve-second-brain-m-title">從個人第二大腦到團隊大腦</title><desc id="cole-medin-evolve-second-brain-m-desc">留下 agent → 一張表 → 貼標籤 → 閘門在資料庫 → MCP 入口 → 混合檢索附來源；個人系統不推翻，只集中知識庫。</desc>
<defs><marker id="cole-medin-evolve-second-brain-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">TEAM BRAIN · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">agent 不動，知識庫集中</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 230V244" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cole-medin-evolve-second-brain-m-arrow)"/>
<path d="M240 328V342" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cole-medin-evolve-second-brain-m-arrow)"/>
<path d="M240 426V440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cole-medin-evolve-second-brain-m-arrow)"/>
<path d="M240 524V538" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cole-medin-evolve-second-brain-m-arrow)"/>
<path d="M240 622V636" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cole-medin-evolve-second-brain-m-arrow)"/>
<rect x="28" y="148" width="424" height="80" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="178" fill="#d4e2d4" font-size="18">01</text>
<text x="92" y="182" fill="#fffef9" font-size="26" font-weight="650">留下 agent</text>
<text x="92" y="212" fill="#d4e2d4" font-size="17">個性、記憶、介面都保留</text>
<rect x="28" y="246" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="276" fill="#586b60" font-size="18">02</text>
<text x="92" y="280" fill="#193732" font-size="26" font-weight="650">一張表</text>
<text x="92" y="310" fill="#586b60" font-size="17">所有來源同一格式</text>
<rect x="28" y="344" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="374" fill="#586b60" font-size="18">03</text>
<text x="92" y="378" fill="#193732" font-size="26" font-weight="650">入庫貼標籤</text>
<text x="92" y="408" fill="#586b60" font-size="17">來源對應群組</text>
<rect x="28" y="442" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="472" fill="#586b60" font-size="18">04</text>
<text x="92" y="476" fill="#193732" font-size="26" font-weight="650">閘門在資料庫</text>
<text x="92" y="506" fill="#586b60" font-size="17">金鑰→群組→列層級過濾</text>
<rect x="28" y="540" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="570" fill="#586b60" font-size="18">05</text>
<text x="92" y="574" fill="#193732" font-size="26" font-weight="650">MCP 入口</text>
<text x="92" y="604" fill="#586b60" font-size="17">五個工具＋個人 token</text>
<rect x="28" y="638" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="668" fill="#586b60" font-size="18">06</text>
<text x="92" y="672" fill="#193732" font-size="26" font-weight="650">混合檢索</text>
<text x="92" y="702" fill="#586b60" font-size="17">關鍵字＋語意，附來源</text>
<text x="28" y="748" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="778" fill="#586b60" font-size="19">權限閘門放資料庫，agent 只多一個工具</text>
