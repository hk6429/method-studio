<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="brain-1000-hours-input-title brain-1000-hours-input-desc"><title id="brain-1000-hours-input-title">1000 小時語言學習法</title><desc id="brain-1000-hours-input-desc">盤點輸入 → 先看再聽 → 四次處理 → 說出來；每月分項記錄，回到盤點。</desc>
<defs><marker id="brain-1000-hours-input-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">brain 學霸影片 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">1000 小時語言學習法</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-1000-hours-input-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-1000-hours-input-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-1000-hours-input-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">盤點輸入</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">一週接觸英語的時間</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">先看再聽</text>
<text x="48" y="402" fill="#586b60" font-size="20">讀文本，切出沒聽到的字</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">四次處理</text>
<text x="48" y="548" fill="#586b60" font-size="20">大意、漏詞、句型、複述</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">說出來</text>
<text x="48" y="694" fill="#586b60" font-size="20">蓋住文字，換成自己場景</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">每月分項記錄，再回到盤點補弱項</text>
</svg>