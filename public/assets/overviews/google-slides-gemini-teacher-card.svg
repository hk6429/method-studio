<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="google-slides-gemini-teacher-title google-slides-gemini-teacher-desc"><title id="google-slides-gemini-teacher-title">Google 簡報加 Gemini 的備課流程</title><desc id="google-slides-gemini-teacher-desc">定範圍 → 確認 Gemini → 做講義 → 帶入討論 → 修圖 → 檢查分享；先自己掌握內容，再讓 AI 協作。</desc>
<defs><marker id="google-slides-gemini-teacher-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="32" y="46" fill="#586b60" font-size="20">GEMINI IN SLIDES · 編輯整理</text>
<text x="32" y="100" fill="#193732" font-size="40" font-weight="650">Google 簡報加 Gemini</text>
<path d="M32 124H768" stroke="#bdcbbb"/>
<rect x="32" y="150" width="236" height="104" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="180" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="222" fill="#fffef9" font-size="30" font-weight="650">定範圍</text>
<rect x="282" y="150" width="236" height="104" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="298" y="180" fill="#586b60" font-size="18">02</text>
<text x="298" y="222" fill="#193732" font-size="30" font-weight="650">確認 Gemini</text>
<rect x="532" y="150" width="236" height="104" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="548" y="180" fill="#586b60" font-size="18">03</text>
<text x="548" y="222" fill="#193732" font-size="30" font-weight="650">做講義</text>
<rect x="32" y="270" width="236" height="104" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="300" fill="#d4e2d4" font-size="18">04</text>
<text x="48" y="342" fill="#fffef9" font-size="30" font-weight="650">帶入討論</text>
<rect x="282" y="270" width="236" height="104" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="298" y="300" fill="#586b60" font-size="18">05</text>
<text x="298" y="342" fill="#193732" font-size="30" font-weight="650">修圖</text>
<rect x="532" y="270" width="236" height="104" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="548" y="300" fill="#586b60" font-size="18">06</text>
<text x="548" y="342" fill="#193732" font-size="30" font-weight="650">檢查分享</text>
<text x="32" y="420" fill="#586b60" font-size="22">先自己掌握內容，再讓 AI 協作</text>
<text x="32" y="452" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
