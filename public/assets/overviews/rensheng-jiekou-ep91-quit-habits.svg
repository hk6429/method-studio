<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="rensheng-jiekou-ep91-quit-habits-title rensheng-jiekou-ep91-quit-habits-desc"><title id="rensheng-jiekou-ep91-quit-habits-title">戒掉一個癮的改變法</title><desc id="rensheng-jiekou-ep91-quit-habits-desc">問痛苦 → 陪感覺 → 誠實辨認 → 定身份 → 換環境 → 記體感；觸發又來就回到陪感覺。</desc>
<defs><marker id="rensheng-jiekou-ep91-quit-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">人生解扣方程式 EP91 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">戒掉一個癮之前，先問「我在痛苦什麼」</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M392 246H420" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M780 246H808" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M986 332V352H214V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M392 462H420" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<path d="M780 462H808" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#rensheng-jiekou-ep91-quit-habits-arrow)"/>
<rect x="36" y="160" width="356" height="172" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">問痛苦</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">我是因為什麼在痛苦？</text>
<rect x="424" y="160" width="356" height="172" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="38" font-weight="650">陪感覺</text>
<text x="444" y="292" fill="#586b60" font-size="25">衝動來時先停 3 分鐘</text>
<rect x="812" y="160" width="352" height="172" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="38" font-weight="650">誠實辨認</text>
<text x="832" y="292" fill="#586b60" font-size="25">不醜化，也不美化</text>
<rect x="36" y="378" width="356" height="172" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">定身份</text>
<text x="56" y="510" fill="#586b60" font-size="25">我想當什麼樣的人</text>
<rect x="424" y="378" width="356" height="172" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#586b60" font-size="23">05</text>
<text x="444" y="463" fill="#193732" font-size="38" font-weight="650">換環境</text>
<text x="444" y="510" fill="#586b60" font-size="25">減少觸發，進新圈子</text>
<rect x="812" y="378" width="352" height="172" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="413" fill="#586b60" font-size="23">06</text>
<text x="832" y="463" fill="#193732" font-size="38" font-weight="650">記體感</text>
<text x="832" y="510" fill="#586b60" font-size="25">一天多一天的自我效能</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">觸發又來 → 回到陪感覺；體驗變好 → 身份更穩</text>
</svg>
