<text x="36" y="48" fill="#586b60" font-size="26">停頓地圖 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">別只聽單字，聽停頓</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="156" width="226" height="108" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="188" fill="#d4e2d4" font-size="21">01</text>
<text x="56" y="234" fill="#fffef9" font-size="30" font-weight="650">換聽的對象</text>
<rect x="287" y="156" width="226" height="108" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="307" y="188" fill="#586b60" font-size="21">02</text>
<text x="307" y="234" fill="#193732" font-size="30" font-weight="650">第一遍畫地圖</text>
<rect x="538" y="156" width="226" height="108" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="558" y="188" fill="#586b60" font-size="21">03</text>
<text x="558" y="234" fill="#193732" font-size="30" font-weight="650">第二遍核對</text>
