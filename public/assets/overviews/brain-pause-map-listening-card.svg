<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="brain-pause-map-listening-title brain-pause-map-listening-desc"><title id="brain-pause-map-listening-title">別只聽單字，聽停頓：30 秒三遍停頓地圖</title><desc id="brain-pause-map-listening-desc">換聽的對象 → 第一遍畫停頓地圖 → 第二遍核對意思邊界 → 第三遍連停頓一起跟讀 → 口說切塊 → 單字三問。</desc>
<defs><marker id="brain-pause-map-listening-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
