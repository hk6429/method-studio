<text x="48" y="292" fill="#586b60" font-size="21">02</text>
<text x="48" y="320" fill="#193732" font-size="30" font-weight="650">知自己</text>
<text x="48" y="338" fill="#586b60" font-size="20">喜歡與在乎</text>
<path d="M240 354V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#die-with-zero-art-of-spending-m-arrow)"/>
<rect x="28" y="378" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
