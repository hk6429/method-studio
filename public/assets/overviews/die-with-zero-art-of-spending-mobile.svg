<text x="48" y="552" fill="#193732" font-size="30" font-weight="650">買選擇權</text>
<text x="48" y="570" fill="#586b60" font-size="20">儲蓄換自由</text>
<path d="M240 586V608" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#die-with-zero-art-of-spending-m-arrow)"/>
