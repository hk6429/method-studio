<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="die-with-zero-art-of-spending-m-title die-with-zero-art-of-spending-m-desc"><title id="die-with-zero-art-of-spending-m-title">花錢前先問動機</title><desc id="die-with-zero-art-of-spending-m-desc">辨動機、知自己、拉間隔、買選擇權、查自主五個花錢檢查點。</desc>
