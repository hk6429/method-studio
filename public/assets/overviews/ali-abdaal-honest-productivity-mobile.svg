<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="ali-abdaal-honest-productivity-title ali-abdaal-honest-productivity-desc"><title id="ali-abdaal-honest-productivity-title">拖延不是時間問題</title><desc id="ali-abdaal-honest-productivity-desc">診斷拖延、釐清方向、定 90 天季節、排進週曆、誠實檢查、找人問責與重新開始。</desc>
<defs><marker id="ali-abdaal-honest-productivity-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="24" y="48" fill="#586b60" font-size="18">ALI ABDAAL · 編輯整理</text>
<text x="24" y="92" fill="#193732" font-size="30" font-weight="650">先診斷，再做更少但更好</text>
<path d="M24 112H456" stroke="#bdcbbb"/>
<rect x="24" y="132" width="432" height="84" rx="8" fill="#193732" stroke="#bdcbbb"/>
<text x="44" y="166" fill="#d4e2d4" font-size="18">01</text>
<text x="90" y="170" fill="#fffef9" font-size="28" font-weight="650">診斷拖延</text>
<text x="90" y="200" fill="#d4e2d4" font-size="18">不清楚・害怕・慣性</text>
<path d="M240 216V237" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="24" y="237" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="271" fill="#586b60" font-size="18">02</text>
<text x="90" y="275" fill="#193732" font-size="28" font-weight="650">問自己方向</text>
<text x="90" y="305" fill="#586b60" font-size="18">日誌提示</text>
<path d="M240 321V342" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="24" y="342" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="376" fill="#586b60" font-size="18">03</text>
<text x="90" y="380" fill="#193732" font-size="28" font-weight="650">90 天季節</text>
<text x="90" y="410" fill="#586b60" font-size="18">一主線＋支線</text>
<path d="M240 426V447" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="24" y="447" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="481" fill="#586b60" font-size="18">04</text>
<text x="90" y="485" fill="#193732" font-size="28" font-weight="650">排進週曆</text>
<text x="90" y="515" fill="#586b60" font-size="18">何時何地做</text>
<path d="M240 531V552" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="24" y="552" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="586" fill="#586b60" font-size="18">05</text>
<text x="90" y="590" fill="#193732" font-size="28" font-weight="650">誠實檢查</text>
<text x="90" y="620" fill="#586b60" font-size="18">被跳過就重判</text>
<path d="M240 636V657" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="24" y="657" width="432" height="84" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="691" fill="#586b60" font-size="18">06</text>
<text x="90" y="695" fill="#193732" font-size="28" font-weight="650">問責與重啟</text>
<text x="90" y="725" fill="#586b60" font-size="18">每週回報</text>
<text x="24" y="780" fill="#586b60" font-size="18">做不到 → 回診斷，或今天重新開始</text>
</svg>
