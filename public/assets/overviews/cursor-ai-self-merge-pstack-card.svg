<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">敢讓 AI 自己 merge 的六個動作</title><desc id="desc">定標準 → 做驗證 → 換人審 → 錯誤變工具 → 小任務起步 → 過夜加抽樣；抽到問題就回頭改流程。</desc>
<defs><marker id="cursor-ai-self-merge-pstack-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">PSTACK · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">先驗證，再放手</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="150" width="228" height="120" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="52" y="180" fill="#d4e2d4" font-size="20">01</text>
<text x="52" y="220" fill="#fffef9" font-size="30" font-weight="650">定標準</text>
<text x="52" y="250" fill="#d4e2d4" font-size="17">要什麼＋怎樣算完成</text>
<rect x="286" y="150" width="228" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="302" y="180" fill="#586b60" font-size="20">02</text>
<text x="302" y="220" fill="#193732" font-size="30" font-weight="650">做驗證</text>
<text x="302" y="250" fill="#586b60" font-size="17">啟動、操作、留證據</text>
<rect x="536" y="150" width="228" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="180" fill="#586b60" font-size="20">03</text>
<text x="552" y="220" fill="#193732" font-size="30" font-weight="650">換人審</text>
<text x="552" y="250" fill="#586b60" font-size="17">寫的人不判過關</text>
<rect x="36" y="292" width="228" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="52" y="322" fill="#586b60" font-size="20">04</text>
<text x="52" y="362" fill="#193732" font-size="30" font-weight="650">錯誤變工具</text>
<text x="52" y="392" fill="#586b60" font-size="17">架構、lint、測試</text>
<rect x="286" y="292" width="228" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="302" y="322" fill="#586b60" font-size="20">05</text>
<text x="302" y="362" fill="#193732" font-size="30" font-weight="650">小任務起步</text>
<text x="302" y="392" fill="#586b60" font-size="17">一次一兩個</text>
<rect x="536" y="292" width="228" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="322" fill="#586b60" font-size="20">06</text>
<text x="552" y="362" fill="#193732" font-size="30" font-weight="650">過夜＋抽樣</text>
<text x="552" y="392" fill="#586b60" font-size="17">決策記錄、出口</text>
<text x="36" y="455" fill="#586b60" font-size="23">抽到問題 → 回頭改流程與 lint</text>
</svg>
