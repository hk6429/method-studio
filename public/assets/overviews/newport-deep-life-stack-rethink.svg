<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="newport-deep-life-stack-rethink-title newport-deep-life-stack-rethink-desc"><title id="newport-deep-life-stack-rethink-title">深度人生地圖・編輯整理</title><desc id="newport-deep-life-stack-rethink-desc">看缺口 → 畫三塊領域 → 找缺哪塊 → 在地圖上來回走 → 少而依序 → 寫一頁地圖。</desc>
<defs><marker id="newport-deep-life-stack-rethink-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Cal Newport · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">不再堆疊，改畫一張深度人生地圖</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M388 248H439" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<path d="M388 466H439" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<path d="M792 248H843" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<path d="M792 466H843" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<path d="M1020 336V357H212V377" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">看缺口</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">別等一個大改變</text>
<rect x="440" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="195" fill="#586b60" font-size="23">02</text>
<text x="460" y="245" fill="#193732" font-size="38" font-weight="650">畫三塊</text>
<text x="460" y="292" fill="#586b60" font-size="25">能力・價值觀・願景</text>
<rect x="844" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="864" y="195" fill="#586b60" font-size="23">03</text>
<text x="864" y="245" fill="#193732" font-size="38" font-weight="650">找缺哪塊</text>
<text x="864" y="292" fill="#586b60" font-size="25">對照三個症狀</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">來回走</text>
<text x="56" y="510" fill="#586b60" font-size="25">不必照順序</text>
<rect x="440" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="413" fill="#586b60" font-size="23">05</text>
<text x="460" y="463" fill="#193732" font-size="38" font-weight="650">少而依序</text>
<text x="460" y="510" fill="#586b60" font-size="25">先深耕一件事</text>
<rect x="844" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="864" y="413" fill="#586b60" font-size="23">06</text>
<text x="864" y="463" fill="#193732" font-size="38" font-weight="650">一頁地圖</text>
<text x="864" y="510" fill="#586b60" font-size="25">這一季的走法</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；做法為節目講者的說法</text>
<text x="36" y="625" fill="#586b60" font-size="23">走偏了就回到上一塊補一補，再回來</text>
</svg>
