<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="huang-body-boundary-talk-title huang-body-boundary-talk-desc"><title id="huang-body-boundary-talk-title">先共情，再教身體界線</title><desc id="huang-body-boundary-talk-desc">接住開心 → 覺察停損點 → 穩住反應 → 借物練習 → 信任圈。</desc>
<defs><marker id="huang-body-boundary-talk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">身體界線 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先共情，再教身體界線</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="200" width="204" height="260" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="54" y="240" fill="#d4e2d4" font-size="23">01</text>
<text x="54" y="310" fill="#fffef9" font-size="32" font-weight="650">接住開心</text>
<text x="54" y="360" fill="#d4e2d4" font-size="20">先問經過與感受</text>
<path d="M242 330H262" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huang-body-boundary-talk-arrow)"/>
<rect x="264" y="200" width="204" height="260" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="282" y="240" fill="#586b60" font-size="23">02</text>
<text x="282" y="310" fill="#193732" font-size="32" font-weight="650">覺察停損點</text>
<text x="282" y="360" fill="#586b60" font-size="20">畫出不舒服的地方</text>
<path d="M470 330H490" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huang-body-boundary-talk-arrow)"/>
<rect x="492" y="200" width="204" height="260" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="510" y="240" fill="#586b60" font-size="23">03</text>
<text x="510" y="310" fill="#193732" font-size="32" font-weight="650">穩住反應</text>
<text x="510" y="360" fill="#586b60" font-size="20">不暴怒，孩子才敢說</text>
<path d="M698 330H718" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huang-body-boundary-talk-arrow)"/>
<rect x="720" y="200" width="204" height="260" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="738" y="240" fill="#586b60" font-size="23">04</text>
<text x="738" y="310" fill="#193732" font-size="32" font-weight="650">借物練習</text>
<text x="738" y="360" fill="#586b60" font-size="20">可借、不借的界線</text>
<path d="M926 330H946" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#huang-body-boundary-talk-arrow)"/>
<rect x="948" y="200" width="204" height="260" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="966" y="240" fill="#586b60" font-size="23">05</text>
<text x="966" y="310" fill="#193732" font-size="32" font-weight="650">建立信任圈</text>
<text x="966" y="360" fill="#586b60" font-size="20">排好求助對象</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">先共情，孩子才願意說；平時就排好求助對象</text>
</svg>
