<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="huang-body-boundary-talk-title huang-body-boundary-talk-desc"><title id="huang-body-boundary-talk-title">先共情，再教身體界線</title><desc id="huang-body-boundary-talk-desc">接住開心 → 覺察停損點 → 穩住反應 → 借物練習 → 信任圈。</desc>
<defs><marker id="huang-body-boundary-talk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">身體界線 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">先共情，再教界線</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="170" width="132" height="200" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="205" fill="#d4e2d4" font-size="20">01</text>
<text x="48" y="270" fill="#fffef9" font-size="24" font-weight="650">接住開心</text>
<rect x="184" y="170" width="132" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="196" y="205" fill="#586b60" font-size="20">02</text>
<text x="196" y="270" fill="#193732" font-size="24" font-weight="650">覺察停損點</text>
<rect x="332" y="170" width="132" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="344" y="205" fill="#586b60" font-size="20">03</text>
<text x="344" y="270" fill="#193732" font-size="24" font-weight="650">穩住反應</text>
<rect x="480" y="170" width="132" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="492" y="205" fill="#586b60" font-size="20">04</text>
<text x="492" y="270" fill="#193732" font-size="24" font-weight="650">借物練習</text>
<rect x="628" y="170" width="132" height="200" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="640" y="205" fill="#586b60" font-size="20">05</text>
<text x="640" y="270" fill="#193732" font-size="24" font-weight="650">建立信任圈</text>
<text x="36" y="430" fill="#586b60" font-size="22">先接住，孩子才願意說</text>
</svg>
