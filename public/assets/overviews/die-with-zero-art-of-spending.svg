<path d="M388 465H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#die-with-zero-art-of-spending-arrow)"/>
<rect x="36" y="160" width="352" height="170" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">辨動機</text>
<text x="56" y="285" fill="#d4e2d4" font-size="27">滋養或給人看</text>
<rect x="424" y="160" width="352" height="170" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="38" font-weight="650">知自己</text>
<text x="444" y="285" fill="#586b60" font-size="27">喜歡與在乎</text>
<rect x="812" y="160" width="352" height="170" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="38" font-weight="650">拉間隔</text>
<text x="832" y="285" fill="#586b60" font-size="27">保留期待感</text>
<rect x="36" y="380" width="352" height="170" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="415" fill="#586b60" font-size="23">04</text>
<text x="56" y="465" fill="#193732" font-size="38" font-weight="650">買選擇權</text>
<text x="56" y="505" fill="#586b60" font-size="27">儲蓄換自由</text>
<rect x="424" y="380" width="352" height="170" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="415" fill="#586b60" font-size="23">05</text>
<text x="444" y="465" fill="#193732" font-size="38" font-weight="650">查自主</text>
<text x="444" y="505" fill="#586b60" font-size="27">自主加目的</text>
<text x="36" y="625" fill="#586b60" font-size="23">每次大額消費或每月回顧，都從辨動機重來</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
