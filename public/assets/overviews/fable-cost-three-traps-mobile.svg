<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="fable-cost-three-traps-title fable-cost-three-traps-desc"><title id="fable-cost-three-traps-title">新模型省錢，靠守住快取</title><desc id="fable-cost-three-traps-desc">看懂價目 → 守住快取 → 降推理等級 → 審計架構 → 自建測試；驗證失敗才升 Max。</desc>
