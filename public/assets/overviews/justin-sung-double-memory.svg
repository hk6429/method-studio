<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="justin-sung-double-memory-title justin-sung-double-memory-desc"><title id="justin-sung-double-memory-title">困惑變問題：直播版三個簡單方法</title><desc id="justin-sung-double-memory-desc">讀前先猜 → 只讀懂得的 → 困惑變問題 → 回頭下一輪；混亂時改寫成問句，再回到只讀懂得的。</desc>
<defs><marker id="justin-sung-double-memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Justin Sung 直播 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">讀前先猜、只讀懂得的、困惑變問題</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-double-memory-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-double-memory-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-double-memory-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">讀前先猜</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">掃標題寫下猜測，讀完對答案</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">只讀懂得的</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">太難的標記跳過，不硬啃</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">困惑變問題</text>
<text x="56" y="510" fill="#586b60" font-size="27">混亂時改寫成一句問句，只找它的答案</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">回頭下一輪</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">只補上輪跳過的段落，兩三輪即可</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；影片數字為講者所稱</text>
<text x="36" y="625" fill="#586b60" font-size="23">每週檢查哪一步撐不住，只改那一步，不整套丟掉</text>
</svg>
