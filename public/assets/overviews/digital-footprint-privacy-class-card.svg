<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="digital-footprint-privacy-class-title digital-footprint-privacy-class-desc">
<title id="digital-footprint-privacy-class-title">數位足跡不裸奔：六步</title>
<desc id="digital-footprint-privacy-class-desc">防護罩 → 用詞警覺 → 三個比較問題 → 陪長輩查證 → 三來源比對 → 讀前中後。編輯整理，非成效證明。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="32" y="48" font-size="22" fill="#586b60">方法練習室 · 編輯整理</text>
<text x="32" y="105" font-size="34" font-weight="650" fill="#193732">數位足跡不裸奔：六步</text>
<path d="M32 132H768" stroke="#bdcbbb"/>
<rect x="32" y="160" width="236" height="124" rx="8" fill="#193732" stroke="#bdcbbb"/>
<text x="52" y="194" font-size="22" fill="#d4e2d4">01</text>
<text x="52" y="240" font-size="26" font-weight="650" fill="#fffef9">防護罩</text>
<rect x="282" y="160" width="236" height="124" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="302" y="194" font-size="22" fill="#586b60">02</text>
<text x="302" y="240" font-size="26" font-weight="650" fill="#193732">用詞警覺</text>
<rect x="532" y="160" width="236" height="124" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="194" font-size="22" fill="#586b60">03</text>
<text x="552" y="240" font-size="26" font-weight="650" fill="#193732">三個比較</text>
<rect x="32" y="300" width="236" height="124" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="52" y="334" font-size="22" fill="#586b60">04</text>
<text x="52" y="380" font-size="26" font-weight="650" fill="#193732">陪長輩查證</text>
<rect x="282" y="300" width="236" height="124" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="302" y="334" font-size="22" fill="#586b60">05</text>
<text x="302" y="380" font-size="26" font-weight="650" fill="#193732">三來源比對</text>
<rect x="532" y="300" width="236" height="124" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="552" y="334" font-size="22" fill="#586b60">06</text>
<text x="552" y="380" font-size="26" font-weight="650" fill="#193732">讀前中後</text>
<text x="32" y="452" font-size="22" fill="#586b60">依文章步驟試做，留下可回看的成果</text>
</svg>
