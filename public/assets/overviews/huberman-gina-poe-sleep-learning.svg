<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="huberman-gina-poe-sleep-learning-title huberman-gina-poe-sleep-learning-desc"><title id="huberman-gina-poe-sleep-learning-title">學完好好睡：五個睡眠習慣</title><desc id="huberman-gina-poe-sleep-learning-desc">學完保住前段睡眠、固定就寢起床、睡前降溫、讓週期跑完再起床、晚睡時守住前三分之一夜，最後用一週試行表調整。</desc><defs><marker id="huberman-gina-poe-sleep-learning-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style><rect width="1200" height="650" fill="#f0f2e9"/><text x="48" y="64" fill="#586b60" font-size="26">Huberman Lab × Gina Poe · 編輯整理</text><text x="48" y="118" fill="#193732" font-size="44" font-weight="650">學完好好睡，讓大腦存檔</text><path d="M48 146H1152" stroke="#bdcbbb"/><rect x="48" y="180" width="344" height="160" rx="8" fill="#193732" stroke="#bdcbbb"/><text x="70" y="220" fill="#d4e2d4" font-size="24">01</text><text x="70" y="270" fill="#fffef9" font-size="32" font-weight="650">學完留前段睡</text><text x="70" y="310" fill="#d4e2d4" font-size="22">睡前回看，準時上床</text><path d="M392 260H424" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-arrow)"/><rect x="424" y="180" width="344" height="160" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="446" y="220" fill="#586b60" font-size="24">02</text><text x="446" y="270" fill="#193732" font-size="32" font-weight="650">固定就寢起床</text><text x="446" y="310" fill="#586b60" font-size="22">別讓首段深睡落空</text><path d="M768 260H800" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-arrow)"/><rect x="800" y="180" width="344" height="160" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="822" y="220" fill="#586b60" font-size="24">03</text><text x="822" y="270" fill="#193732" font-size="32" font-weight="650">睡前降溫</text><text x="822" y="310" fill="#586b60" font-size="22">避開酒精與刺激</text><rect x="48" y="380" width="344" height="160" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="70" y="420" fill="#586b60" font-size="24">04</text><text x="70" y="470" fill="#193732" font-size="32" font-weight="650">讓週期跑完</text><text x="70" y="510" fill="#586b60" font-size="22">約 90 分鐘一輪</text><path d="M392 460H424" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-arrow)"/><rect x="424" y="380" width="344" height="160" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="446" y="420" fill="#586b60" font-size="24">05</text><text x="446" y="470" fill="#193732" font-size="32" font-weight="650">晚睡守前三分之一</text><text x="446" y="510" fill="#586b60" font-size="22">隔晚回到原作息</text><path d="M768 460H800" stroke="#586b60" stroke-width="2.5" fill="none" marker-end="url(#huberman-gina-poe-sleep-learning-arrow)"/><rect x="800" y="380" width="344" height="160" rx="8" fill="#fffef9" stroke="#bdcbbb"/><text x="822" y="420" fill="#586b60" font-size="24">06</text><text x="822" y="470" fill="#193732" font-size="32" font-weight="650">一週試行表</text><text x="822" y="510" fill="#586b60" font-size="22">留下自己的版本</text><text x="48" y="610" fill="#586b60" font-size="22">科普說法，非醫療建議；有睡眠問題請諮詢醫師</text></svg>