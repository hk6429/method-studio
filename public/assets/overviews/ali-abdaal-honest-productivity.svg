<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ali-abdaal-honest-productivity-title ali-abdaal-honest-productivity-desc"><title id="ali-abdaal-honest-productivity-title">拖延不是時間問題</title><desc id="ali-abdaal-honest-productivity-desc">診斷拖延、釐清方向、定 90 天季節、排進週曆、誠實檢查、找人問責與重新開始。</desc>
<defs><marker id="ali-abdaal-honest-productivity-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="48" y="64" fill="#586b60" font-size="26">ALI ABDAAL · 編輯整理</text>
<text x="48" y="118" fill="#193732" font-size="44" font-weight="650">先診斷，再做更少但更好</text>
<path d="M48 144H1152" stroke="#bdcbbb"/>
<rect x="48" y="180" width="352" height="170" rx="8" fill="#193732" stroke="#bdcbbb"/>
<text x="72" y="222" fill="#d4e2d4" font-size="24">01</text>
<text x="72" y="280" fill="#fffef9" font-size="40" font-weight="650">診斷拖延</text>
<text x="72" y="320" fill="#d4e2d4" font-size="24">不清楚・害怕・慣性</text>
<path d="M400 265H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="424" y="180" width="352" height="170" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="222" fill="#586b60" font-size="24">02</text>
<text x="448" y="280" fill="#193732" font-size="40" font-weight="650">問自己方向</text>
<text x="448" y="320" fill="#586b60" font-size="24">日誌提示</text>
<path d="M776 265H800" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="800" y="180" width="352" height="170" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="222" fill="#586b60" font-size="24">03</text>
<text x="824" y="280" fill="#193732" font-size="40" font-weight="650">90 天季節</text>
<text x="824" y="320" fill="#586b60" font-size="24">一主線＋支線</text>
<rect x="48" y="390" width="352" height="170" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="72" y="432" fill="#586b60" font-size="24">04</text>
<text x="72" y="490" fill="#193732" font-size="40" font-weight="650">排進週曆</text>
<text x="72" y="530" fill="#586b60" font-size="24">何時何地做</text>
<path d="M400 475H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="424" y="390" width="352" height="170" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="432" fill="#586b60" font-size="24">05</text>
<text x="448" y="490" fill="#193732" font-size="40" font-weight="650">誠實檢查</text>
<text x="448" y="530" fill="#586b60" font-size="24">被跳過就重判</text>
<path d="M776 475H800" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ali-abdaal-honest-productivity-arrow)"/>
<rect x="800" y="390" width="352" height="170" rx="8" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="432" fill="#586b60" font-size="24">06</text>
<text x="824" y="490" fill="#193732" font-size="40" font-weight="650">問責與重啟</text>
<text x="824" y="530" fill="#586b60" font-size="24">每週回報</text>
<text x="48" y="620" fill="#586b60" font-size="24">做不到 → 回到診斷，或承認它不是優先 → 今天重新開始</text>
</svg>
