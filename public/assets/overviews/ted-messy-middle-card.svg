<rect x="36" y="276" width="226" height="100" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="308" fill="#586b60" font-size="23">02</text>
<text x="56" y="352" fill="#193732" font-size="34" font-weight="650">成果微光</text>
