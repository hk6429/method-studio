<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">認清路徑</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">熱愛、人格，或理性算過</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">算清代價</text>
<text x="656" y="292" fill="#586b60" font-size="27">短期好處 vs 長期要還幾倍</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">兩個演算法</text>
<text x="56" y="510" fill="#586b60" font-size="27">目標放大十倍、五年後回看</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">檢查假設</text>
<text x="656" y="510" fill="#586b60" font-size="27">不會發現、不會跑、只有這次</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">算完寫成一條自己的原則，下次猶豫時再算一次</text>
