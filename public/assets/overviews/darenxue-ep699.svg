<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="darenxue-ep699-title darenxue-ep699-desc"><title id="darenxue-ep699-title">不靠熱情的長期主義：把投機的帳算清楚</title><desc id="darenxue-ep699-desc">認清路徑 → 算清代價 → 放大十倍、五年後回看 → 檢查三個假設；最後寫成一條原則，下次猶豫再算一次。</desc>
