<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="king-kong-dad-strength-after-70-title king-kong-dad-strength-after-70-desc"><title id="king-kong-dad-strength-after-70-title">70 歲後也能練的肌力方法</title><desc id="king-kong-dad-strength-after-70-desc">拆迷思 → 自我檢查 → 下肢 → 核心 → 握力 → 每週三次。</desc>
<defs><marker id="king-kong-dad-strength-after-70-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="820" fill="#f0f2e9"/>
<text x="24" y="40" fill="#586b60" font-size="20">金剛老爹專訪 · 編輯整理</text>
<text x="24" y="84" fill="#193732" font-size="32" font-weight="650">從客廳開始，補回肌力</text>
<path d="M24 104H456" stroke="#bdcbbb"/>
<rect x="24" y="124" width="432" height="86" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="44" y="158" fill="#d4e2d4" font-size="18">01</text>
<text x="84" y="162" fill="#fffef9" font-size="30" font-weight="650">拆迷思</text>
<text x="84" y="194" fill="#d4e2d4" font-size="21">走路不等於肌力</text>
<path d="M240 212V226" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="24" y="228" width="432" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="262" fill="#586b60" font-size="18">02</text>
<text x="84" y="266" fill="#193732" font-size="30" font-weight="650">自我檢查</text>
<text x="84" y="298" fill="#586b60" font-size="21">找出最弱一區</text>
<path d="M240 316V330" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="24" y="332" width="432" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="366" fill="#586b60" font-size="18">03</text>
<text x="84" y="370" fill="#193732" font-size="30" font-weight="650">下肢</text>
<text x="84" y="402" fill="#586b60" font-size="21">抬腿・坐站・靜蹲</text>
<path d="M240 420V434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="24" y="436" width="432" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="470" fill="#586b60" font-size="18">04</text>
<text x="84" y="474" fill="#193732" font-size="30" font-weight="650">核心</text>
<text x="84" y="506" fill="#586b60" font-size="21">棒式計時</text>
<path d="M240 524V538" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="24" y="540" width="432" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="574" fill="#586b60" font-size="18">05</text>
<text x="84" y="578" fill="#193732" font-size="30" font-weight="650">握力</text>
<text x="84" y="610" fill="#586b60" font-size="21">吊・提・擰・橡皮筋</text>
<path d="M240 628V642" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#king-kong-dad-strength-after-70-arrow)"/>
<rect x="24" y="644" width="432" height="86" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="44" y="678" fill="#586b60" font-size="18">06</text>
<text x="84" y="682" fill="#193732" font-size="30" font-weight="650">一週三次</text>
<text x="84" y="714" fill="#586b60" font-size="21">10–12 次 × 3 組</text>
<text x="24" y="786" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
