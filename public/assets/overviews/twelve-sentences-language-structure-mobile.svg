<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="twelve-sentences-language-structure-title twelve-sentences-language-structure-desc"><title id="twelve-sentences-language-structure-title">十二句法：看骨架、換零件</title><desc id="twelve-sentences-language-structure-desc">寫十二句 → 語序與代名詞 → 疑問否定未來 → 換零件 → AI 字對字 → 每天三句；卡住就回到骨架。</desc>
<defs><marker id="twelve-sentences-language-structure-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">Tim Ferriss 十二句法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先看骨架，再換零件</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="80" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="180" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="210" fill="#fffef9" font-size="28" font-weight="650">寫十二句</text>
<text x="452" y="210" text-anchor="end" fill="#d4e2d4" font-size="18" dx="-16">當作假人，不背</text>
<path d="M240 226V242" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="28" y="246" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="280" fill="#586b60" font-size="21">02</text>
<text x="48" y="310" fill="#193732" font-size="28" font-weight="650">語序與代名詞</text>
<text x="452" y="310" text-anchor="end" fill="#586b60" font-size="18" dx="-16">誰做動作、給誰</text>
<path d="M240 326V342" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="28" y="346" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="380" fill="#586b60" font-size="21">03</text>
<text x="48" y="410" fill="#193732" font-size="28" font-weight="650">疑問否定未來</text>
<text x="452" y="410" text-anchor="end" fill="#586b60" font-size="18" dx="-16">規則寫在句子下</text>
<path d="M240 426V442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="28" y="446" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="480" fill="#586b60" font-size="21">04</text>
<text x="48" y="510" fill="#193732" font-size="28" font-weight="650">換零件</text>
<text x="452" y="510" text-anchor="end" fill="#586b60" font-size="18" dx="-16">骨架不動</text>
<path d="M240 526V542" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="28" y="546" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="580" fill="#586b60" font-size="21">05</text>
<text x="48" y="610" fill="#193732" font-size="28" font-weight="650">AI 字對字</text>
<text x="452" y="610" text-anchor="end" fill="#586b60" font-size="18" dx="-16">只拆解，不開口用</text>
<path d="M240 626V642" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="28" y="646" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="680" fill="#586b60" font-size="21">06</text>
<text x="48" y="710" fill="#193732" font-size="28" font-weight="650">每天三句</text>
<text x="452" y="710" text-anchor="end" fill="#586b60" font-size="18" dx="-16">改句、朗讀二十遍</text>
<text x="28" y="765" fill="#586b60" font-size="19">卡住就回到骨架，再換一次零件</text>
<text x="28" y="790" fill="#586b60" font-size="17">圖解為編輯整理，並非成效證明</text>
</svg>
