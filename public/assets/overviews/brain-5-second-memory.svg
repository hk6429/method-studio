<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="brain-5-second-memory-title brain-5-second-memory-desc"><title id="brain-5-second-memory-title">5 秒記憶法：先答再看，用遞增間隔練到說出口</title><desc id="brain-5-second-memory-desc">挑十句 → 先答再看 → 遞增間隔 → 換場景改卡；間隔為 5 秒、25 秒、2 分、10 分。</desc>
<defs><marker id="brain-5-second-memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">5 秒記憶法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先答再看，把學過的英語練到說出口</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#brain-5-second-memory-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">挑十句</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">48 小時內真的會用到的話</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">先答再看</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">看情境開口，卡住才掀答案</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">遞增間隔</text>
<text x="56" y="510" fill="#586b60" font-size="27">5 秒→25 秒→2 分→10 分再答</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">換場景改卡</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">AI 出情境、同句搬三處、正面寫情境</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">認得、想得出、即時說出是三層；跟讀只練到第一層</text>
</svg>
