<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="claude-usage-five-tricks-title claude-usage-five-tricks-desc"><title id="claude-usage-five-tricks-title">Claude 用量五招</title><desc id="claude-usage-five-tricks-desc">換題開新對話 → 相關問題一次問完 → 選對模型與強度 → 關掉用不到的工具 → 快取與交接摘要；目標是讓 Claude 少重讀。</desc>
<defs><marker id="claude-usage-five-tricks-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">CLAUDE 用量 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">五招，讓 Claude 少重讀</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="360" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">換題開新</text>
<text x="56" y="292" fill="#d4e2d4" font-size="22">題目換了就新對話</text>
<rect x="438" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="195" fill="#586b60" font-size="23">02</text>
<text x="458" y="245" fill="#193732" font-size="38" font-weight="650">一次問完</text>
<text x="458" y="292" fill="#586b60" font-size="22">相關問題合成一則</text>
<rect x="840" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="860" y="195" fill="#586b60" font-size="23">03</text>
<text x="860" y="245" fill="#193732" font-size="38" font-weight="650">選對模型</text>
<text x="860" y="292" fill="#586b60" font-size="22">例行事選低強度</text>
<rect x="36" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">關掉工具</text>
<text x="56" y="510" fill="#586b60" font-size="22">Connector 按需開</text>
<rect x="438" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="458" y="413" fill="#586b60" font-size="23">05</text>
<text x="458" y="463" fill="#193732" font-size="38" font-weight="650">快取交接</text>
<text x="458" y="510" fill="#586b60" font-size="22">Project＋交接摘要</text>
<path d="M396 248H438" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-usage-five-tricks-arrow)"/>
<path d="M798 248H840" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-usage-five-tricks-arrow)"/>
<path d="M1020 336V354H216V378" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-usage-five-tricks-arrow)"/>
<path d="M396 466H438" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-usage-five-tricks-arrow)"/>
<rect x="840" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="860" y="413" fill="#586b60" font-size="23">06</text>
<text x="860" y="463" fill="#193732" font-size="38" font-weight="650">看用量</text>
<text x="860" y="510" fill="#586b60" font-size="22">Usage 找最大來源</text>
<path d="M798 466H840" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#claude-usage-five-tricks-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非省用量的成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">用量是否下降，回到 Usage 頁面看數字</text>
</svg>
