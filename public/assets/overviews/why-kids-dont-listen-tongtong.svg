<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="why-kids-dont-listen-tongtong-title why-kids-dont-listen-tongtong-desc"><title id="why-kids-dont-listen-tongtong-title">孩子講不聽的處理方法</title><desc id="why-kids-dont-listen-tongtong-desc">還原事件 → 先安心 → 給行為價值 → 規則提醒與找解法；情緒仍高時回到先安心。</desc>
<defs><marker id="why-kids-dont-listen-tongtong-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">專訪 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">孩子講不聽，先懂再教</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#why-kids-dont-listen-tongtong-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="22.8">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">還原事件</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">問清經過、分類情境</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="22.8">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">先安心</text>
<text x="656" y="292" fill="#586b60" font-size="27">補依附燃料、降情緒</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="22.8">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">給行為價值</text>
<text x="56" y="510" fill="#586b60" font-size="27">肯定進步、比對前後</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="22.8">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">規則＋解法</text>
<text x="656" y="510" fill="#586b60" font-size="27">只談行為，陪找辦法</text>
<text x="36" y="591" fill="#586b60" font-size="23">講者說明的大腦科學為口述解說，圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">情緒仍高時，回到「先安心」，再談規則</text>
</svg>
