<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">大人先說自己的挫折</title><desc id="desc">挑挫折 → 講出口 → 分工 → 安全漸進 → AI 排練；知識交給 AI，陪伴留給人。</desc>
<defs><marker id="share-struggle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">親師關鍵字 EP.113 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">大人先說自己的挫折，AI 取代不了</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M394 248H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<path d="M798 248H838" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<path d="M1020 341V354H212V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<path d="M394 466H434" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#share-struggle-arrow)"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">挑挫折</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">選一件已走出來的事</text>
<rect x="440" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="195" fill="#586b60" font-size="23">02</text>
<text x="460" y="245" fill="#193732" font-size="38" font-weight="650">講出口</text>
<text x="460" y="292" fill="#586b60" font-size="25">卡住、方法、回頭看</text>
<rect x="844" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="864" y="195" fill="#586b60" font-size="23">03</text>
<text x="864" y="245" fill="#193732" font-size="38" font-weight="650">分工</text>
<text x="864" y="292" fill="#586b60" font-size="25">知識給 AI，陪伴留給人</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">安全漸進</text>
<text x="56" y="510" fill="#586b60" font-size="25">放鬆接觸，獎勵不懲罰</text>
<rect x="440" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="413" fill="#586b60" font-size="23">05</text>
<text x="460" y="463" fill="#193732" font-size="38" font-weight="650">AI 排練</text>
<text x="460" y="510" fill="#586b60" font-size="25">失敗清掉重來，大人在場</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">AI 排練為來賓設想，成效未驗證</text>
</svg>
