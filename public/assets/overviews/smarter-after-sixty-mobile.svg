<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="smarter-after-sixty-title smarter-after-sixty-desc"><title id="smarter-after-sixty-title">六十歲後，越活越聰明</title><desc id="smarter-after-sixty-desc">檢查警訊 → 溫柔好奇 → 問樂趣 → 放掉期待；用週清單每週換一件重複的事。</desc>
<defs><marker id="smarter-after-sixty-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">思維與習慣 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">六十歲後，越活越聰明</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<path d="M240 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<path d="M240 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#smarter-after-sixty-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">檢查警訊</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">麻煩、不想學、不想動</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">溫柔好奇</text>
<text x="48" y="402" fill="#586b60" font-size="20">每週試一件新東西</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">問樂趣</text>
<text x="48" y="548" fill="#586b60" font-size="20">不問學了有什麼用</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">放掉期待</text>
<text x="48" y="694" fill="#586b60" font-size="20">笑看缺點，認識新同輩</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">週清單每週換一件重複的事</text>
</svg>
