<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="management-golf-decision-method-title"><title id="management-golf-decision-method-title">沒選項不叫決策</title>
<defs><marker id="management-golf-decision-method-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">EP.0691 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">沒選項不叫決策：從決心到決策</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="220" width="196" height="230" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="254" fill="#d4e2d4" font-size="20">01</text>
<text x="56" y="294" fill="#fffef9" font-size="32" font-weight="650">停一拍</text>
<text x="56" y="324" fill="#d4e2d4" font-size="18">反應之間有選擇</text>
<path d="M234 335H260" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="262" y="220" width="196" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="282" y="254" fill="#586b60" font-size="20">02</text>
<text x="282" y="294" fill="#193732" font-size="32" font-weight="650">增加選項</text>
<text x="282" y="324" fill="#586b60" font-size="18">沒選項只是決心</text>
<path d="M460 335H486" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="488" y="220" width="196" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="508" y="254" fill="#586b60" font-size="20">03</text>
<text x="508" y="294" fill="#193732" font-size="32" font-weight="650">寫目標</text>
<text x="508" y="324" fill="#586b60" font-size="18">一句話，先聽完意見</text>
<path d="M686 335H712" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="714" y="220" width="196" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="734" y="254" fill="#586b60" font-size="20">04</text>
<text x="734" y="294" fill="#193732" font-size="32" font-weight="650">選工具</text>
<text x="734" y="324" fill="#586b60" font-size="18">偏好題投票，目標題定</text>
<text x="734" y="348" fill="#586b60" font-size="18">案</text>
<path d="M912 335H938" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="940" y="220" width="196" height="230" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="960" y="254" fill="#586b60" font-size="20">05</text>
<text x="960" y="294" fill="#193732" font-size="32" font-weight="650">負責</text>
<text x="960" y="324" fill="#586b60" font-size="18">大局觀，承擔代價</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">結果不如預期時，回頭檢查目標</text>
</svg>
