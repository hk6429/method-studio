<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="planning-vs-doing-ali-abdaal-title planning-vs-doing-ali-abdaal-desc"><title id="planning-vs-doing-ali-abdaal-title">95/5 法則：計畫最多 5%</title><desc id="planning-vs-doing-ali-abdaal-desc">定 95/5 → 認出計畫 → 算小時 → 動手做 → 週回顧；計畫最多 5%，其餘 95% 動手。</desc>
<defs><marker id="planning-vs-doing-ali-abdaal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">95/5 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">計畫最多 5%，其餘動手</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 246V263" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#planning-vs-doing-ali-abdaal-arrow)"/>
<rect x="28" y="150" width="424" height="96" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="180" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="214" fill="#fffef9" font-size="30" font-weight="650">定 95/5</text>
<text x="48" y="238" fill="#d4e2d4" font-size="18">計畫上限 5%</text>
<path d="M240 361V378" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#planning-vs-doing-ali-abdaal-arrow)"/>
<rect x="28" y="265" width="424" height="96" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="295" fill="#586b60" font-size="21">02</text>
<text x="48" y="329" fill="#193732" font-size="30" font-weight="650">認出計畫</text>
<text x="48" y="353" fill="#586b60" font-size="18">沒碰到現實就是計畫</text>
<path d="M240 476V493" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#planning-vs-doing-ali-abdaal-arrow)"/>
<rect x="28" y="380" width="424" height="96" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="410" fill="#586b60" font-size="21">03</text>
<text x="48" y="444" fill="#193732" font-size="30" font-weight="650">算小時</text>
<text x="48" y="468" fill="#586b60" font-size="18">配額寫成數字</text>
<path d="M240 591V608" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#planning-vs-doing-ali-abdaal-arrow)"/>
<rect x="28" y="495" width="424" height="96" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="525" fill="#586b60" font-size="21">04</text>
<text x="48" y="559" fill="#193732" font-size="30" font-weight="650">動手做</text>
<text x="48" y="583" fill="#586b60" font-size="18">每段留下成果</text>
<rect x="28" y="610" width="424" height="96" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="640" fill="#586b60" font-size="21">05</text>
<text x="48" y="674" fill="#193732" font-size="30" font-weight="650">週回顧</text>
<text x="48" y="698" fill="#586b60" font-size="18">檢查實際比例</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">計畫超標就下調上限，下週重來</text>
</svg>
