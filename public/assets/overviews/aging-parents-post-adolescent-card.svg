<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="aging-parents-post-adolescent-title aging-parents-post-adolescent-desc"><title id="aging-parents-post-adolescent-title">「老少女」攻略：把長輩當後青春期</title><desc id="aging-parents-post-adolescent-desc">換框架 → 預告陪跑 → 說出擔心 → 看見努力 → 課題分離 → 給小工具；對方又防衛時，回到說出擔心。</desc>
