<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="understand-etf-before-buying-title understand-etf-before-buying-desc"><title id="understand-etf-before-buying-title">買 ETF 之前的五道提問</title><desc id="understand-etf-before-buying-desc">它是什麼 → 分清類型 → 別當定存 → 避開槓桿 → 先配置；編輯整理，不構成投資建議。</desc>
<defs><marker id="understand-etf-before-buying-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">ETF · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">買 ETF 之前，先問五個問題</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M352 248H414" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#understand-etf-before-buying-arrow)"/>
<path d="M736 248H798" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#understand-etf-before-buying-arrow)"/>
<path d="M900 336V356H228V372" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#understand-etf-before-buying-arrow)"/>
<path d="M352 466H414" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#understand-etf-before-buying-arrow)"/>
<rect x="36" y="160" width="316" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">它是什麼</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">本質是基金</text>
<rect x="420" y="160" width="316" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="195" fill="#586b60" font-size="23">02</text>
<text x="440" y="245" fill="#193732" font-size="38" font-weight="650">分清類型</text>
<text x="440" y="292" fill="#586b60" font-size="27">被動、主動、主題</text>
<rect x="804" y="160" width="316" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="824" y="195" fill="#586b60" font-size="23">03</text>
<text x="824" y="245" fill="#193732" font-size="38" font-weight="650">別當定存</text>
<text x="824" y="292" fill="#586b60" font-size="27">配息不是固定</text>
<rect x="36" y="378" width="316" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">避開槓桿</text>
<text x="56" y="510" fill="#586b60" font-size="27">只用多餘的錢</text>
<rect x="420" y="378" width="316" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="440" y="413" fill="#586b60" font-size="23">05</text>
<text x="440" y="463" fill="#193732" font-size="38" font-weight="650">先配置</text>
<text x="440" y="510" fill="#586b60" font-size="27">股債比例＋拉長</text>
<text x="804" y="468" fill="#586b60" font-size="27">五題都答得出來，再下單</text>
<text x="804" y="510" fill="#586b60" font-size="23">節目稱、不構成投資建議</text>
</svg>
