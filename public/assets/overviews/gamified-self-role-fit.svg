<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="gamified-self-role-fit-title gamified-self-role-fit-desc"><title id="gamified-self-role-fit-title">先選角色，再接任務</title><desc id="gamified-self-role-fit-desc">定方向 → 找線索 → 選角色 → 試任務</desc>
