<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="justin-sung-naturally-gifted-m-title justin-sung-naturally-gifted-m-desc"><title id="justin-sung-naturally-gifted-m-title">困惑羅盤的學習方法</title><desc id="justin-sung-naturally-gifted-m-desc">察覺 → 接回目的 → 寫成問題 → 找答案；答案帶出新困惑，就回到提問再寫一輪。</desc>
<defs><marker id="justin-sung-naturally-gifted-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">CONFUSION COMPASS · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">困惑羅盤：把看不懂寫成問題</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">察覺</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">困惑是學習的症狀，標「？」或「順」</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">接回目的</text>
<text x="48" y="402" fill="#586b60" font-size="20">沒感覺時問：這跟我要做的事有何關係</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">寫成問題</text>
<text x="48" y="548" fill="#586b60" font-size="20">答了就不困惑的具體問句，列清單</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">找答案</text>
<text x="48" y="694" fill="#586b60" font-size="20">一題一勾；新困惑再寫、再答</text>
<text x="28" y="748" fill="#586b60" font-size="19">答案帶出新困惑，就回到提問再寫一輪</text>
<text x="28" y="778" fill="#586b60" font-size="19">圖解為編輯整理，並非成效證明</text>
</svg>
