<rect x="36" y="160" width="336" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="252" fill="#fffef9" font-size="36" font-weight="650">搬進對話窗</text>
<text x="56" y="298" fill="#d4e2d4" font-size="24">一件工作，一個對話</text>
<rect x="432" y="160" width="336" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="452" y="195" fill="#586b60" font-size="23">02</text>
<text x="452" y="252" fill="#193732" font-size="36" font-weight="650">專業下規格</text>
<text x="452" y="298" fill="#586b60" font-size="24">範圍、層次、版面</text>
<rect x="828" y="160" width="336" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="848" y="195" fill="#586b60" font-size="23">03</text>
<text x="848" y="252" fill="#193732" font-size="36" font-weight="650">你來稽核</text>
<text x="848" y="298" fill="#586b60" font-size="24">看關鍵處再放行</text>
<rect x="36" y="378" width="336" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="470" fill="#193732" font-size="36" font-weight="650">先問、先試做</text>
<text x="56" y="516" fill="#586b60" font-size="24">不動原專案</text>
<rect x="432" y="378" width="336" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="452" y="413" fill="#586b60" font-size="23">05</text>
<text x="452" y="470" fill="#193732" font-size="36" font-weight="650">寫成說明檔</text>
<text x="452" y="516" fill="#586b60" font-size="24">agents.md 可重現</text>
<rect x="828" y="378" width="336" height="176" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="848" y="430" fill="#193732" font-size="26" font-weight="650">稽核抓到的錯</text>
<text x="848" y="472" fill="#193732" font-size="26" font-weight="650">補回下一次規格</text>
<text x="848" y="520" fill="#586b60" font-size="22">下一輪先讀說明檔</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">代理負責產出，老師負責規格與把關</text>
