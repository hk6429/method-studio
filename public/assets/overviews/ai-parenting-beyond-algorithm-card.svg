<rect x="36" y="160" width="224" height="150" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="52" y="192" fill="#d4e2d4" font-size="22">01</text>
<text x="52" y="250" fill="#fffef9" font-size="24" font-weight="650">改問「有哪些世界」</text>
<rect x="292" y="160" width="224" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="308" y="192" fill="#586b60" font-size="22">02</text>
<text x="308" y="250" fill="#193732" font-size="26" font-weight="650">每月一件新體驗</text>
<rect x="548" y="160" width="224" height="150" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="564" y="192" fill="#586b60" font-size="22">03</text>
<text x="564" y="250" fill="#193732" font-size="26" font-weight="650">事後不審問</text>
