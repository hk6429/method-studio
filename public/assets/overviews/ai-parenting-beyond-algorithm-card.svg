<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="ai-parenting-beyond-algorithm-title ai-parenting-beyond-algorithm-desc"><title id="ai-parenting-beyond-algorithm-title">演算法不會推薦的世界：六步擴大孩子的世界</title><desc id="ai-parenting-beyond-algorithm-desc">改問題、盤點現況、打破同溫層、旁聽大人、不審問、月底檢查；六步擴大孩子接觸的世界。</desc>
