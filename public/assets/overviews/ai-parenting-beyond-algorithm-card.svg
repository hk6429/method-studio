<path d="M518 235H540" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-parenting-beyond-algorithm-arrow)"/>
<text x="36" y="372" fill="#193732" font-size="28" font-weight="650">讓世界變大，再看孩子自己選</text>
