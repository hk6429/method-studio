<title id="dragon-english-memory-title">從理解一句，到自己寫出來</title>
<desc id="dragon-english-memory-desc">看中文 → 寫英文 → 對答案；四格為編輯整理的練習路線。 讀懂句意：確認意思與情境；遮住英文：保留中文提示；獨立默寫：寫下第一次答案；核對重練：標差異，再試一次</desc>
