<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="newport-deep-life-stack-rethink-title newport-deep-life-stack-rethink-desc"><title id="newport-deep-life-stack-rethink-title">深度人生地圖・編輯整理</title><desc id="newport-deep-life-stack-rethink-desc">看缺口 → 畫三塊領域 → 找缺哪塊 → 在地圖上來回走 → 少而依序 → 寫一頁地圖。</desc>
<defs><marker id="newport-deep-life-stack-rethink-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">Cal Newport · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">深度人生地圖</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="148" width="424" height="80" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="174" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="206" fill="#fffef9" font-size="26" font-weight="650">看缺口</text>
<text x="218" y="206" fill="#586b60" font-size="18">別等一個大改變</text>
<path d="M240 228V246" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="28" y="248" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="274" fill="#586b60" font-size="18">02</text>
<text x="48" y="306" fill="#193732" font-size="26" font-weight="650">畫三塊</text>
<text x="218" y="306" fill="#586b60" font-size="18">能力・價值觀・願景</text>
<path d="M240 328V346" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="28" y="348" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="374" fill="#586b60" font-size="18">03</text>
<text x="48" y="406" fill="#193732" font-size="26" font-weight="650">找缺哪塊</text>
<text x="218" y="406" fill="#586b60" font-size="18">對照三個症狀</text>
<path d="M240 428V446" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="28" y="448" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="474" fill="#586b60" font-size="18">04</text>
<text x="48" y="506" fill="#193732" font-size="26" font-weight="650">來回走</text>
<text x="218" y="506" fill="#586b60" font-size="18">不必照順序</text>
<path d="M240 528V546" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="28" y="548" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="574" fill="#586b60" font-size="18">05</text>
<text x="48" y="606" fill="#193732" font-size="26" font-weight="650">少而依序</text>
<text x="218" y="606" fill="#586b60" font-size="18">先深耕一件事</text>
<path d="M240 628V646" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#newport-deep-life-stack-rethink-arrow)"/>
<rect x="28" y="648" width="424" height="80" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="674" fill="#586b60" font-size="18">06</text>
<text x="48" y="706" fill="#193732" font-size="26" font-weight="650">一頁地圖</text>
<text x="218" y="706" fill="#586b60" font-size="18">這一季的走法</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
