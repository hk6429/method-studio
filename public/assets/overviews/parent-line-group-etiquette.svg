<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="parent-line-group-etiquette-title parent-line-group-etiquette-desc"><title id="parent-line-group-etiquette-title">家長 LINE 群組不焦慮</title><desc id="parent-line-group-etiquette-desc">分級群組 → 靜音與定時看 → 記事本與大群退場 → 群規與公開透明。</desc>
<defs><marker id="parent-line-group-etiquette-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">親子天下 EP.214 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">家長群組，分級後就不焦慮</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M564 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<path d="M564 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<path d="M900 336V354H300V378" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#parent-line-group-etiquette-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">分級群組</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">每個群組有用途</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">靜音＋定時</text>
<text x="656" y="292" fill="#586b60" font-size="27">早晚各看一次</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">記事本＋退場</text>
<text x="56" y="510" fill="#586b60" font-size="27">日期寫下，大群有期限</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">群規＋透明</text>
<text x="656" y="510" fill="#586b60" font-size="27">刪文不踢人，資料完整</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">節目數字為來賓口述（影片稱），未另行核實</text>
</svg>
