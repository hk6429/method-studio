<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="speak-louder-oral-practice-title speak-louder-oral-practice-desc"><title id="speak-louder-oral-practice-title">大音量加原聲的口說練習</title><desc id="speak-louder-oral-practice-desc">備場地 → 選材料 → 盲聽標記 → 胸腔音量 → 三加一；複述卡住就回頭補。</desc>
<defs><marker id="speak-louder-oral-practice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">口說練習 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">大聲加原聲，練得開口</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="142" width="728" height="50" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="175" fill="#d4e2d4" font-size="22">01</text>
<text x="104" y="176" fill="#fffef9" font-size="28" font-weight="650">備場地</text>
<text x="300" y="175" fill="#d4e2d4" font-size="22">一人、封閉、放開音量</text>
<rect x="36" y="200" width="728" height="50" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="233" fill="#586b60" font-size="22">02</text>
<text x="104" y="234" fill="#193732" font-size="28" font-weight="650">選材料</text>
<text x="300" y="233" fill="#586b60" font-size="22">1-2 分鐘、有原聲</text>
<rect x="36" y="258" width="728" height="50" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="291" fill="#586b60" font-size="22">03</text>
<text x="104" y="292" fill="#193732" font-size="28" font-weight="650">盲聽標記</text>
<text x="300" y="291" fill="#586b60" font-size="22">三遍盲聽、標重音</text>
<rect x="36" y="316" width="728" height="50" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="349" fill="#586b60" font-size="22">04</text>
<text x="104" y="350" fill="#193732" font-size="28" font-weight="650">胸腔音量</text>
<text x="300" y="349" fill="#586b60" font-size="22">手貼胸口有震動</text>
<rect x="36" y="374" width="728" height="50" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="407" fill="#586b60" font-size="22">05</text>
<text x="104" y="408" fill="#193732" font-size="28" font-weight="650">三加一</text>
<text x="300" y="407" fill="#586b60" font-size="22">三遍跟讀＋關書複述</text>
<text x="36" y="456" fill="#586b60" font-size="21">複述卡住 → 回到盲聽標記補；圖解為編輯整理</text>
</svg>
