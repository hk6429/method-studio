<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="lovely-money-auto-rolling-in-t lovely-money-auto-rolling-in-d"><title id="lovely-money-auto-rolling-in-t">黃金數字加四個桶子</title><desc id="lovely-money-auto-rolling-in-d">算黃金數字、設半年目標、分四個桶子、長期投資、算退休差距，最後把錢當燃料。</desc>
<defs><marker id="lovely-money-auto-rolling-in-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/><text x="28" y="48" fill="#586b60" font-size="18">編輯整理 · 理財入門</text><text x="28" y="92" fill="#193732" font-size="32" font-weight="650">黃金數字加四個桶子</text><path d="M28 112H452" stroke="#bdcbbb"/><rect x="28" y="132" width="424" height="84" rx="7" fill="#193732" stroke="#bdcbbb"/><text x="44" y="156" fill="#d4e2d4" font-size="18">01</text><text x="44" y="182" fill="#fffef9" font-size="28" font-weight="650">算黃金數字</text><text x="44" y="202" fill="#d4e2d4" font-size="17">月收入減全部支出</text><path d="M240 216V234" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><rect x="28" y="236" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="44" y="260" fill="#586b60" font-size="18">02</text><text x="44" y="286" fill="#193732" font-size="28" font-weight="650">設半年目標</text><text x="44" y="306" fill="#586b60" font-size="17">先為正，再翻倍</text><path d="M240 320V338" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><rect x="28" y="340" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="44" y="364" fill="#586b60" font-size="18">03</text><text x="44" y="390" fill="#193732" font-size="28" font-weight="650">分四個桶子</text><text x="44" y="410" fill="#586b60" font-size="17">先填滿一號急用金</text><path d="M240 424V442" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><rect x="28" y="444" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="44" y="468" fill="#586b60" font-size="18">04</text><text x="44" y="494" fill="#193732" font-size="28" font-weight="650">長期投資</text><text x="44" y="514" fill="#586b60" font-size="17">四守則，定期檢視</text><path d="M240 528V546" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><rect x="28" y="548" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="44" y="572" fill="#586b60" font-size="18">05</text><text x="44" y="598" fill="#193732" font-size="28" font-weight="650">算退休差距</text><text x="44" y="618" fill="#586b60" font-size="17">被動收入對支出</text><path d="M240 632V650" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#lovely-money-auto-rolling-in-arrow)"/><rect x="28" y="652" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/><text x="44" y="676" fill="#586b60" font-size="18">06</text><text x="44" y="702" fill="#193732" font-size="28" font-weight="650">當燃料用</text><text x="44" y="722" fill="#586b60" font-size="17">替自己買選擇權</text><text x="28" y="780" fill="#586b60" font-size="16">每半年回頭更新；例子為編輯示範</text></svg>