<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="ai-lazy-report-zeabur-self-protection-title ai-lazy-report-zeabur-self-protection-desc"><title id="ai-lazy-report-zeabur-self-protection-title">AI 金鑰自保六步</title><desc id="ai-lazy-report-zeabur-self-protection-desc">查前端金鑰 → 查資料庫 → 設花費上限 → 另一位檢查者 → 外洩照順序處理 → 每月複查。</desc>
<defs><marker id="ai-lazy-report-zeabur-self-protection-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">AI懶人報 · 編輯整理</text>
<text x="28" y="92" fill="#193732" font-size="27" font-weight="650">金鑰會被看到，損失要有上限</text>
<path d="M28 112H452" stroke="#bdcbbb"/>
<rect x="28" y="130" width="424" height="84" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="165" fill="#d4e2d4" font-size="17">01</text>
<text x="48" y="199" fill="#fffef9" font-size="26" font-weight="650">查前端金鑰</text>
<text x="48" y="231" fill="#d4e2d4" font-size="18">Network 搜 sk-</text>
<path d="M240 214V230" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-lazy-report-zeabur-self-protection-arrow)"/>
<rect x="28" y="230" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="265" fill="#586b60" font-size="17">02</text>
<text x="48" y="299" fill="#193732" font-size="26" font-weight="650">查資料庫</text>
<text x="48" y="331" fill="#586b60" font-size="18">開保護、別用管理鑰</text>
<path d="M240 314V330" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-lazy-report-zeabur-self-protection-arrow)"/>
<rect x="28" y="330" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="365" fill="#586b60" font-size="17">03</text>
<text x="48" y="399" fill="#193732" font-size="26" font-weight="650">設花費上限</text>
<text x="48" y="431" fill="#586b60" font-size="18">月預算、限頻、刪舊鑰</text>
<path d="M240 414V430" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-lazy-report-zeabur-self-protection-arrow)"/>
<rect x="28" y="430" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="465" fill="#586b60" font-size="17">04</text>
<text x="48" y="499" fill="#193732" font-size="26" font-weight="650">另一位檢查者</text>
<text x="48" y="531" fill="#586b60" font-size="18">複查並自測網址編號</text>
<path d="M240 514V530" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-lazy-report-zeabur-self-protection-arrow)"/>
<rect x="28" y="530" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="565" fill="#586b60" font-size="17">05</text>
<text x="48" y="599" fill="#193732" font-size="26" font-weight="650">外洩照順序</text>
<text x="48" y="631" fill="#586b60" font-size="18">先撤銷、再查帳單</text>
<path d="M240 614V630" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ai-lazy-report-zeabur-self-protection-arrow)"/>
<rect x="28" y="630" width="424" height="84" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="665" fill="#586b60" font-size="17">06</text>
<text x="48" y="699" fill="#193732" font-size="26" font-weight="650">每月複查</text>
<text x="48" y="731" fill="#586b60" font-size="18">告警與消費通知</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
