<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="finkel-lasting-love-title finkel-lasting-love-desc"><title id="finkel-lasting-love-title">用「找、餵、守」養大你們的暗號</title><desc id="finkel-lasting-love-desc">先做 ditto 測試，再用找、餵、守三個動作養大專屬的私人世界；圖解為編輯整理。</desc>
<defs><marker id="finkel-lasting-love-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">TED · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">契合是一起造出來的</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#finkel-lasting-love-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">ditto 測試</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">寫下只有你們懂的話</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">找</text>
<text x="656" y="292" fill="#586b60" font-size="27">留意「只屬於我們」的瞬間</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">餵</text>
<text x="56" y="510" fill="#586b60" font-size="27">重複、延伸、排成儀式</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">守</text>
<text x="656" y="510" fill="#586b60" font-size="27">護住共同世界，留下象徵物</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">新的暗號出現後，再回到「找」</text>
</svg>
