<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="first-60-seconds-conversation-title first-60-seconds-conversation-desc"><title id="first-60-seconds-conversation-title">開口前的 60 秒：TIP</title><desc id="first-60-seconds-conversation-desc">主題、意圖、重點三句開場，送出前再檢查一次。</desc>
<defs><marker id="first-60-seconds-conversation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">TED · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先說清楚，再說細節</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571 248H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#first-60-seconds-conversation-arrow)"/>
<path d="M571 466H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#first-60-seconds-conversation-arrow)"/>
<path d="M900 341V354H300V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#first-60-seconds-conversation-arrow)"/>
<rect x="36" y="160" width="528" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">T 主題</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">我想談什麼</text>
<rect x="636" y="160" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="195" fill="#586b60" font-size="23">02</text>
<text x="656" y="245" fill="#193732" font-size="38" font-weight="650">I 意圖</text>
<text x="656" y="292" fill="#586b60" font-size="27">希望對方做什麼</text>
<rect x="36" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">P 重點</text>
<text x="56" y="510" fill="#586b60" font-size="27">最重要的一句結論</text>
<rect x="636" y="378" width="528" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="413" fill="#586b60" font-size="23">04</text>
<text x="656" y="463" fill="#193732" font-size="38" font-weight="650">送出前檢查</text>
<text x="656" y="510" fill="#586b60" font-size="27">三題都答得出來</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">細節放在三句之後補充</text>
</svg>
