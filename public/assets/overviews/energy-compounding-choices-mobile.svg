<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="ecc-title ecc-desc"><title id="ecc-title">累了別硬撐：從應該到我可以</title><desc id="ecc-desc">接住不舒服 → 寫出需求 → 應該變我可以 → 守住影響圈 → 先排重要事 → 每週回看。</desc>
<defs><marker id="ecc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">能量複利 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">從「應該」到「我可以」</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="78" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="174" fill="#d4e2d4" font-size="20">01</text>
<text x="48" y="198" fill="#fffef9" font-size="28" font-weight="650">接住不舒服</text>
<text x="48" y="216" fill="#d4e2d4" font-size="19">先不轉念，聽聽自己</text>
<path d="M240 224V239" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ecc-arrow)"/>
<rect x="28" y="241" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="269" fill="#586b60" font-size="20">02</text>
<text x="48" y="293" fill="#193732" font-size="28" font-weight="650">寫出需求</text>
<text x="48" y="311" fill="#586b60" font-size="19">情緒背後缺了什麼</text>
<path d="M240 319V334" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ecc-arrow)"/>
<rect x="28" y="336" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="364" fill="#586b60" font-size="20">03</text>
<text x="48" y="388" fill="#193732" font-size="28" font-weight="650">應該變我可以</text>
<text x="48" y="406" fill="#586b60" font-size="19">至少兩個能做的事</text>
<path d="M240 414V429" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ecc-arrow)"/>
<rect x="28" y="431" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="459" fill="#586b60" font-size="20">04</text>
<text x="48" y="483" fill="#193732" font-size="28" font-weight="650">守住影響圈</text>
<text x="48" y="501" fill="#586b60" font-size="19">用願景邀請別人</text>
<path d="M240 509V524" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ecc-arrow)"/>
<rect x="28" y="526" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="554" fill="#586b60" font-size="20">05</text>
<text x="48" y="578" fill="#193732" font-size="28" font-weight="650">先排重要事</text>
<text x="48" y="596" fill="#586b60" font-size="19">重要不緊急先入曆</text>
<path d="M240 604V619" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#ecc-arrow)"/>
<rect x="28" y="621" width="424" height="78" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="649" fill="#586b60" font-size="20">06</text>
<text x="48" y="673" fill="#193732" font-size="28" font-weight="650">每週回看</text>
<text x="48" y="691" fill="#586b60" font-size="19">時間精力投哪裡</text>
<text x="28" y="740" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">新的不舒服出現，就回到第一步</text>
</svg>
