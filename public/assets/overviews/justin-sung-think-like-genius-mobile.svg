<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="justin-sung-think-like-genius-m-title justin-sung-think-like-genius-m-desc"><title id="justin-sung-think-like-genius-m-title">假設結構的思考方法</title><desc id="justin-sung-think-like-genius-m-desc">列清單 → 假設分法 → 推結論 → 圈卡點換結構；推不動的地方是預測錯誤，回到分組再推一次。</desc>
<defs><marker id="justin-sung-think-like-genius-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">假設結構 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先分好組再想，錯了就換</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">列清單</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">所有因素各寫一行，不評價</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">假設分法</text>
<text x="48" y="402" fill="#586b60" font-size="20">硬分成二到四組，畫成圖</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">推結論</text>
<text x="48" y="548" fill="#586b60" font-size="20">用分法寫一句暫定結論</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">圈卡點、換結構</text>
<text x="48" y="694" fill="#586b60" font-size="20">推不動＝預測錯誤，回到 02</text>
<text x="28" y="775" fill="#586b60" font-size="19">卡住不是不會想，是分法要換</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
