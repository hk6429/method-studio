<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="fengzikai-22-repetitions-title fengzikai-22-repetitions-desc"><title id="fengzikai-22-repetitions-title">豐子愷硬學：重複變成看得見的進度</title><desc id="fengzikai-22-repetitions-desc">清生字 → 對讀 → 22 遍畫「讀」字 → 語言島；每一步都寫成可描述、可驗證、有結束點的一句話。</desc>
<defs><marker id="fengzikai-22-repetitions-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">豐子愷硬學 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">把重複，變成看得見的進度</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#fengzikai-22-repetitions-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#fengzikai-22-repetitions-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#fengzikai-22-repetitions-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">清生字</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">紙牌分兩堆，先清完再讀</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">對讀</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">一句對一句，合上譯本再說</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">22 遍畫「讀」字</text>
<text x="56" y="510" fill="#586b60" font-size="27">10、5、5、2 分四天出聲讀</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">語言島</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">選島、寫稿、硬學、上島</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">每一步都寫成一句話：時間＋材料＋遍數＋結束點</text>
</svg>
