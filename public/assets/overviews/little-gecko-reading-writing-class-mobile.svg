<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="little-gecko-reading-writing-class-title little-gecko-reading-writing-class-desc"><title id="little-gecko-reading-writing-class-title">小壁虎老師的語詞三招</title><desc id="little-gecko-reading-writing-class-desc">認詞、遊戲造詞、收集好詞、支援語詞、短文造句、替換擴充六個步驟。</desc>
<defs><marker id="little-gecko-reading-writing-class-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="22">語詞教學 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="30" font-weight="650">語詞，練到會用</text>
<path d="M36 126H444" stroke="#bdcbbb"/>
<rect x="28" y="140" width="424" height="92" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="174" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="195.2" fill="#fffef9" font-size="26" font-weight="650">認詞</text>
<text x="48" y="212" fill="#d4e2d4" font-size="17">部首、上下文、字典</text>
<rect x="28" y="244" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="278" fill="#586b60" font-size="18">02</text>
<text x="48" y="299.2" fill="#193732" font-size="26" font-weight="650">遊戲造詞</text>
<text x="48" y="316" fill="#586b60" font-size="17">注音手寫、分組</text>
<rect x="28" y="348" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="382" fill="#586b60" font-size="18">03</text>
<text x="48" y="403.2" fill="#193732" font-size="26" font-weight="650">收集好詞</text>
<text x="48" y="420" fill="#586b60" font-size="17">互改、語詞百寶庫</text>
<rect x="28" y="452" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="486" fill="#586b60" font-size="18">04</text>
<text x="48" y="507.2" fill="#193732" font-size="26" font-weight="650">支援語詞</text>
<text x="48" y="524" fill="#586b60" font-size="17">同音字、A3 紙</text>
<rect x="28" y="556" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="590" fill="#586b60" font-size="18">05</text>
<text x="48" y="611.2" fill="#193732" font-size="26" font-weight="650">短文造句</text>
<text x="48" y="628" fill="#586b60" font-size="17">先懂再用</text>
<rect x="28" y="660" width="424" height="92" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="694" fill="#586b60" font-size="18">06</text>
<text x="48" y="715.2" fill="#193732" font-size="26" font-weight="650">替換擴充</text>
<text x="48" y="732" fill="#586b60" font-size="17">相似詞、新語詞</text>
<text x="28" y="780" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
