<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">一週統計</text>
<text x="48" y="548" fill="#586b60" font-size="20">畫正字，找出觸發事件</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">隔天說明</text>
<text x="48" y="694" fill="#586b60" font-size="20">不是因為你，是我遇到別的事</text>
<text x="28" y="775" fill="#586b60" font-size="19">低潮時翻一萬次相簿，小嘗試累積成功畫面</text>
