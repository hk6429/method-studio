<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">偏心自己</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">不傷人的前提下，我需要什麼</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">情緒日記</text>
<text x="48" y="402" fill="#586b60" font-size="20">事件＋感覺，自由書寫五分鐘</text>
