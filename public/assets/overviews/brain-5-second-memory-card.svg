<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="brain-5-second-memory-c-title brain-5-second-memory-c-desc"><title id="brain-5-second-memory-c-title">5 秒記憶法：先答再看，用遞增間隔練到說出口</title><desc id="brain-5-second-memory-c-desc">挑十句 → 先答再看 → 遞增間隔 → 換場景改卡；間隔為 5 秒、25 秒、2 分、10 分。</desc>
