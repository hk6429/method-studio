<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">做作品</text>
<text x="48" y="402" fill="#586b60" font-size="20">今天可做的小成果</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">記過程</text>
<text x="48" y="548" fill="#586b60" font-size="20">進展與尚未完成處</text>
