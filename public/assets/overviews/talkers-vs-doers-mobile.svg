<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="talkers-vs-doers-title talkers-vs-doers-desc"><title id="talkers-vs-doers-title">把想法變成行動證據</title><desc id="talkers-vs-doers-desc">找意義 → 做作品 → 記過程 → 留證據</desc>
