<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">敢讓 AI 自己 merge 的六個動作</title><desc id="desc">定標準 → 做驗證 → 換人審 → 錯誤變工具 → 小任務起步 → 過夜加抽樣；抽到問題就回頭改流程。</desc>
<defs><marker id="cursor-ai-self-merge-pstack-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">PSTACK · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先驗證，再放手</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">定標準</text>
<text x="56" y="292" fill="#d4e2d4" font-size="22">要什麼＋怎樣算完成</text>
<rect x="424" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="195" fill="#586b60" font-size="23">02</text>
<text x="444" y="245" fill="#193732" font-size="38" font-weight="650">做驗證</text>
<text x="444" y="292" fill="#586b60" font-size="22">啟動、操作、留證據</text>
<rect x="812" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="195" fill="#586b60" font-size="23">03</text>
<text x="832" y="245" fill="#193732" font-size="38" font-weight="650">換人審</text>
<text x="832" y="292" fill="#586b60" font-size="22">寫的人不判過關</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">錯誤變工具</text>
<text x="56" y="510" fill="#586b60" font-size="22">架構、lint、測試</text>
<rect x="424" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="444" y="413" fill="#586b60" font-size="23">05</text>
<text x="444" y="463" fill="#193732" font-size="38" font-weight="650">小任務起步</text>
<text x="444" y="510" fill="#586b60" font-size="22">一次一兩個</text>
<rect x="812" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="832" y="413" fill="#586b60" font-size="23">06</text>
<text x="832" y="463" fill="#193732" font-size="38" font-weight="650">過夜＋抽樣</text>
<text x="832" y="510" fill="#586b60" font-size="22">決策記錄、出口</text>
<path d="M388 248H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<path d="M776 248H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<path d="M988 336V357H212V376" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<path d="M388 466H422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<path d="M776 466H810" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">抽樣發現問題，就回頭修流程、驗證與 lint</text>
</svg>
