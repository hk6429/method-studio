<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="li-harry-codex-one-person-company-title li-harry-codex-one-person-company-desc"><title id="li-harry-codex-one-person-company-title">重複流程交給 AI 的六步</title><desc id="li-harry-codex-one-person-company-desc">手動做一次、挑母模板、封裝 Skill、排程上雲、人工稽核、預先維運；出錯回到 Skill 修正。</desc>
