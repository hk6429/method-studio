<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="speaking-muscle-memory-prefab-m-title speaking-muscle-memory-prefab-m-desc"><title id="speaking-muscle-memory-prefab-m-title">語塊先備好的口說練習法</title><desc id="speaking-muscle-memory-prefab-m-desc">選框不選詞 → 大聲二十遍 → 兩分鐘輸出 → 紅框再練；卡殼的框隔天回到二十遍。</desc>
<defs><marker id="speaking-muscle-memory-prefab-m-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">語塊口說 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先備好語塊，再開口</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240.0 274V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speaking-muscle-memory-prefab-m-arrow)"/>
<path d="M240.0 420V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speaking-muscle-memory-prefab-m-arrow)"/>
<path d="M240.0 566V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#speaking-muscle-memory-prefab-m-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">選框不選詞</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">十個有洞的句框，對應七天情境</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">大聲二十遍</text>
<text x="48" y="402" fill="#586b60" font-size="20">釘死框，只換空格的詞</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">兩分鐘輸出</text>
<text x="48" y="548" fill="#586b60" font-size="20">出聲串起今天一件事，錄音</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">紅框再練</text>
<text x="48" y="694" fill="#586b60" font-size="20">隔天只練卡住的框，補新框</text>
<text x="28" y="775" fill="#586b60" font-size="19">卡殼的框回到二十遍，不卡的退場</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
