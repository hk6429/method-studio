<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">CLAUDE CODE · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">不改工作流也能更穩的六個動作</text>
