<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="colemedin-11-tiny-coding-agent-fixes-title colemedin-11-tiny-coding-agent-fixes-desc"><title id="colemedin-11-tiny-coding-agent-fixes-title">不改工作流也能更穩的六個動作</title><desc id="colemedin-11-tiny-coding-agent-fixes-desc">規則寫給 agent → 查規則漂移 → 必做改 hook → 保住脈絡額度 → 卡住就交接 → 新對話審查。</desc>
