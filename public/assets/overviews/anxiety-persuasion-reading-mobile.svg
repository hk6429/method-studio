<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="anxiety-persuasion-reading-title anxiety-persuasion-reading-desc"><title id="anxiety-persuasion-reading-title">越想說服，越容易輸：少說多聽五步</title><desc id="anxiety-persuasion-reading-desc">先備好失去 → 被動了解需求 → 重述對方的話 → 答應要慢 → 留白不說話。</desc>
<defs><marker id="anxiety-persuasion-reading-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">少說多聽 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">越想說服，越容易輸</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 255V269" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anxiety-persuasion-reading-arrow)"/>
<path d="M240 376V390" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anxiety-persuasion-reading-arrow)"/>
<path d="M240 497V511" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anxiety-persuasion-reading-arrow)"/>
<path d="M240 618V632" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#anxiety-persuasion-reading-arrow)"/>
<rect x="28" y="150" width="424" height="105" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="182" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="218" fill="#fffef9" font-size="30" font-weight="650">先備好失去</text>
<text x="48" y="244" fill="#d4e2d4" font-size="20">多比較，談不成也行</text>
<rect x="28" y="271" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="303" fill="#586b60" font-size="21">02</text>
<text x="48" y="339" fill="#193732" font-size="30" font-weight="650">被動了解需求</text>
<text x="48" y="365" fill="#586b60" font-size="20">不追問，讓對方先說</text>
<rect x="28" y="392" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="424" fill="#586b60" font-size="21">03</text>
<text x="48" y="460" fill="#193732" font-size="30" font-weight="650">重述對方的話</text>
<text x="48" y="486" fill="#586b60" font-size="20">換句話說確認</text>
<rect x="28" y="513" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="545" fill="#586b60" font-size="21">04</text>
<text x="48" y="581" fill="#193732" font-size="30" font-weight="650">答應要慢</text>
<text x="48" y="607" fill="#586b60" font-size="20">數字由對方說出口</text>
<rect x="28" y="634" width="424" height="105" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="666" fill="#586b60" font-size="21">05</text>
<text x="48" y="702" fill="#193732" font-size="30" font-weight="650">留白不說話</text>
<text x="48" y="728" fill="#586b60" font-size="20">讓對方的焦慮代言</text>
<text x="28" y="775" fill="#586b60" font-size="19">先調整位置，再調整說話節奏</text>
<text x="28" y="752" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
