<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="kunihiro-fukudoku-speaking-title kunihiro-fukudoku-speaking-desc"><title id="kunihiro-fukudoku-speaking-title">國弘正雄式朗讀</title><desc id="kunihiro-fukudoku-speaking-desc">選短文、精聽模仿、正字記錄朗讀、融入日常，最後錄音驗收。</desc>
<defs><marker id="kunihiro-fukudoku-speaking-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">影片方法 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">正字朗讀，讀到順口</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<path d="M240 274 V291" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kunihiro-fukudoku-speaking-arrow)"/>
<path d="M240 420 V437" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kunihiro-fukudoku-speaking-arrow)"/>
<path d="M240 566 V583" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#kunihiro-fukudoku-speaking-arrow)"/>
<rect x="28" y="154" width="424" height="115" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="189" fill="#d4e2d4" font-size="21">01</text>
<text x="48" y="230" fill="#fffef9" font-size="30" font-weight="650">選文本</text>
<text x="48" y="256" fill="#d4e2d4" font-size="20">300 到 500 字，有母語音訊</text>
<rect x="28" y="300" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="335" fill="#586b60" font-size="21">02</text>
<text x="48" y="376" fill="#193732" font-size="30" font-weight="650">精聽模仿</text>
<text x="48" y="402" fill="#586b60" font-size="20">逐句約 20 遍，標連讀重音</text>
<rect x="28" y="446" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="481" fill="#586b60" font-size="21">03</text>
<text x="48" y="522" fill="#193732" font-size="30" font-weight="650">正字朗讀</text>
<text x="48" y="548" fill="#586b60" font-size="20">讀完一遍畫一筆</text>
<rect x="28" y="592" width="424" height="115" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="627" fill="#586b60" font-size="21">04</text>
<text x="48" y="668" fill="#193732" font-size="30" font-weight="650">開口驗收</text>
<text x="48" y="694" fill="#586b60" font-size="20">錄音換內容說，卡住補讀</text>
<text x="28" y="741" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
<text x="28" y="775" fill="#586b60" font-size="19">影片稱遍數與階段；驗收為編輯補充</text>
</svg>
