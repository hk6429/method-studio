<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="aging-parents-post-adolescent-title aging-parents-post-adolescent-desc"><title id="aging-parents-post-adolescent-title">「老少女」攻略：把長輩當後青春期</title><desc id="aging-parents-post-adolescent-desc">換框架 → 預告陪跑 → 說出擔心 → 看見努力 → 課題分離 → 給小工具；對方又防衛時，回到說出擔心。</desc>
<defs><marker id="aging-parents-post-adolescent-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">後青春期溝通 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先降低防衛，再看見卡點</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="146" width="528" height="120" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="178" fill="#d4e2d4" font-size="22">01</text>
<text x="56" y="218" fill="#fffef9" font-size="36" font-weight="650">換框架</text>
<text x="56" y="250" fill="#d4e2d4" font-size="25">長輩像後青春期</text>
<rect x="636" y="146" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="178" fill="#586b60" font-size="22">02</text>
<text x="656" y="218" fill="#193732" font-size="36" font-weight="650">預告陪跑</text>
<text x="656" y="250" fill="#586b60" font-size="25">先踩點、先預告</text>
<rect x="36" y="286" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="318" fill="#586b60" font-size="22">03</text>
<text x="56" y="358" fill="#193732" font-size="36" font-weight="650">說出擔心</text>
<text x="56" y="390" fill="#586b60" font-size="25">不求回應不講理</text>
<rect x="636" y="286" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="318" fill="#586b60" font-size="22">04</text>
<text x="656" y="358" fill="#193732" font-size="36" font-weight="650">看見努力</text>
<text x="656" y="390" fill="#586b60" font-size="25">再問卡在哪裡</text>
<rect x="36" y="426" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="458" fill="#586b60" font-size="22">05</text>
<text x="56" y="498" fill="#193732" font-size="36" font-weight="650">課題分離</text>
<text x="56" y="530" fill="#586b60" font-size="25">放下「應該」</text>
<rect x="636" y="426" width="528" height="120" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656" y="458" fill="#586b60" font-size="22">06</text>
<text x="656" y="498" fill="#193732" font-size="36" font-weight="650">給小工具</text>
<text x="656" y="530" fill="#586b60" font-size="25">進度表、架構圖</text>
<path d="M571 206H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<path d="M900 266V276H300V284" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<path d="M571 346H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<path d="M900 406V416H300V424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<path d="M571 486H624" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#aging-parents-post-adolescent-arrow)"/>
<text x="36" y="598" fill="#586b60" font-size="23">對方又防衛 → 回到「說出擔心」，不要加碼講道理</text>
<text x="36" y="630" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
