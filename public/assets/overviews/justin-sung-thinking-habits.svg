<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="justin-sung-thinking-habits-title justin-sung-thinking-habits-desc"><title id="justin-sung-thinking-habits-title">讓思考被看見的五個說話習慣</title><desc id="justin-sung-thinking-habits-desc">重述問題 → 先定結論 → 分開觀察 → 加反方條件 → 壓成一兩句；每天記下使用，下週換一個習慣。</desc>
<defs><marker id="justin-sung-thinking-habits-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">五個思考習慣 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先說結論，再談理由</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M398 240H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-thinking-habits-arrow)"/>
<path d="M802 240H844" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-thinking-habits-arrow)"/>
<path d="M985 326V356H217V380" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-thinking-habits-arrow)"/>
<path d="M398 466H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-thinking-habits-arrow)"/>
<path d="M802 466H844" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-thinking-habits-arrow)"/>
<rect x="36" y="160" width="362" height="166" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="243" fill="#fffef9" font-size="36" font-weight="650">重述問題</text>
<text x="56" y="290" fill="#d4e2d4" font-size="24">你真正問的是？拆成幾部分</text>
<rect x="440" y="160" width="362" height="166" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="195" fill="#586b60" font-size="23">02</text>
<text x="460" y="243" fill="#193732" font-size="36" font-weight="650">先定結論</text>
<text x="460" y="290" fill="#586b60" font-size="24">不確定也放進結論說</text>
<rect x="844" y="160" width="320" height="166" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="864" y="195" fill="#586b60" font-size="23">03</text>
<text x="864" y="243" fill="#193732" font-size="36" font-weight="650">分開觀察</text>
<text x="864" y="290" fill="#586b60" font-size="24">我看到＿，所以我認為＿</text>
<rect x="36" y="386" width="362" height="166" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="421" fill="#586b60" font-size="23">04</text>
<text x="56" y="469" fill="#193732" font-size="36" font-weight="650">加反方條件</text>
<text x="56" y="516" fill="#586b60" font-size="24">出現＿，我會改變決定</text>
<rect x="440" y="386" width="362" height="166" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="460" y="421" fill="#586b60" font-size="23">05</text>
<text x="460" y="469" fill="#193732" font-size="36" font-weight="650">壓成一兩句</text>
<text x="460" y="516" fill="#586b60" font-size="24">先講短版，追問再展開</text>
<rect x="844" y="386" width="320" height="166" rx="7" fill="#d4e2d4" stroke="#bdcbbb"/>
<text x="864" y="421" fill="#586b60" font-size="23">每天</text>
<text x="864" y="469" fill="#193732" font-size="36" font-weight="650">記下使用</text>
<text x="864" y="516" fill="#586b60" font-size="24">場合／有沒有用／反應</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，順序與練法非講者規定，並非成效證明</text>
<text x="36" y="625" fill="#586b60" font-size="23">一週只練一個習慣，下週換下一個</text>
</svg>
