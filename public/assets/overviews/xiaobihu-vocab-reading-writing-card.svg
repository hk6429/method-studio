<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="xiaobihu-vocab-reading-writing-title xiaobihu-vocab-reading-writing-desc"><title id="xiaobihu-vocab-reading-writing-title">語詞教學：從認識詞到寫進作文</title><desc id="xiaobihu-vocab-reading-writing-desc">花瓣組詞 → 教室造詞 → 訪問交換 → 遊戲練用 → 情境造句 → 寫進作文；每招練三、四次再換。</desc>
