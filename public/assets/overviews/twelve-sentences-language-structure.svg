<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="twelve-sentences-language-structure-title twelve-sentences-language-structure-desc"><title id="twelve-sentences-language-structure-title">十二句法：看骨架、換零件</title><desc id="twelve-sentences-language-structure-desc">寫十二句 → 語序與代名詞 → 疑問否定未來 → 換零件 → AI 字對字 → 每天三句；卡住就回到骨架。</desc>
<defs><marker id="twelve-sentences-language-structure-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">Tim Ferriss 十二句法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先看骨架，再換零件</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="352" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">寫十二句</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">當作假人，不背</text>
<path d="M392 248H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="428" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="195" fill="#586b60" font-size="23">02</text>
<text x="448" y="245" fill="#193732" font-size="38" font-weight="650">語序與代名詞</text>
<text x="448" y="292" fill="#586b60" font-size="27">誰做動作、給誰</text>
<path d="M784 248H816" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="820" y="160" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="840" y="195" fill="#586b60" font-size="23">03</text>
<text x="840" y="245" fill="#193732" font-size="38" font-weight="650">疑問否定未來</text>
<text x="840" y="292" fill="#586b60" font-size="27">規則寫在句子下</text>
<rect x="36" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">換零件</text>
<text x="56" y="510" fill="#586b60" font-size="27">骨架不動</text>
<path d="M392 466H424" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="428" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="448" y="413" fill="#586b60" font-size="23">05</text>
<text x="448" y="463" fill="#193732" font-size="38" font-weight="650">AI 字對字</text>
<text x="448" y="510" fill="#586b60" font-size="27">只拆解，不開口用</text>
<path d="M784 466H816" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<rect x="820" y="378" width="352" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="840" y="413" fill="#586b60" font-size="23">06</text>
<text x="840" y="463" fill="#193732" font-size="38" font-weight="650">每天三句</text>
<text x="840" y="510" fill="#586b60" font-size="27">改句、朗讀二十遍</text>
<path d="M996 338V356H212V374" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#twelve-sentences-language-structure-arrow)"/>
<text x="36" y="591" fill="#586b60" font-size="23">卡住就回到骨架，再換一次零件</text>
<text x="36" y="625" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
