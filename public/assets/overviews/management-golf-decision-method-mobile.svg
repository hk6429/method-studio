<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="management-golf-decision-method-title"><title id="management-golf-decision-method-title">沒選項不叫決策</title>
<defs><marker id="management-golf-decision-method-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">EP.0691 · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">沒選項不叫決策</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="150" width="424" height="90" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="220" fill="#fffef9" font-size="28" font-weight="650">停一拍</text>
<text x="160" y="204" fill="#d4e2d4" font-size="19">反應之間有選擇</text>
<path d="M240 240V266" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="28" y="268" width="424" height="90" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="338" fill="#193732" font-size="28" font-weight="650">增加選項</text>
<text x="160" y="322" fill="#586b60" font-size="19">沒選項只是決心</text>
<path d="M240 358V384" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="28" y="386" width="424" height="90" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="456" fill="#193732" font-size="28" font-weight="650">寫目標</text>
<text x="160" y="440" fill="#586b60" font-size="19">一句話，先聽完意見</text>
<path d="M240 476V502" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="28" y="504" width="424" height="90" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="574" fill="#193732" font-size="28" font-weight="650">選工具</text>
<text x="160" y="558" fill="#586b60" font-size="19">偏好題投票，目標題定案</text>
<path d="M240 594V620" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#management-golf-decision-method-arrow)"/>
<rect x="28" y="622" width="424" height="90" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="692" fill="#193732" font-size="28" font-weight="650">負責</text>
<text x="160" y="676" fill="#586b60" font-size="19">大局觀，承擔代價</text>
<text x="28" y="775" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
