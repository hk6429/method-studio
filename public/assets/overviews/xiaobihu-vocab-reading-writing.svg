<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="xiaobihu-vocab-reading-writing-title xiaobihu-vocab-reading-writing-desc"><title id="xiaobihu-vocab-reading-writing-title">語詞教學：從認識詞到寫進作文</title><desc id="xiaobihu-vocab-reading-writing-desc">花瓣組詞 → 教室造詞 → 訪問交換 → 遊戲練用 → 情境造句 → 寫進作文；每招練三、四次再換。</desc>
<defs><marker id="xiaobihu-vocab-reading-writing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">語詞教學 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">從認識詞，到把詞寫進作文</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<rect x="36" y="160" width="360" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="191" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">花瓣組詞</text>
<text x="56" y="292" fill="#d4e2d4" font-size="25">生字找搭檔</text>
<path d="M400 248H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiaobihu-vocab-reading-writing-arrow)"/>
<rect x="444" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="464" y="191" fill="#586b60" font-size="23">02</text>
<text x="464" y="245" fill="#193732" font-size="38" font-weight="650">教室造詞</text>
<text x="464" y="292" fill="#586b60" font-size="25">限時、同學互改</text>
<path d="M808 248H848" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiaobihu-vocab-reading-writing-arrow)"/>
<rect x="852" y="160" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="872" y="191" fill="#586b60" font-size="23">03</text>
<text x="872" y="245" fill="#193732" font-size="38" font-weight="650">訪問交換</text>
<text x="872" y="292" fill="#586b60" font-size="25">累積語詞寶典</text>
<rect x="36" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="409" fill="#586b60" font-size="23">04</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">遊戲練用</text>
<text x="56" y="510" fill="#586b60" font-size="25">猜詞、冰果、卡牌</text>
<path d="M400 466H440" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiaobihu-vocab-reading-writing-arrow)"/>
<rect x="444" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="464" y="409" fill="#586b60" font-size="23">05</text>
<text x="464" y="463" fill="#193732" font-size="38" font-weight="650">情境造句</text>
<text x="464" y="510" fill="#586b60" font-size="25">原句修改</text>
<path d="M808 466H848" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiaobihu-vocab-reading-writing-arrow)"/>
<rect x="852" y="378" width="360" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="872" y="409" fill="#586b60" font-size="23">06</text>
<text x="872" y="463" fill="#193732" font-size="38" font-weight="650">寫進作文</text>
<text x="872" y="510" fill="#586b60" font-size="25">替換詞庫、指定用詞</text>
<path d="M1032 340V356H216V374" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#xiaobihu-vocab-reading-writing-arrow)"/>
<text x="36" y="625" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明；每招練三、四次再換</text>
</svg>
