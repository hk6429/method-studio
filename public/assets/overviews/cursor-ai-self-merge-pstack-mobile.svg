<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="title desc"><title id="title">敢讓 AI 自己 merge 的六個動作</title><desc id="desc">定標準 → 做驗證 → 換人審 → 錯誤變工具 → 小任務起步 → 過夜加抽樣；抽到問題就回頭改流程。</desc>
<defs><marker id="cursor-ai-self-merge-pstack-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="480" height="800" fill="#f0f2e9"/>
<text x="28" y="48" fill="#586b60" font-size="22">PSTACK · 編輯整理</text>
<text x="28" y="100" fill="#193732" font-size="27" font-weight="650">先驗證，再放手</text>
<path d="M28 126H452" stroke="#bdcbbb"/>
<rect x="28" y="146" width="424" height="76" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="48" y="170" fill="#d4e2d4" font-size="18">01</text>
<text x="48" y="196" fill="#fffef9" font-size="28" font-weight="650">定標準</text>
<text x="48" y="214" fill="#d4e2d4" font-size="18">要什麼＋怎樣算完成</text>
<path d="M240 222V238" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<rect x="28" y="238" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="262" fill="#586b60" font-size="18">02</text>
<text x="48" y="288" fill="#193732" font-size="28" font-weight="650">做驗證</text>
<text x="48" y="306" fill="#586b60" font-size="18">啟動、操作、留證據</text>
<path d="M240 314V330" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<rect x="28" y="330" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="354" fill="#586b60" font-size="18">03</text>
<text x="48" y="380" fill="#193732" font-size="28" font-weight="650">換人審</text>
<text x="48" y="398" fill="#586b60" font-size="18">寫的人不判過關</text>
<path d="M240 406V422" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<rect x="28" y="422" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="446" fill="#586b60" font-size="18">04</text>
<text x="48" y="472" fill="#193732" font-size="28" font-weight="650">錯誤變工具</text>
<text x="48" y="490" fill="#586b60" font-size="18">架構、lint、測試</text>
<path d="M240 498V514" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<rect x="28" y="514" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="538" fill="#586b60" font-size="18">05</text>
<text x="48" y="564" fill="#193732" font-size="28" font-weight="650">小任務起步</text>
<text x="48" y="582" fill="#586b60" font-size="18">一次一兩個</text>
<path d="M240 590V606" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#cursor-ai-self-merge-pstack-arrow)"/>
<rect x="28" y="606" width="424" height="76" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="48" y="630" fill="#586b60" font-size="18">06</text>
<text x="48" y="656" fill="#193732" font-size="28" font-weight="650">過夜＋抽樣</text>
<text x="48" y="674" fill="#586b60" font-size="18">決策記錄、出口</text>
<text x="28" y="742" fill="#586b60" font-size="18">抽樣發現問題，就回頭修流程與 lint</text>
<text x="28" y="772" fill="#586b60" font-size="18">圖解為編輯整理，並非成效證明</text>
</svg>
