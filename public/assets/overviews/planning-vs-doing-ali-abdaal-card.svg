<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="planning-vs-doing-ali-abdaal-title planning-vs-doing-ali-abdaal-desc"><title id="planning-vs-doing-ali-abdaal-title">95/5 法則：計畫最多 5%</title><desc id="planning-vs-doing-ali-abdaal-desc">定 95/5 → 認出計畫 → 算小時 → 動手做 → 週回顧；計畫最多 5%，其餘 95% 動手。</desc>
