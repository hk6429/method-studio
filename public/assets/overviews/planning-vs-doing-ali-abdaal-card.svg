<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="800" height="480" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">95/5 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="36" font-weight="650">計畫 5%，動手 95%</text>
<path d="M36 126H764" stroke="#bdcbbb"/>
<rect x="36" y="160" width="40" height="112" rx="7" fill="#193732"/>
<rect x="76" y="160" width="688" height="112" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="100" y="205" fill="#586b60" font-size="23">計畫上限</text>
<text x="100" y="250" fill="#193732" font-size="38" font-weight="650">5% 計畫</text>
<rect x="36" y="310" width="728" height="112" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="345" fill="#d4e2d4" font-size="23">其餘全部</text>
<text x="56" y="395" fill="#fffef9" font-size="38" font-weight="650">95% 動手做</text>
<text x="36" y="455" fill="#586b60" font-size="23">算小時 → 動手 → 週回顧</text>
</svg>
