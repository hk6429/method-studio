<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="word-odyssey-spaced-journey-mobile-title word-odyssey-spaced-journey-mobile-desc"><title id="word-odyssey-spaced-journey-mobile-title">一次十字，隔次再遇見</title><desc id="word-odyssey-spaced-journey-mobile-desc">先舊再新 → 連結語境 → 獨立作答 → 到期回訪；下一輪回到舊字，區分首答與重試。</desc>
<defs><marker id="word-odyssey-spaced-journey-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="640" height="1000" fill="#f0f2e9"/>
<text x="40" y="64" fill="#586b60" font-size="25" font-weight="500">字旅 · 微任務複習路線</text>
<text x="40" y="127" fill="#193732" font-size="40" font-weight="650">一次十字，</text>
<text x="40" y="183" fill="#193732" font-size="40" font-weight="650">隔次再遇見</text>
<rect x="40" y="220" width="530" height="150" rx="5" fill="#193732" stroke="#bdcbbb"/><text x="62" y="254" fill="#d4e2d4" font-size="20" font-weight="500">01</text><text x="62" y="305" fill="#fffef9" font-size="32" font-weight="650">先舊再新</text><text x="62" y="345" fill="#d4e2d4" font-size="23" font-weight="500">每小關最多十字</text>
<path d="M304 373v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#word-odyssey-spaced-journey-mobile-arrow)"/>
<rect x="40" y="394" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="428" fill="#586b60" font-size="20" font-weight="500">02</text><text x="62" y="479" fill="#193732" font-size="32" font-weight="650">連結語境</text><text x="62" y="519" fill="#586b60" font-size="23" font-weight="500">字義連到情境</text>
<path d="M304 547v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#word-odyssey-spaced-journey-mobile-arrow)"/>
<rect x="40" y="568" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="602" fill="#586b60" font-size="20" font-weight="500">03</text><text x="62" y="653" fill="#193732" font-size="32" font-weight="650">獨立作答</text><text x="62" y="693" fill="#586b60" font-size="23" font-weight="500">分清首答與重試</text>
<path d="M304 721v16" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#word-odyssey-spaced-journey-mobile-arrow)"/>
<rect x="40" y="742" width="530" height="150" rx="5" fill="#fffef9" stroke="#bdcbbb"/><text x="62" y="776" fill="#586b60" font-size="20" font-weight="500">04</text><text x="62" y="827" fill="#193732" font-size="32" font-weight="650">到期回訪</text><text x="62" y="867" fill="#586b60" font-size="23" font-weight="500">完成保存再回想</text>
<path d="M574 812H594Q608 812 608 798V302Q608 288 594 288H577" fill="none" stroke="#586b60" stroke-width="2.4" marker-end="url(#word-odyssey-spaced-journey-mobile-arrow)"/>
<text x="40" y="941" fill="#193732" font-size="29" font-weight="600">到期字 → 下輪先重溫</text>
<text x="40" y="978" fill="#586b60" font-size="25" font-weight="500">完成小關，隔次再回想。</text>
</svg>