<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="justin-sung-naturally-gifted-title justin-sung-naturally-gifted-desc"><title id="justin-sung-naturally-gifted-title">困惑羅盤的學習方法</title><desc id="justin-sung-naturally-gifted-desc">察覺 → 接回目的 → 寫成問題 → 找答案；答案帶出新困惑，就回到提問再寫一輪。</desc>
<defs><marker id="justin-sung-naturally-gifted-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">CONFUSION COMPASS · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">困惑羅盤：把「看不懂」寫成問題，再一題一題答</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-naturally-gifted-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">察覺</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">困惑是學習的症狀，頁邊標「？」或「順」</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">接回目的</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">沒感覺時問：這跟我要做的事有何關係？</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">寫成問題</text>
<text x="56" y="510" fill="#586b60" font-size="27">答了就不困惑的具體問句，列成清單</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">找答案</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">一題一勾；新困惑再寫、再答</text>
<text x="36" y="625" fill="#586b60" font-size="23">答案帶出新困惑，就回到提問；一直重讀卻沒新問題時要停下來</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
