<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="justin-sung-think-like-genius-title justin-sung-think-like-genius-desc"><title id="justin-sung-think-like-genius-title">假設結構的思考方法</title><desc id="justin-sung-think-like-genius-desc">列清單 → 假設分法 → 推結論 → 圈卡點換結構；推不動的地方是預測錯誤，回到分組再推一次。</desc>
<defs><marker id="justin-sung-think-like-genius-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">假設結構 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先分好組再想，錯了就換一種分法</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#justin-sung-think-like-genius-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">列清單</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">所有因素各寫一行，不評價</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">假設分法</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">硬分成二到四組，畫成圖</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">推結論</text>
<text x="56" y="510" fill="#586b60" font-size="27">用分法寫一句暫定結論</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">圈卡點、換結構</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">推不動＝預測錯誤，回到 02</text>
<text x="36" y="625" fill="#586b60" font-size="23">卡住不是不會想，是分法要換；通常兩到三輪</text>
<text x="36" y="591" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
