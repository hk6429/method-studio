<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="zpl-title zpl-desc"><title id="zpl-title">零壓力學習法的四個動作</title><desc id="zpl-desc">拆壓力 → 排時段 → 做輸出 → 週檢核；卡住時跳過、靜置或問人，身心照顧排進計畫。</desc>
<defs><marker id="zpl-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#586b60" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}</style>
<rect width="1200" height="650" fill="#f0f2e9"/>
<text x="36" y="48" fill="#586b60" font-size="26">零壓力學習法 · 編輯整理</text>
<text x="36" y="100" fill="#193732" font-size="42" font-weight="650">先拆壓力，再排讀書</text>
<path d="M36 126H1164" stroke="#bdcbbb"/>
<path d="M571.0 248.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-arrow)"/>
<path d="M571.0 466.0H624.0" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-arrow)"/>
<path d="M900.0 341V354H300.0V368" stroke="#586b60" fill="none" stroke-width="2.5" marker-end="url(#zpl-arrow)"/>
<rect x="36" y="160" width="528.0" height="176" rx="7" fill="#193732" stroke="#bdcbbb"/>
<text x="56" y="195" fill="#d4e2d4" font-size="23">01</text>
<text x="56" y="245" fill="#fffef9" font-size="38" font-weight="650">拆壓力</text>
<text x="56" y="292" fill="#d4e2d4" font-size="27">急性或慢性，目標寫成 SMART</text>
<rect x="636.0" y="160" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="195" fill="#586b60" font-size="23">02</text>
<text x="656.0" y="245" fill="#193732" font-size="38" font-weight="650">排時段</text>
<text x="656.0" y="292" fill="#586b60" font-size="27">間隔複習，30 分鐘換一科</text>
<rect x="36" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="56" y="413" fill="#586b60" font-size="23">03</text>
<text x="56" y="463" fill="#193732" font-size="38" font-weight="650">做輸出</text>
<text x="56" y="510" fill="#586b60" font-size="27">自問、教人、出題</text>
<rect x="636.0" y="378" width="528.0" height="176" rx="7" fill="#fffef9" stroke="#bdcbbb"/>
<text x="656.0" y="413" fill="#586b60" font-size="23">04</text>
<text x="656.0" y="463" fill="#193732" font-size="38" font-weight="650">週檢核</text>
<text x="656.0" y="510" fill="#586b60" font-size="27">四問檢查讀法，重排下週</text>
<text x="36" y="591" fill="#586b60" font-size="23">卡住時：跳過、靜置或問會的人；睡眠與運動排進計畫</text>
<text x="36" y="625" fill="#586b60" font-size="23">圖解為編輯整理，並非成效證明</text>
</svg>
